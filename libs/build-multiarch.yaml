# Scarab's multi-architecture build library: build an image for amd64 and
# for arm64, each on its own node pool, and push both and the index that
# joins them from one Step. Only that Step holds the registry credential.
# An org admin installs it like any library, from
# github.com/thulasi-ram/scarab-ci//libs/build-multiarch.yaml at a release
# commit, and trusts that source for the build sandbox and with the
# registry credential before any Run may use it.
#
#   - id: app
#     invoke: lib:thulasi-ram::scarab-ci::build-multiarch
#     needs: [checkout, meta]
#     placement_profiles: { amd64: [amd64-builders], arm64: [arm64-builders], push: [ecr-push] }
#     with:
#       image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/app:${{ outputs.meta.tag }}
#       extra_tags: latest
#       context: .
#       dockerfile: Dockerfile
#
# Deploy by `${{ outputs.app.push.digest }}`.
#
# It has three Steps, and `needs: [app]` reaches the last:
#
#   app/amd64  build the image with rootless BuildKit, the same script
#   app/arm64  as build.yaml's build Step. Each asks for
#              `security: { sandbox: rootless-buildkit }`, which Run creation
#              admits only when the org trusts this file's source for the
#              sandbox. They hold no registry credential: BuildKit runs with
#              --oci-worker-no-process-sandbox, so a Dockerfile RUN shares
#              buildkitd's PID namespace and could read anything the Step
#              holds. Each writes its image as an OCI image layout at
#              /workspace/.scarab-build/<key>/oci, the key the first 32 hex
#              characters of the SHA-256 of the Step's id, and names the
#              path and the image's digest in its `image` result. Each
#              builds the architecture of the node it runs on, so route
#              each to its node pool with the map form of
#              `placement_profiles`. Two builds that land on nodes of one
#              architecture make two images of one platform, which the push
#              Step refuses.
#   app/push   pushes both images by digest, pushes the index under
#              `image`'s tag, tags each image <tag>-amd64 and <tag>-arm64
#              (with `arch_tags`), then tags the index with each extra tag,
#              the same script as image-index.yaml's Step. It asks for
#              `registry_auth: true`: Scarab mounts the Run's registry
#              credential at /scarab/registry/config.json and points
#              DOCKER_CONFIG at it, when the org trusts this file's source
#              with the registry credential. It runs no code from the
#              repository. It receives only the two builds' workspaces
#              (`inputs: [amd64, arm64]`), so it needs disk for both
#              layouts. It checks every layout before its first registry
#              write (only directories and regular files, no symlink at any
#              level, inside the workspace; the manifest and every blob it
#              names hash to their names; the manifest is the digest its
#              build's result names; one image per platform), as
#              image-index.yaml describes. That check shows a layout was not
#              changed after the result named it, not that the build Step
#              made it. A retried push Step pushes both architectures
#              again; each write puts the same content under the same name.
#
# Output:
#   ${{ outputs.app.push }}  {"ref": "<repository>@sha256:…", "digest":
#                            "sha256:…"}, as crane reported the index push.
#                            Deploy by this digest.
#
# A fork pull request, or a Run locked out of its Environment's secrets, gets
# no registry credential, and Scarab tells every Step so with
# SCARAB_FORK_PR=true: the build Steps then export no layer cache and write
# no layout, and the push Step pushes nothing and exits 0, whatever the
# inputs say. A missing SCARAB_FORK_PR is treated the same way. On any
# other Run, a build Step that published no layout fails the push Step
# (exit 2), so the index never leaves an architecture out.
#
# Every input reaches the scripts through an environment variable, never the
# command. The layer cache is `none` or `s3`, reached with the build Pod's
# own identity; a registry cache is not offered, as writing one needs the
# push credential in a build Step.
#
# An operator marks a profile that grants push access `registry_auth_only`.
# Scarab applies it only to the push Step, and only when the launch found
# that Step eligible for a credential; named on a build Step it fails the
# build. So route such a profile with the map form, as above.
#
# Inputs:
#   image       the tag to push the index to, e.g. ghcr.io/acme/app:1.2.0; a
#               reference with a tag and no digest
#   extra_tags  more tags for the index, in `image`'s repository: tag names,
#               not references, separated by spaces or line breaks
#               (default empty)
#   arch_tags   also tag each architecture's image <tag>-amd64 and
#               <tag>-arm64, whether or not the arm64 config names v8
#               (default true). A registry
#               rule that expires untagged images could otherwise remove an
#               image the index names
#   context     the build context, relative to the workspace (default ".")
#   dockerfile  the Dockerfile, relative to the context (default "Dockerfile")
#   build_args  one KEY=VALUE per line, each passed as a build argument. A
#               name starting BUILDKIT_ (in any case) is refused. Do not
#               build this input from text someone else writes
#   cache       the layer cache: none or s3 (default none)
#   cache_bucket, cache_region, cache_name
#               for cache: s3, where the cache is kept; each build keeps
#               its own cache, `<cache_name>-amd64` and `<cache_name>-arm64`
#               (`buildkit-<arch>` when cache_name is empty)
#   insecure_push
#               reach the registry over plain HTTP, for a registry with no
#               TLS (default false); for a test or development registry
#               only. crane then skips TLS verification too, so the push
#               Step refuses it (exit 2) when it holds a registry login
kind: library
interface:
  inputs:
    - name: image
      type: string
      validate: 'value.matches("^[a-z0-9]([a-z0-9._-]*[a-z0-9])?(:[0-9]+)?(/[a-z0-9]([a-z0-9._-]*[a-z0-9])?)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$")'
      description: the tag to push the index to, with a tag and no digest
    - name: extra_tags
      type: string
      required: false
      default: ""
      validate: 'value.matches("^[ \n]*([A-Za-z0-9_][A-Za-z0-9_.-]{0,127}([ \n]+[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})*)?[ \n]*$")'
      description: more tags for the index, tag names separated by spaces or line breaks
    - name: arch_tags
      type: boolean
      required: false
      default: true
      description: also tag each architecture's image <tag>-<architecture>
    - name: context
      type: string
      required: false
      default: "."
      validate: 'value != "" && !value.matches("^/|(^|/)[.][.](/|$)|[,[:cntrl:]]")'
      description: the build context, relative to the workspace, with no ".." and no ","
    - name: dockerfile
      type: string
      required: false
      default: Dockerfile
      validate: 'value != "" && !value.matches("^/|(^|/)[.][.](/|$)|[,[:cntrl:]]")'
      description: the Dockerfile, relative to the context, with no ".." and no ","
    - name: build_args
      type: string
      required: false
      default: ""
      validate: 'value == "" || (value.matches("^([A-Za-z_][A-Za-z0-9_]*=[^,[:cntrl:]]*\n)*[A-Za-z_][A-Za-z0-9_]*=[^,[:cntrl:]]*\n?$") && !value.matches("(?i)(^|\n)buildkit_"))'
      description: build arguments, one KEY=VALUE per line, with no "," in a value and no name starting BUILDKIT_
    - name: cache
      type: choice
      options: [none, s3]
      required: false
      default: none
      description: where BuildKit imports and exports its layer cache
    - name: cache_bucket
      type: string
      required: false
      default: ""
      validate: 'value.matches("^([a-z0-9][a-z0-9.-]*[a-z0-9])?$")'
      description: for cache s3, the bucket
    - name: cache_region
      type: string
      required: false
      default: ""
      validate: 'value.matches("^[a-z0-9-]*$")'
      description: for cache s3, the bucket's region
    - name: cache_name
      type: string
      required: false
      default: ""
      validate: 'value.matches("^[A-Za-z0-9._/-]*$")'
      description: for cache s3, the cache's name in the bucket (BuildKit's default when empty)
    - name: insecure_push
      type: boolean
      required: false
      default: false
      description: reach the registry over plain HTTP, for a test or development registry with no TLS
  outputs: [push]
steps:
  - id: amd64
    # The BuildKit image libs/build.yaml's build Step pins.
    image: moby/buildkit:rootless@sha256:5987568f92dafbfb679879de59c1cd8d26597f5f6635c314e166164e2615870c
    security: { sandbox: rootless-buildkit }
    # arm64 below uses this env and this command (YAML aliases), so the two
    # builds differ only in their Step id, and so in their layout's path.
    env: &build_env
      # Rootless buildkitd cannot use the process sandbox.
      - [BUILDKITD_FLAGS, --oci-worker-no-process-sandbox]
      - [SCARAB_BUILD_IMAGE, "${{ inputs.image }}"]
      - [SCARAB_BUILD_CONTEXT, "${{ inputs.context }}"]
      - [SCARAB_BUILD_DOCKERFILE, "${{ inputs.dockerfile }}"]
      # "true" writes the image as a layout, for the push Step.
      - [SCARAB_BUILD_PUSH, "true"]
      - [SCARAB_BUILD_ARGS, "${{ inputs.build_args }}"]
      - [SCARAB_BUILD_CACHE, "${{ inputs.cache }}"]
      - [SCARAB_BUILD_CACHE_BUCKET, "${{ inputs.cache_bucket }}"]
      - [SCARAB_BUILD_CACHE_REGION, "${{ inputs.cache_region }}"]
      - [SCARAB_BUILD_CACHE_NAME, "${{ inputs.cache_name }}"]
      # Each architecture keeps its own layer cache: <cache_name>-amd64 and
      # <cache_name>-arm64.
      - [SCARAB_BUILD_CACHE_PER_ARCH, "true"]
    # A copy of libs/build.yaml's build script; a test holds the two the
    # same.
    command: &build_command
      - /bin/sh
      - -c
      - |
        set -eu
        # Bracket ranges in `case` follow the locale; C keeps [a-z] to a-z.
        export LC_ALL=C
        root=/workspace
        fail() { echo "scarab: build refused: $*" >&2; exit 2; }
        nl='
        '
        # Sets r to the resolved path. The `.` keeps a trailing newline in a
        # directory name from being dropped by the command substitution.
        resolve() {
          r=$(realpath "$1" && echo .) || return 1
          r=${r%.}
          r=${r%"$nl"}
        }
        [ -d "$root" ] || fail "no workspace at $root"
        cd "$root" || fail "cannot enter the workspace at $root"
        resolve . || fail "cannot resolve the workspace at $root"
        root=$r
        ctx=${SCARAB_BUILD_CONTEXT-}
        df=${SCARAB_BUILD_DOCKERFILE-}
        [ -n "$ctx" ] || fail "no build context"
        [ -n "$df" ] || fail "no dockerfile"
        inside() {
          case "$1" in
            "$root" | "$root"/*) return 0 ;;
            *) return 1 ;;
          esac
        }
        [ -e "./$ctx" ] || fail "build context $ctx does not exist in the workspace"
        resolve "./$ctx" || fail "cannot resolve build context $ctx"
        inside "$r" || fail "build context $ctx resolves outside the workspace"
        [ -e "./$ctx/$df" ] || fail "dockerfile $ctx/$df does not exist in the workspace"
        resolve "./$ctx/$df" || fail "cannot resolve dockerfile $ctx/$df"
        inside "$r" || fail "dockerfile $ctx/$df resolves outside the workspace"
        # The inputs were checked against their `validate:` rules when the
        # Step launched; the checks below hold the script to them too.
        image=${SCARAB_BUILD_IMAGE-}
        push=${SCARAB_BUILD_PUSH-false}
        case "$image" in
          "" | -* | *,*) fail "image $image is not an image reference" ;;
        esac
        case "$push" in
          true | false) ;;
          *) fail "push must be true or false, not $push" ;;
        esac
        # Scarab sets SCARAB_FORK_PR on every launch of this Step; a value
        # other than `false` (none included) is a fork pull request's build,
        # or a Run locked out of its Environment's secrets, which never writes
        # the shared cache and is never pushed.
        fork=true
        [ "${SCARAB_FORK_PR-}" = false ] && fork=false
        if [ "$fork" = true ]; then
          [ "$push" = false ] ||
            echo "scarab: not pushed: this Run is a fork pull request's, or is locked out of its Environment's secrets" >&2
          push=false
        fi
        set -- build --frontend dockerfile.v0 \
          --local "context=$ctx" --local "dockerfile=$ctx" --opt "filename=$df"
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          key=${line%%=*}
          [ "$key" != "$line" ] || fail "build arg $line is not KEY=VALUE"
          case "$key" in
            "" | [0-9]* | *[!A-Za-z0-9_]*) fail "build arg name $key is not a name" ;;
            # BuildKit reads BUILDKIT_* build args as settings; BUILDKIT_SYNTAX
            # names a frontend image that it pulls and runs.
            [Bb][Uu][Ii][Ll][Dd][Kk][Ii][Tt]_*) fail "build arg $key is refused: BuildKit reads BUILDKIT_* arguments as settings" ;;
          esac
          case "$line" in
            *,*) fail "build arg $key holds a ','" ;;
            *[[:cntrl:]]*) fail "build arg $key holds a control character" ;;
          esac
          set -- "$@" --opt "build-arg:$line"
        done <<EOF
        ${SCARAB_BUILD_ARGS-}
        EOF
        case "${SCARAB_BUILD_CACHE-none}" in
          none | "") ;;
          s3)
            bucket=${SCARAB_BUILD_CACHE_BUCKET-}
            region=${SCARAB_BUILD_CACHE_REGION-}
            name=${SCARAB_BUILD_CACHE_NAME-}
            # A library that builds one image per architecture from one set
            # of inputs sets SCARAB_BUILD_CACHE_PER_ARCH, so each
            # architecture keeps its own cache: <name>-<arch>, or
            # buildkit-<arch> when no name is given.
            case "${SCARAB_BUILD_CACHE_PER_ARCH-false}" in
              false) ;;
              true)
                m=$(uname -m) || fail "cannot read this node's architecture"
                case "$m" in
                  x86_64) m=amd64 ;;
                  aarch64) m=arm64 ;;
                  "" | *[!A-Za-z0-9_]*) fail "this node's architecture $m is not a name" ;;
                esac
                name=${name:-buildkit}-$m
                ;;
              *) fail "SCARAB_BUILD_CACHE_PER_ARCH must be true or false" ;;
            esac
            [ -n "$bucket" ] || fail "cache s3 needs cache_bucket"
            [ -n "$region" ] || fail "cache s3 needs cache_region"
            case "$bucket$region$name" in
              *,*) fail "cache_bucket, cache_region and cache_name must not hold a ','" ;;
            esac
            s3="type=s3,region=$region,bucket=$bucket"
            [ -z "$name" ] || s3="$s3,name=$name"
            set -- "$@" --import-cache "$s3"
            [ "$fork" = true ] || set -- "$@" --export-cache "$s3,mode=max"
            ;;
          *) fail "cache must be none or s3" ;;
        esac
        # An image to push leaves this Step as an OCI image layout in the
        # workspace, at .scarab-build/<key>/oci; one that is not pushed stays
        # in BuildKit, so it costs no workspace transfer. Both use OCI media
        # types. The key is the first 32 hex characters of the SHA-256 of
        # this Step's id (SCARAB_STEP, which Scarab sets), so two builds
        # whose workspaces a later Step joins write different paths. The id
        # itself is not used: an invoke matrix puts "[", "=" and "," in it,
        # and a "," would end BuildKit's --output value.
        layout=
        if [ "$push" = true ]; then
          step=${SCARAB_STEP-}
          [ -n "$step" ] || fail "SCARAB_STEP is not set, so the image layout has no path"
          sum=$(printf '%s' "$step" | sha256sum) || fail "cannot hash the step id $step"
          key=${sum%% *}
          rest=${key#????????????????????????????????}
          key=${key%"$rest"}
          case "$key" in
            *[!0-9a-f]*) fail "the step id hashed to $key, which is not hex" ;;
          esac
          [ "${#key}" -eq 32 ] || fail "the step id hashed to $key, which is not 32 hex characters"
          case "$root" in
            *[!A-Za-z0-9._/-]*) fail "the workspace path $root holds a character an image layout path may not" ;;
          esac
          layout=$root/.scarab-build/$key/oci
          # The push Step reads the image from here. An earlier Step ran
          # repository code in this workspace. A .scarab-build that is not
          # a plain directory is removed (rm does not follow a symlink it
          # removes); otherwise only this Step's own key is, so a layout
          # another build handed on stays.
          if [ -L ./.scarab-build ] || [ ! -d ./.scarab-build ]; then
            rm -rf ./.scarab-build
          fi
          rm -rf "./.scarab-build/$key"
          mkdir -p "./.scarab-build/$key"
          set -- "$@" --output "type=oci,dest=$layout,tar=false"
        else
          set -- "$@" --output "type=image,name=$image,push=false,oci-mediatypes=true"
        fi
        # BuildKit's metadata, the digest among it, is the Step's `image`
        # result when Scarab collects results (/scarab/results exists).
        meta=
        if [ -d /scarab/results ]; then
          meta=/scarab/results/image.json
          set -- "$@" --metadata-file "$meta"
        fi
        # The build runs as a child, not with exec, so this script can add to
        # the result after it. A stop signal is passed on to it; the trap is
        # set before the child starts, so a signal in between is not lost.
        pid=
        stop=false
        trap 'stop=true; [ -z "$pid" ] || kill -TERM "$pid" 2>/dev/null || :' TERM INT
        /usr/bin/buildctl-daemonless.sh "$@" &
        pid=$!
        [ "$stop" = false ] || kill -TERM "$pid" 2>/dev/null || :
        code=0
        wait "$pid" || code=$?
        # A signal ends `wait` early; wait again for the build itself.
        while kill -0 "$pid" 2>/dev/null; do
          code=0
          wait "$pid" || code=$?
        done
        [ "$code" -eq 0 ] || exit "$code"
        [ -n "$meta" ] || exit 0
        # The result also gives the digest under a key with no "." in it
        # (`digest`) and, when the image was written as a layout, the
        # layout's path (`layout`), so a later Step reads
        # `outputs.<step>.image.digest` and `outputs.<step>.image.layout`.
        # Both keys are written last: a JSON reader keeps the last of two
        # keys of one name, should BuildKit's metadata hold one of them.
        # Without a layout, a result this script cannot extend is kept as
        # BuildKit wrote it; with one, the Step fails, because the Step that
        # pushes the layout needs both keys.
        unextended() {
          [ -z "$layout" ] || fail "$1, so the image layout cannot be handed on"
          echo "scarab: warning: $1; the image result has no digest key" >&2
          exit 0
        }
        [ -f "$meta" ] && [ ! -L "$meta" ] || unextended "BuildKit wrote no metadata file"
        m=$(cat "$meta") || unextended "cannot read BuildKit's metadata"
        found=$(printf '%s\n' "$m" | grep -o '"containerimage\.digest": *"sha256:[0-9a-f]\{64\}"') || found=
        case "$found" in
          "" | *"$nl"*) unextended "BuildKit's metadata does not name one image digest" ;;
        esac
        digest=${found##*\"sha256:}
        digest=sha256:${digest%\"}
        case "$m" in
          "{"*"}") ;;
          *) unextended "BuildKit's metadata is not one JSON object" ;;
        esac
        add="\"digest\":\"$digest\""
        [ -z "$layout" ] || add="$add,\"layout\":\"$layout\""
        { printf '%s,%s}\n' "${m%\}}" "$add" > "$meta.scarab" &&
          mv -f "$meta.scarab" "$meta"; } ||
          fail "cannot write the image result"
  - id: arm64
    image: moby/buildkit:rootless@sha256:5987568f92dafbfb679879de59c1cd8d26597f5f6635c314e166164e2615870c
    security: { sandbox: rootless-buildkit }
    env: *build_env
    command: *build_command
  - id: push
    needs: [amd64, arm64]
    # Only the two builds' workspaces reach this Step, not those of the
    # Steps the invoke needs.
    inputs: [amd64, arm64]
    # The crane image libs/image-index.yaml pins.
    image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    registry_auth: true
    # The image's default user is root. crane and busybox need no user of
    # their own, so the Step runs as uid 1000, the build Steps' uid. It
    # reads and cleans the workspace through the workspace group, as every
    # Step does, and reads the registry login Scarab mounts.
    security: { run_as_user: 1000 }
    env:
      # The name of the result the Step writes (`push.json`).
      - [SCARAB_INDEX_RESULT, push]
      - [SCARAB_INDEX_IMAGE, "${{ inputs.image }}"]
      - [SCARAB_INDEX_IMAGES, ""]
      # One line per build: its layout's path and digest, from its `image`
      # result. A build that published none gives a line the script
      # refuses, so the index never leaves an architecture out; a fork's
      # Run exits 0 before the script reads it.
      - [SCARAB_INDEX_LAYOUTS, "${{ has(outputs.amd64) && has(outputs.amd64.image) && has(outputs.amd64.image.layout) && has(outputs.amd64.image.digest) ? outputs.amd64.image.layout + ' ' + outputs.amd64.image.digest : '(amd64 wrote no layout)' }}\n${{ has(outputs.arm64) && has(outputs.arm64.image) && has(outputs.arm64.image.layout) && has(outputs.arm64.image.digest) ? outputs.arm64.image.layout + ' ' + outputs.arm64.image.digest : '(arm64 wrote no layout)' }}"]
      # Exactly one layout per build Step: a result whose `layout` holds a
      # line break cannot add an image to the index.
      - [SCARAB_INDEX_LAYOUT_COUNT, "2"]
      - [SCARAB_INDEX_EXTRA_TAGS, "${{ inputs.extra_tags }}"]
      - [SCARAB_INDEX_ARCH_TAGS, "${{ inputs.arch_tags }}"]
      - [SCARAB_INDEX_INSECURE, "${{ inputs.insecure_push }}"]
    # A copy of libs/image-index.yaml's script; a test holds the two the
    # same.
    command:
      - /busybox/sh
      - -c
      - |
        set -eu
        # Bracket ranges in `case` follow the locale; C keeps [a-z] to a-z.
        export LC_ALL=C
        root=/workspace
        fail() { echo "scarab: index refused: $*" >&2; exit 2; }
        nl='
        '
        # Scarab sets SCARAB_FORK_PR on every launch of this Step; a value
        # other than `false` (none included) is a fork pull request's Run,
        # or a Run locked out of its Environment's secrets. Its builds
        # pushed nothing and wrote no layout, so `images` and `layouts` are
        # empty, and that is not a failure. Nothing else is read first.
        if [ "${SCARAB_FORK_PR-}" != false ]; then
          echo "scarab: not pushed: this Run is a fork pull request's, or is locked out of its Environment's secrets"
          exit 0
        fi
        # Sets r to the resolved path. The `.` keeps a trailing newline in a
        # directory name from being dropped by the command substitution.
        resolve() {
          r=$(realpath "$1" && echo .) || return 1
          r=${r%.}
          r=${r%"$nl"}
        }
        inside() {
          case "$1" in
            "$root" | "$root"/*) return 0 ;;
            *) return 1 ;;
          esac
        }
        # The inputs were checked against their `validate:` rules when the
        # Step launched; the checks below hold the script to them too.
        image=${SCARAB_INDEX_IMAGE-}
        insecure=${SCARAB_INDEX_INSECURE-false}
        archtags=${SCARAB_INDEX_ARCH_TAGS-true}
        result=${SCARAB_INDEX_RESULT-index}
        case "$image" in
          "" | -* | *[!A-Za-z0-9._:/-]*) fail "image $image is not an image reference with a tag" ;;
        esac
        case "${image##*/}" in
          *:?*) ;;
          *) fail "image $image names no tag; name the tag the index is pushed to" ;;
        esac
        tag=${image##*/}
        tag=${tag#*:}
        repo=${image%:"$tag"}
        # Upper case and a host:port with no path are left to crane's
        # parser, which reads them as this script does.
        case "/$repo/" in
          *//* | */./* | */../*) fail "image $image has an empty, '.' or '..' path segment" ;;
        esac
        case "$tag" in
          [A-Za-z0-9_]*) ;;
          *) fail "image $image has a tag that does not start with a letter, digit or '_'" ;;
        esac
        case "$tag" in
          *[!A-Za-z0-9_.-]*) fail "image $image has a tag that is not letters, digits, '.', '_' or '-'" ;;
        esac
        [ "${#tag}" -le 128 ] || fail "image $image has a tag longer than 128 characters"
        case "$insecure" in
          true | false) ;;
          *) fail "insecure must be true or false, not $insecure" ;;
        esac
        case "$archtags" in
          true | false) ;;
          *) fail "arch_tags must be true or false, not $archtags" ;;
        esac
        case "$result" in
          [a-z]*) ;;
          *) fail "the result name $result is not a name" ;;
        esac
        case "$result" in
          *[!a-z0-9_-]*) fail "the result name $result is not a name" ;;
        esac
        # Tag names, separated by spaces or line breaks. One named twice, or
        # the same as image's tag, is written once.
        extras=
        set -f
        for t in ${SCARAB_INDEX_EXTRA_TAGS-}; do
          case "$t" in
            [A-Za-z0-9_]*) ;;
            *) fail "extra tag $t does not start with a letter, digit or '_'" ;;
          esac
          case "$t" in
            *[!A-Za-z0-9_.-]*) fail "extra tag $t is not letters, digits, '.', '_' or '-'" ;;
          esac
          [ "${#t}" -le 128 ] || fail "extra tag $t is longer than 128 characters"
          [ "$t" != "$tag" ] || continue
          case "$nl$extras" in
            *"$nl$t$nl"*) continue ;;
          esac
          extras=$extras$t$nl
        done
        set +f
        # One <repository>@sha256:<digest> per line. A tag can be moved, so
        # an index built from tags is not the same index on a retry.
        sources=
        count=0
        while IFS= read -r src; do
          [ -n "$src" ] || continue
          case "$src" in
            -* | *[!a-z0-9._:/@-]*) fail "$src is not an image reference" ;;
          esac
          repo_=${src%@sha256:*}
          hex=${src#"$repo_"@sha256:}
          [ -n "$repo_" ] && [ "$repo_@sha256:$hex" = "$src" ] ||
            fail "$src is not <repository>@sha256:<digest>; name each image by digest, not by tag"
          case "$repo_" in
            *@*) fail "$src names more than one digest" ;;
          esac
          case "${repo_##*/}" in
            *:*) fail "$src names a tag and a digest; name the image by digest alone" ;;
          esac
          case "/$repo_/" in
            *//* | */./* | */../*) fail "$src has an empty, '.' or '..' path segment" ;;
          esac
          case "$hex" in
            *[!0-9a-f]*) fail "$src has a digest that is not lower-case hex" ;;
          esac
          [ "${#hex}" -eq 64 ] || fail "$src has a digest that is not 64 hex characters"
          case "$nl$sources" in
            *"$nl$src$nl"*) fail "$src is named twice" ;;
          esac
          sources=$sources$src$nl
          count=$((count + 1))
        done <<EOF
        ${SCARAB_INDEX_IMAGES-}
        EOF
        # One `<path> sha256:<digest>` per line, the path
        # <workspace>/.scarab-build/<key>/oci. Empty lines only, or none, is
        # no layout; empty lines between layouts, or more than one at the
        # end, are refused, so a build that published no layout is not
        # left out of the index unnoticed.
        layouts=
        nlayouts=0
        blanks=0
        while IFS= read -r line; do
          if [ -z "$line" ]; then
            blanks=$((blanks + 1))
            continue
          fi
          [ "$blanks" -eq 0 ] ||
            fail "layouts holds an empty line before $line; a mix of layouts and empty lines is refused"
          path=${line%% *}
          want=${line#"$path" }
          [ "$path $want" = "$line" ] ||
            fail "layouts line $line is not <path> sha256:<digest>"
          case "$path" in
            /*/.scarab-build/*/oci) ;;
            *) fail "layouts line $line does not name a path <workspace>/.scarab-build/<key>/oci" ;;
          esac
          case "$path" in
            *[!A-Za-z0-9._/-]*) fail "layouts line $line names a path that is not letters, digits, '.', '_', '-' or '/'" ;;
          esac
          key=${path%/oci}
          key=${key##*/}
          case "$key" in
            "" | *[!0-9a-f]*) fail "layouts line $line names a path whose key is not 32 hex characters" ;;
          esac
          [ "${#key}" -eq 32 ] ||
            fail "layouts line $line names a path whose key is not 32 hex characters"
          case "$want" in
            sha256:*) ;;
            *) fail "layouts line $line is not <path> sha256:<digest>" ;;
          esac
          hex=${want#sha256:}
          case "$hex" in
            "" | *[!0-9a-f]*) fail "layouts line $line has a digest that is not lower-case hex" ;;
          esac
          [ "${#hex}" -eq 64 ] || fail "layouts line $line has a digest that is not 64 hex characters"
          case "$nl$layouts" in
            *"$nl$path "*) fail "layout $path is named twice" ;;
          esac
          layouts=$layouts$line$nl
          nlayouts=$((nlayouts + 1))
        done <<EOF
        ${SCARAB_INDEX_LAYOUTS-}
        EOF
        [ "$nlayouts" -eq 0 ] || [ "$blanks" -le 1 ] ||
          fail "layouts ends in more than one empty line; a mix of layouts and empty lines is refused"
        [ "$count" -gt 0 ] || [ "$nlayouts" -gt 0 ] ||
          fail "images and layouts name no image"
        # A library that knows how many layouts it hands this script (one
        # per build Step) sets SCARAB_INDEX_LAYOUT_COUNT, so a result that
        # adds a line cannot add an image to the index. Unset or empty, the
        # count is not checked.
        expected=${SCARAB_INDEX_LAYOUT_COUNT-}
        case "$expected" in
          "") ;;
          *[!0-9]*) fail "SCARAB_INDEX_LAYOUT_COUNT must be a number, not $expected" ;;
          *)
            # Compared as text, so "02" is not 2.
            [ "$nlayouts" = "$expected" ] ||
              fail "layouts names $nlayouts layouts, but this step takes $expected, one per build"
            ;;
        esac
        # crane's --insecure also skips TLS verification, so a registry
        # login would go to whoever answers at the registry's host.
        if [ "$insecure" = true ] && [ -e "${DOCKER_CONFIG-}/config.json" ]; then
          fail "insecure is refused when the step holds a registry login"
        fi
        tls=
        [ "$insecure" = false ] || tls=--insecure
        # U+017F and U+212A in UTF-8: Go's JSON decoder matches them to
        # "s" and "k" when it matches a key.
        longs=$(printf '\305\277')
        kelvin=$(printf '\342\204\252')
        # Refuses (exit 2) $2, the JSON text $1 names, when it spells a
        # letter, digit, ".", "_" or "-" with a \u escape, or holds U+017F
        # or U+212A: crane decodes either into a key the greps here would
        # not see.
        plain() {
          if printf '%s\n' "$2" |
            grep -qiE '\\u(00(2[de]|3[0-9]|4[1-9a-f]|5[0-9af]|6[1-9a-f]|7[0-9a])|017f|212a)'; then
            fail "$1 spells a name with a \\u escape"
          fi
          case "$2" in
            *"$longs"* | *"$kelvin"*) fail "$1 holds a letter that JSON decoders read as s or k" ;;
          esac
        }
        # Sets flat to $2, the JSON text $1 names, with its line breaks and
        # tabs removed, and refuses a text that is not one object: a
        # byte-order mark or any other first byte fails crane's decoder,
        # and would do so after this Step has written.
        flatten() {
          flat=$(printf '%s' "$2" | tr -d '\n\r\t') || fail "cannot read $1"
          case "$flat" in
            "{"*"}") ;;
            *) fail "$1 is not one JSON object" ;;
          esac
        }
        # Refuses $3, the flattened JSON text $1 names, unless the one "$2"
        # in it is a key of the top-level object, the only place crane reads
        # it. The text before the key, with every string removed and then
        # every closed {} and [] removed, must be "{". In JSON a `"` outside
        # a string opens one, so removing strings from left to right leaves
        # only the structure.
        toplevel() {
          hit=$(printf '%s\n' "$3" | grep -oi "\"$2\" *:") ||
            fail "$1 names \"$2\" in a form this step does not read"
          case "$hit" in
            *"$nl"*) fail "$1 names \"$2\" more than once" ;;
          esac
          pre=${3%%"$hit"*}
          skel=$(printf '%s\n' "$pre" | sed 's/"[^"\\]*\(\\.[^"\\]*\)*"//g' | tr -cd '{}\133\135"')
          while :; do
            new=$(printf '%s\n' "$skel" | sed 's/{}//g; s/\[\]//g')
            [ "$new" != "$skel" ] || break
            skel=$new
          done
          [ "$skel" = "{" ] || fail "$1 names \"$2\" somewhere other than its top level"
        }
        # Sets v to the string value of key $1 in $flat, a flattened JSON
        # object, or to empty when the key is absent. The key is matched in
        # any case, as crane's decoder matches it, and only as a key of the
        # top-level object. A key named more than once (a label named "os",
        # for one), or one whose value is not a string, is refused rather
        # than guessed at.
        field() {
          n=$(printf '%s\n' "$flat" | grep -oi "\"$1\"" | grep -c .) || n=0
          [ "$n" -le 1 ] || fail "the config of $src names \"$1\" more than once"
          v=
          [ "$n" -eq 1 ] || return 0
          toplevel "the config of $src" "$1" "$flat"
          v=$(printf '%s\n' "$flat" | grep -oi "\"$1\" *: *\"[^\"]*\"") ||
            fail "the config of $src names \"$1\" in a form this step does not read"
          v=${v%\"}
          v=${v##*\"}
        }
        # Reads the platform from $config, the config of $src, into arch,
        # variant and platform, and refuses a platform an image before it
        # has: an index holds one image per platform. arm64/v8 is arm64 and
        # amd64/v1 is amd64, as containerd reads them; no variant is added
        # where the config names none.
        platforms=
        platform_of() {
          plain "the config of $src" "$config"
          flatten "the config of $src" "$config"
          field os
          os=$v
          field architecture
          arch=$v
          field variant
          variant=$v
          field os.version
          osversion=$v
          [ -n "$os" ] && [ -n "$arch" ] ||
            fail "the config of $src names no os or architecture, so the index could not say which platform it is"
          case "$os$arch$variant$osversion" in
            *[!A-Za-z0-9._-]*) fail "the config of $src names a platform that is not letters, digits, '.', '_' or '-'" ;;
          esac
          case "$arch/$variant" in
            arm64/v8 | arm64/8 | amd64/v1) variant= ;;
          esac
          platform=$os/$arch
          [ -z "$variant" ] || platform=$platform/$variant
          [ -z "$osversion" ] || platform=$platform:$osversion
          case "$nl$platforms" in
            *"$nl$platform$nl"*) fail "$src is $platform, as an image before it is; an index holds one image per platform" ;;
          esac
          platforms=$platforms$platform$nl
          echo "scarab: $src is $platform"
        }
        # Each layout, read from the workspace. Steps before this one ran
        # repository code in this workspace, and so did the Dockerfile.
        # crane would upload what a symlink in a layout points at
        # (/scarab/registry/config.json, for one), so a layout must be
        # plain directories and regular files, inside the workspace. Nothing
        # in the workspace is changed until every check is done.
        if [ "$nlayouts" -gt 0 ]; then
          [ -d "$root" ] || fail "no workspace at $root"
          cd "$root" || fail "cannot enter the workspace at $root"
          resolve . || fail "cannot resolve the workspace at $root"
          root=$r
        fi
        pushes=
        archs=
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          path=${line%% *}
          want=${line#* }
          src=$path
          case "$path" in
            "$root"/.scarab-build/*/oci) ;;
            *) fail "the image layout $path is not in $root/.scarab-build" ;;
          esac
          key=${path#"$root"/.scarab-build/}
          key=${key%/oci}
          case "$key" in
            "" | *[!0-9a-f]*) fail "the image layout $path is not $root/.scarab-build/<key>/oci" ;;
          esac
          [ "${#key}" -eq 32 ] ||
            fail "the image layout $path is not $root/.scarab-build/<key>/oci"
          [ ! -L ./.scarab-build ] && [ -d ./.scarab-build ] ||
            fail ".scarab-build is not a directory a build step wrote"
          [ ! -L "./.scarab-build/$key" ] && [ -d "./.scarab-build/$key" ] ||
            fail ".scarab-build/$key is not a directory a build step wrote"
          [ ! -L "./.scarab-build/$key/oci" ] && [ -d "./.scarab-build/$key/oci" ] ||
            fail "no image layout at .scarab-build/$key/oci"
          resolve "./.scarab-build/$key/oci" || fail "cannot resolve the image layout $path"
          inside "$r" || fail "the image layout $path resolves outside the workspace"
          [ "$r" = "$path" ] || fail "the image layout $path resolves to $r"
          layout=$r
          # A directory find cannot read could hide a symlink, so a find
          # that fails refuses the layout.
          odd=$(find "$layout" ! -type f ! -type d) ||
            fail "cannot list every file in the image layout $path"
          odd=${odd%%"$nl"*}
          [ -z "$odd" ] ||
            fail "the image layout $path holds $odd, which is not a regular file or a directory"
          [ -f "$layout/oci-layout" ] || fail "the image layout $path has no oci-layout file"
          # The layout must hold the image `layouts` names: its index.json
          # must name one manifest, that manifest's file must hash to its
          # name, and its digest must be the one `layouts` gives.
          #
          # grep reads index.json here; crane would read it with Go's JSON
          # decoder, which matches keys in any case and decodes \u escapes.
          # So index.json is refused when it holds a backslash, a byte that
          # is not printable ASCII or a line break, or the word "digest", in
          # any case, other than once. crane then reads an index.json
          # written just before it pushes, not this one.
          index=$layout/index.json
          [ -f "$index" ] || fail "the image layout $path has no index.json"
          n=$(LC_ALL=C tr -d '\11\12\15\40-\176' < "$index" | wc -c) ||
            fail "cannot read the index.json of $path"
          [ $((n)) -eq 0 ] ||
            fail "the index.json of $path holds a byte that is not printable ASCII"
          if grep -q '\\' "$index"; then
            fail "the index.json of $path holds a backslash"
          fi
          n=$(LC_ALL=C tr 'A-Z' 'a-z' < "$index" | grep -o digest | grep -c .) || n=0
          [ "$n" -eq 1 ] ||
            fail "the index.json of $path does not name exactly one image"
          found=$(grep -o '"digest" *: *"sha256:[0-9a-f]\{64\}"' "$index") || found=
          case "$found" in
            "" | *"$nl"*) fail "the index.json of $path does not name exactly one image" ;;
          esac
          built=${found##*\"sha256:}
          built=sha256:${built%\"}
          blob=$layout/blobs/sha256/${built#sha256:}
          [ -f "$blob" ] || fail "the image layout $path has no manifest $built"
          sum=$(sha256sum < "$blob") || fail "cannot hash the manifest $built in $path"
          [ "sha256:${sum%% *}" = "$built" ] ||
            fail "the manifest in $path does not hash to its digest $built"
          [ "$built" = "$want" ] ||
            fail "the image layout $path holds $built, but layouts names $want"
          # The config is read from the layout, so the platform is known
          # before anything is pushed. Every blob the manifest names, the
          # config and each layer, must be in the layout and hash to the
          # digest the manifest names, so crane does not fail on one after
          # this Step has written.
          manifest=$(cat "$blob") || fail "cannot read the manifest $built in $path"
          plain "the manifest in $path" "$manifest"
          flatten "the manifest in $path" "$manifest"
          mflat=$flat
          if printf '%s\n' "$mflat" | grep -qi '"manifests"'; then
            fail "$path holds an index, not one image"
          fi
          if printf '%s\n' "$mflat" | grep -qi '"subject"'; then
            fail "the manifest in $path names a subject; this step pushes images, not referrers"
          fi
          n=$(printf '%s\n' "$mflat" | grep -oi '"config"' | grep -c .) || n=0
          [ "$n" -eq 1 ] || fail "the manifest in $path does not name one config"
          toplevel "the manifest in $path" config "$mflat"
          cfg=$(printf '%s\n' "$mflat" | grep -oi '"config" *: *[{][^{}]*[}]') ||
            fail "the manifest in $path names its config in a form this step does not read"
          n=$(printf '%s\n' "$cfg" | grep -oi '"digest"' | grep -c .) || n=0
          [ "$n" -eq 1 ] || fail "the manifest in $path does not name one config digest"
          c=$(printf '%s\n' "$cfg" | grep -o '"digest" *: *"sha256:[0-9a-f]\{64\}"') ||
            fail "the manifest in $path names its config digest in a form this step does not read"
          c=${c##*\"sha256:}
          c=${c%\"}
          cblob=$layout/blobs/sha256/$c
          [ -f "$cblob" ] || fail "the image layout $path has no config sha256:$c"
          sum=$(sha256sum < "$cblob") || fail "cannot hash the config sha256:$c in $path"
          [ "${sum%% *}" = "$c" ] ||
            fail "the config in $path does not hash to its digest sha256:$c"
          n=$(printf '%s\n' "$mflat" | grep -oi '"digest"' | grep -c .) || n=0
          ds=$(printf '%s\n' "$mflat" | grep -o '"digest" *: *"sha256:[0-9a-f]\{64\}"') || ds=
          m=$(printf '%s\n' "$ds" | grep -c .) || m=0
          [ "$n" = "$m" ] ||
            fail "the manifest in $path names a digest that is not sha256:<64 hex>"
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            d=${d##*\"sha256:}
            d=${d%\"}
            [ "$d" != "$c" ] || continue
            [ -f "$layout/blobs/sha256/$d" ] || fail "the image layout $path has no blob sha256:$d"
            sum=$(sha256sum < "$layout/blobs/sha256/$d") || fail "cannot hash the blob sha256:$d in $path"
            [ "${sum%% *}" = "$d" ] ||
              fail "a blob in $path does not hash to its digest sha256:$d"
          done <<EOF
        $ds
        EOF
          config=$(cat "$cblob") || fail "cannot read the config sha256:$c in $path"
          platform_of
          # An image from a layout gets an arch tag, so its architecture and
          # variant must be ones this Step knows, whatever arch_tags says.
          case "$arch" in
            386 | amd64 | arm | arm64 | loong64 | mips | mipsle | mips64 | mips64le | ppc64 | ppc64le | riscv64 | s390x) ;;
            *) fail "$path is $platform, an architecture or variant this step does not tag" ;;
          esac
          case "$arch/$variant" in
            */ | arm/v5 | arm/v6 | arm/v7 | arm/v8 | amd64/v2 | amd64/v3 | amd64/v4) ;;
            *) fail "$path is $platform, an architecture or variant this step does not tag" ;;
          esac
          if [ "$archtags" = true ]; then
            t=$tag-$arch
            [ -z "$variant" ] || t=$t-$variant
            [ "${#t}" -le 128 ] || fail "the arch tag $t of $path is longer than 128 characters"
            case "$nl$archs" in
              *" $t$nl"*) fail "$path would be tagged $t, as an image before it would" ;;
            esac
            case "$nl$extras" in
              *"$nl$t$nl"*) fail "$path would be tagged $t, which extra_tags names for the index" ;;
            esac
            archs="$archs$built $t$nl"
          fi
          pushes="$pushes$layout $built$nl"
        done <<EOF
        $layouts
        EOF
        # Each image in `images` must be one image, of a platform no other
        # image has. crane fetches each by digest and checks the content
        # against it.
        while IFS= read -r src; do
          [ -n "$src" ] || continue
          manifest=$(crane manifest "$src" $tls </dev/null) || {
            echo "scarab: cannot read the manifest of $src" >&2
            exit 1
          }
          plain "the manifest of $src" "$manifest"
          if printf '%s\n' "$manifest" | grep -qi '"manifests"'; then
            fail "$src is an index, not one image; name each architecture's image by its own digest"
          fi
          config=$(crane config "$src" $tls </dev/null) || {
            echo "scarab: cannot read the config of $src" >&2
            exit 1
          }
          platform_of
        done <<EOF
        $sources
        EOF
        # Sets digest from $1, a reference crane printed, and exits 1 when it
        # is not <repository>@sha256:<64 hex>.
        reported() {
          digest=${1##*@}
          hex=${digest#sha256:}
          case "$1$digest" in
            *[!A-Za-z0-9._:/@-]*) echo "scarab: crane reported $1" >&2; exit 1 ;;
          esac
          case "$digest" in
            sha256:*) ;;
            *) echo "scarab: crane reported $1, with no digest" >&2; exit 1 ;;
          esac
          case "$hex" in
            *[!0-9a-f]*) echo "scarab: crane reported $1" >&2; exit 1 ;;
          esac
          [ "${#hex}" -eq 64 ] || { echo "scarab: crane reported $1" >&2; exit 1; }
        }
        # Every check is done. From here on the Step writes to the
        # registry: each layout's image by digest, the index, the arch tags,
        # then the extra tags. Until the index is pushed only untagged
        # images exist; crane reads every config again when it pushes the
        # index, and after that each write moves a tag to a digest already
        # in the registry.
        #
        # crane pushes the manifest a layout's index.json names. It reads an
        # index.json written here, naming only the manifest checked above,
        # by its digest and size; BuildKit's oci exporter writes OCI media
        # types. The config and layers are the ones that manifest names, by
        # digest.
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          layout=${line%% *}
          want=${line#* }
          blob=$layout/blobs/sha256/${want#sha256:}
          index=$layout/index.json
          size=$(wc -c < "$blob") || fail "cannot read the manifest $want in $layout"
          { printf '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"%s","size":%d}]}\n' "$want" "$((size))" > "$index.scarab" &&
            mv -f "$index.scarab" "$index"; } ||
            fail "cannot write the index.json of $layout"
          ref=$(crane push "$layout" "$repo@$want" $tls </dev/null)
          reported "$ref"
          if [ "$digest" != "$want" ]; then
            echo "scarab: crane pushed $ref, but the image layout holds $want" >&2
            exit 1
          fi
          echo "scarab: pushed $ref"
        done <<EOF
        $pushes
        EOF
        set -- index append
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          set -- "$@" -m "$repo@${line#* }"
        done <<EOF
        $pushes
        EOF
        while IFS= read -r src; do
          [ -n "$src" ] || continue
          set -- "$@" -m "$src"
        done <<EOF
        $sources
        EOF
        set -- "$@" -t "$image"
        [ "$insecure" = false ] || set -- "$@" --insecure
        ref=$(crane "$@")
        reported "$ref"
        pushed=$ref
        indexed=$digest
        echo "scarab: pushed $pushed as $image"
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          want=${line%% *}
          t=${line#* }
          crane tag "$repo@$want" "$t" $tls </dev/null
          echo "scarab: tagged $repo@$want as $t"
        done <<EOF
        $archs
        EOF
        while IFS= read -r t; do
          [ -n "$t" ] || continue
          crane tag "$repo@$indexed" "$t" $tls </dev/null
          echo "scarab: tagged $repo@$indexed as $t"
        done <<EOF
        $extras
        EOF
        # The pushed reference is the Step's result, named by
        # SCARAB_INDEX_RESULT, when Scarab collects results
        # (/scarab/results exists).
        if [ -d /scarab/results ]; then
          printf '{"ref":"%s","digest":"%s"}' "$pushed" "$indexed" > "/scarab/results/$result.json"
        fi
        # The layouts were for this Step alone: they are removed from its
        # workspace, so a Step that needs only this one does not receive
        # them. A layout that cannot be removed is reported and does not
        # fail a push that worked.
        if [ "$nlayouts" -gt 0 ]; then
          rm -rf ./.scarab-build ||
            echo "scarab: could not remove .scarab-build; steps that need this one receive it" >&2
        fi
