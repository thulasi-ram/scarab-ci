<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scarab</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pre-paint theme guard (docs/DESIGN.md §1): light and the emerald palette
      // are the defaults; honor stored choices before first paint to avoid a
      // flash. The palette rule mirrors parsePalette in src/appearance.ts.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("scarab-theme");
          root.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        } catch (e) {
          root.setAttribute("data-theme", "light");
        }
        try {
          var p = localStorage.getItem("scarab-palette");
          root.setAttribute("data-palette", p === "mono" ? "mono" : "emerald");
        } catch (e) {
          root.setAttribute("data-palette", "emerald");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
