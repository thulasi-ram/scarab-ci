<!doctype html>
<meta charset="utf-8">
<title>Rendering halftone icons</title>
<body style="font:14px system-ui;padding:24px">
<p id="msg">Rendering…</p>
<script>
// Draws each SVG onto a canvas at every size and posts the PNG to serve_png.py.
const SIZES = [16, 32, 48, 64, 128, 180, 192, 256, 512, 1024];
const CREAM = '#f4f1ea', EMERALD = '#1f9e74';

const load = (src) => { const i = new Image(); i.src = src; return i.decode().then(() => i); };
const text = (url) => fetch(url).then((r) => r.text());
const dataUrl = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

async function save(img, path, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, size, size);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  const res = await fetch('/save?path=' + path, { method: 'POST', body: blob });
  if (!res.ok) throw new Error('save refused: ' + path);
}

(async () => {
  const cream = await load('/logo/scarab-halftone.svg');
  const ink = await load('/logo/scarab-halftone-ink.svg');
  const tile = await load('/logo/scarab-halftone-tile.svg');
  // Fallback favicons: the cream mark recoloured emerald, which reads on light and dark tabs.
  const emerald = await load(dataUrl((await text('/logo/scarab-halftone.svg')).split(CREAM).join(EMERALD)));
  let n = 0;
  for (const s of SIZES) {
    await save(cream, `icons/halftone/icon-${s}.png`, s);
    await save(ink, `icons/halftone-ink/icon-${s}.png`, s);
    await save(tile, `icons/halftone-tile/icon-${s}.png`, s);
    n += 3;
  }
  for (const s of [16, 32, 48, 64]) { await save(emerald, `favicon/halftone/favicon-${s}.png`, s); n++; }
  for (const [path, s] of [['apple-touch-icon.png', 180], ['icon-192.png', 192], ['icon-512.png', 512]]) {
    await save(tile, 'favicon/halftone/' + path, s); n++;
  }
  await fetch('/done', { method: 'POST' });
  document.getElementById('msg').textContent = `Done: ${n} PNGs saved. You can close this tab.`;
  document.title = 'done';
})().catch((e) => { document.getElementById('msg').textContent = 'Failed: ' + e.message; document.title = 'failed'; });
</script>
