# Cargo defaults for this workspace. Committed on purpose: these are repo-level
# decisions, not personal taste, and CI already runs with both of them set.

[build]
# Incremental caches were 34 GB of the 100 GB `target/` in a two-week-old
# checkout. They buy least in exactly this repo's loop — `just check` and
# `just test` compile the whole workspace, where incremental's per-crate reuse
# is largely wasted — and they accumulate per fingerprint without bound.
# CI sets CARGO_INCREMENTAL=0 already; this makes local match.
#
# Turn it back on for a tight single-crate edit loop:
#   CARGO_INCREMENTAL=1 cargo check -p <crate>
incremental = false
