[package]
name = "scarab-storage"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# NOT an infra dep: SHA-256 is a pure function — no I/O, no clock, no sockets.
# It is here because the **content address is a domain fact**, not an adapter
# detail: ADR-0029 defines a snapshot AS the SHA-256 merkle root of its
# canonical tree bytes. Both adapters (`scarab-storage-s3` and
# `scarab-workspace-client`) used to carry their own copy of the canonical form
# and the digest, with a runtime tripwire in `tiered` to detect the two drifting
# apart. One definition here removes the drift class instead of watching for it.
sha2 = { workspace = true }
# NOT an infra dep despite the name: `tracing` is a facade with no I/O, no
# clock and no sockets — without a subscriber every macro compiles to nothing,
# and the subscriber is installed by the composition root. It is here because
# `tiered::TieredCas` (ADR-0061) has one behaviour that ONLY exists as a log
# line: a warm-tier write failure must succeed the caller (cold is the
# durability promise) while still being loud. Swallowing it silently would be
# the exact "silent facade" this codebase refuses.
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
