[package]
name = "scarab-executor-k8s"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
scarab-engine = { workspace = true }
scarab-pipeline = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
kube = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
scarab-storage = { workspace = true }
k8s-openapi = { workspace = true }
# Reused only for `sign_hex` — the single source of truth for the fence-token
# format the server's results endpoint verifies (ADR-0042), so the two sides
# cannot drift.
scarab-forge-github = { workspace = true }
# The k8s log tail (ADR-0013): kube's `log_stream` yields a `futures::AsyncBufRead`
# we chunk with `AsyncReadExt`.
futures = { workspace = true }
# Structured logging (ADR-0053): the `ws-timing` phase breakdown of a Step
# boundary that ADR-0061 s0 measures. The server installs the subscriber.
tracing = { workspace = true }

[dev-dependencies]
scarab-storage-s3 = { workspace = true }
# The live workspace tier (tests/cluster.rs) points the executor's `Cas` at the
# REAL ADR-0061 workspace service, because since s3-feed the Step Pod's fetcher
# reads from that service and a test whose CAS was a host tempdir would pass only
# because the feed never happened. A dev-dependency, so nothing in production
# links it — and no dependency cycle: this crate is only in
# scarab-workspace-client's OWN dev-dependencies (via scarab-server).
scarab-workspace-client = { workspace = true }
# The live orphan-Pod teardown regression (tests/cluster.rs) drives the REAL
# executor through the engine's supersede-teardown path over the in-memory Db.
scarab-testkit = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
