[package]
name = "scarab-executor-k8s"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
scarab-engine = { workspace = true }
scarab-pipeline = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
kube = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
scarab-storage = { workspace = true }
k8s-openapi = { workspace = true }
# Reused only for `sign_hex` — the single source of truth for the fence-token
# format the server's results endpoint verifies (ADR-0042), so the two sides
# cannot drift.
scarab-forge-github = { workspace = true }
# The k8s log tail (ADR-0013): kube's `log_stream` yields a `futures::AsyncBufRead`
# we chunk with `AsyncReadExt`.
futures = { workspace = true }

[dev-dependencies]
scarab-storage-s3 = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
