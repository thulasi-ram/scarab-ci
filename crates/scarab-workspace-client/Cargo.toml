[package]
name = "scarab-workspace-client"
edition.workspace = true
version.workspace = true
license.workspace = true

# Adapter crate (ADR-0016): pairs the pure `scarab-storage` domain with exactly
# one piece of infra — `reqwest` — and holds the impls of two of its ports
# (`Cas` and `ContentSource`) against the ADR-0061 workspace service.
[dependencies]
scarab-storage = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Concurrency in the CAS legs. ADR-0061's s0 measurement is unambiguous that
# the cost of the existing data path is one sequential round-trip PER FILE, so a
# client that walked files one at a time would inherit the exact problem it
# exists to remove.
futures = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
# `scarab-wsfetch hold` must SIG_IGN SIGTERM — a hold that dies on TERM
# silently destroys the drain window. One unsafe `libc::signal` call is the
# smallest thing that does it; signal-hook would drag in a handler thread this
# doorstop has no use for.
libc = "0.2"

# The ADR-0061 s3-feed fetcher (`docker/wsfetch/`): the init container that
# materialises a Step's input snapshots straight from the workspace service,
# replacing the `kubectl exec` tar tunnel. It lives HERE rather than in its own
# crate because its whole job is to call this crate's `Cas::materialize` — the
# one implementation that carries the mode/mtime/symlink fidelity rules and has
# tests pinning them. A separate crate would have had to depend on this one for
# exactly that, and would have invited a second, drifting copy.
#
# A stepping stone, deliberately: git-bug 0628369 closes only when this target
# and `docker/wsfetch/` are DELETED by the node driver (ADR-0061 D2.3).
[[bin]]
name = "scarab-wsfetch"
path = "src/bin/scarab-wsfetch.rs"

[dev-dependencies]
# The acceptance test drives the REAL workspace service (from scarab-server)
# over a REAL TieredCas on tempdirs. Classical, not mockist: the only thing
# stubbed is nothing.
# Not in `[workspace.dependencies]` — scarab-server is the composition root and
# nothing depends on it in production. A dev-dep path is deliberate.
scarab-server = { path = "../scarab-server" }
scarab-storage-s3 = { workspace = true }
scarab-executor-k8s = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
# The acceptance test re-derives digests by hand to check the wire format; the
# client itself gets its digest from `scarab-storage`.
sha2 = { workspace = true }
