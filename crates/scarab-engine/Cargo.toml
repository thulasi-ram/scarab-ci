[package]
name = "scarab-engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Pure (ADR-0031) home of the CEL evaluator, reused for launch-time `${{ … }}`
# interpolation of upstream results (ADR-0041). No cycle: pipeline never depends
# on the engine.
scarab-pipeline = { workspace = true }
# Logging facade only (no subscriber pulled in here) — lets the scheduler warn
# on caught, non-fatal launch/reconcile errors (git-bug 6825830) without
# coupling the domain crate to a concrete logging backend.
tracing = { workspace = true }
