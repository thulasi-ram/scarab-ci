[package]
name = "scarab-engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Pure (ADR-0031) home of the CEL evaluator, reused for launch-time `${{ … }}`
# interpolation of upstream results (ADR-0041). No cycle: pipeline never depends
# on the engine.
scarab-pipeline = { workspace = true }
# I/O-free-library carve-out (ADR-0031): the cache key (ADR-0065 s1) is a
# domain fact — sha256 over the project and the key files' blob hashes.
sha2 = { workspace = true }
# Pure (ADR-0031; its only dependency is the async-trait macro) home of the
# DeploymentInput a Step success records in the same transaction as the
# success itself (slice b, ADR-0070 §7). The fold and the governance behind a
# DeploymentGate stay server-side. No cycle: scarab-deployment depends on
# nothing of ours.
scarab-deployment = { workspace = true }
