[package]
name = "scarab-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "scarab_server"
path = "src/lib.rs"

[[bin]]
name = "scarab-server"
path = "src/main.rs"

[dependencies]
# infra
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
tokio-stream = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }

# every scarab crate — the server is the composition root
scarab-engine = { workspace = true }
scarab-pipeline = { workspace = true }
scarab-forge = { workspace = true }
scarab-identity = { workspace = true }
scarab-secrets = { workspace = true }
scarab-storage = { workspace = true }
scarab-projects = { workspace = true }
scarab-db-postgres = { workspace = true }
scarab-forge-github = { workspace = true }
scarab-secrets-postgres = { workspace = true }
scarab-storage-s3 = { workspace = true }
scarab-executor-k8s = { workspace = true }
scarab-executor-local = { workspace = true }
scarab-testkit = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true }
