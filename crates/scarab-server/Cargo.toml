[package]
name = "scarab-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "scarab_server"
path = "src/lib.rs"

[[bin]]
name = "scarab-server"
path = "src/main.rs"

[dependencies]
# infra
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Composition root installs the rustls default CryptoProvider (see main.rs).
rustls = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
tokio-stream = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
# PKCE S256 code challenges (ADR-0049): SHA-256 of the login verifier.
sha2 = { workspace = true }
# ADR-0067 part 2: the workspace role's fence rows (drain records, write
# ledgers) live in the control plane's Postgres and the Depot reads/writes
# them directly — connects yes, migrates never. The control-plane roles keep
# going through `scarab-db-postgres`; this is the data plane's own, deliberately
# thin, SQL surface (`workspaced.rs` only).
sqlx = { workspace = true }
# git-bug cba7165: the Depot's warm-tier LRU key is the file's mtime, and a
# warm HIT refreshes it (coarsely, at most once per grain) via `utimensat` —
# which std cannot express without opening the file for write.
filetime = { workspace = true }
# every scarab crate — the server is the composition root
scarab-engine = { workspace = true }
scarab-pipeline = { workspace = true }
scarab-forge = { workspace = true }
scarab-identity = { workspace = true }
scarab-secrets = { workspace = true }
scarab-storage = { workspace = true }
scarab-project = { workspace = true }
# ADR-0075: the policy engine and its PolicyStore port, consulted at run.create.
scarab-policy = { workspace = true }
# ADR-0072: PluginInstallations, the report wire shape and its rules, and the
# PluginStore / PluginTokenVerifier ports the broker and admin API speak.
scarab-plugin = { workspace = true }
# ADR-0072 §9/§11: the plugin runtime on Kubernetes (reconciled by
# `plugin_runtime.rs`) and the TokenReview broker-token verifier.
scarab-plugin-k8s = { workspace = true }
scarab-db-postgres = { workspace = true }
scarab-forge-github = { workspace = true }
scarab-forge-forgejo = { workspace = true }
scarab-secrets-postgres = { workspace = true }
scarab-storage-s3 = { workspace = true }
# ADR-0061 D1.6: the control plane's workspace `Cas` is a `TieredCas` whose WARM
# tier is the workspace service, reached through this client, and whose COLD tier
# is the object store directly. Without this dependency the warm tier is filled
# only by the service's own read-path backfill — so every freshly-drained
# snapshot is a guaranteed miss, half the wire protocol (`have`, `PUT`) is
# production-dead, and "Browse reads snapshots from the service" is aspirational.
scarab-workspace-client = { workspace = true }
scarab-executor-k8s = { workspace = true }
scarab-executor-local = { workspace = true }
scarab-testkit = { workspace = true }
# ADR-0073 step-up: the WebAuthn relying party (passkey registration and
# assertion verification). Its soft authenticator is a dev-only feature.
scarab-webauthn = { workspace = true }
# ADR-0073: the action digest is HMAC-SHA256 under a KEK-derived key. Already
# in the tree (scarab-secrets-postgres, the forge webhook verifiers).
hmac = { workspace = true }
# ADR-0073 §6: a confirmed StepUpConfirmationRequest is replayed through the
# real router (`ServiceExt::oneshot`). Already in the tree via axum.
tower = { workspace = true, features = ["util"] }

# ADR-0062 overlay change-set (`changeset.rs`): reading `trusted.overlay.*` off a
# Step's upper layer. Target-gated to match the `#[cfg(target_os = "linux")]` on
# the only code that calls it — the namespace exists nowhere else, and off Linux
# `require_marker_privilege` refuses before any read is attempted.
[target.'cfg(target_os = "linux")'.dependencies]
xattr = { workspace = true }

# git-bug cba7165: `statvfs` behind the warm budget's 90%-of-volume default.
# Direct like scarab-workspace-client's, and unix-gated to match the one
# `fs_capacity_bytes` impl that calls it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# ADR-0073 tests: a software passkey (a true external — the authenticator).
scarab-webauthn = { workspace = true, features = ["soft-authenticator"] }
tempfile = { workspace = true }
