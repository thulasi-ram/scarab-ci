# Full-stack E2E tier (test-strategy Phase 2): a pure HTTP driver for the kind
# release (`deploy/kind/`, in its `e2e` mode: own database and bucket). The
# crate assumes a RUNNING release; `just test e2e` brings it up and runs the suite.
# Every test is env-gated behind `SCARAB_E2E=1` and skips loudly otherwise, so
# the default `just test` / workspace run never depends on a cluster. Zero
# auto-retries — a red run is a real timing bug (grow-from-bugs applies to the
# harness too).
[package]
name = "scarab-e2e"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Registry seeding for the dispatch-driven scenario, against the e2e database.
scarab-db-postgres = { workspace = true }
scarab-forge = { workspace = true }
# The in-test fake Forgejo the dispatch scenario points a connection at.
axum = { workspace = true }
