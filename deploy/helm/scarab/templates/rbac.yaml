{{- if .Values.rbac.create -}}
{{- /*
  The k8s executor (crates/scarab-executor-k8s) creates one Pod per step,
  deletes it on completion, and tails its logs (ADR-0013). It re-attaches to an
  existing Pod after a control-plane restart (get/list). Scope the Role to the
  namespace step Pods land in — the release namespace by default.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scarab.fullname" . }}-executor
  namespace: {{ include "scarab.execNamespace" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # patch: the workspace CAS root is recorded as a Pod annotation (ADR-0045).
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    # exec: the control plane streams workspaces in/out of the init/egress
    # helpers (ADR-0029/0045 CAS materialize/ingest).
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scarab.fullname" . }}-executor
  namespace: {{ include "scarab.execNamespace" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scarab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scarab.fullname" . }}-executor
{{- end }}
