{{- if .Values.rbac.create -}}
{{- /*
  The k8s executor (crates/scarab-executor-k8s) creates one Pod per step and
  tails its logs (ADR-0013). It re-attaches to an existing Pod after a
  control-plane restart (get/list). The step Pod sweep (git-bug 986542a) lists
  the Pods, Services and NetworkPolicies labelled managed-by=scarab and deletes
  those of Runs that finished more than SCARAB_RETENTION_STEP_POD_MINUTES ago
  (list/delete). Scope the Role to the namespace step Pods land in — the
  release namespace by default.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scarab.fullname" . }}-executor
  namespace: {{ include "scarab.execNamespace" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # patch: the workspace CAS root is recorded as a Pod annotation (ADR-0045).
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    # Per-Pod Secrets the executor upserts before a step runs: the clone token
    # (ADR-0045, GIT_ASKPASS tmpfs mount), the per-attempt OIDC token (ADR-0015),
    # and a build step's registry dockerconfig (ADR-0018). Each is owner-
    # referenced to its Pod, so it is garbage-collected when the Pod is deleted.
    # `update` backs the re-drive refresh (replace-in-place on a 409). `delete`
    # removes the forge token Secret when its Attempt ends (ADR-0076 §9), so a
    # kept Pod does not leave the token stored.
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    # Events: the infra observer reads a Pod's Warning events to explain why it
    # is not running yet (ADR-0068) — `FailedScheduling`, `FailedMount`,
    # `FailedCreatePodSandBox`. This is the text `kubectl describe pod` prints;
    # the Pod object itself does not carry it, and a step Pod that never starts
    # has no logs to tail instead. Read-only, and read only when a Pod's own
    # status left the message blank.
    #
    # Withholding this grant DEGRADES the diagnosis (the observer reports the
    # bare reason) but never fails a run — the executor treats every error here
    # as "no message".
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # exec: the control plane streams workspaces in/out of the init/egress
    # helpers (ADR-0029/0045 CAS materialize/ingest).
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    # Shared services (ADR-0058): the executor creates a cluster-DNS Service per
    # shared-service instance so opt-in step Pods can reach it, and deletes it on
    # Run/Take teardown. (The service *Pod* itself is covered by the pods rule.)
    # `list`: the step Pod sweep finds a finished Run's leftover Services.
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    # Shared services (ADR-0058): a NetworkPolicy scopes reachability of each
    # shared service to the Pods that opted in via `uses:`; created with the
    # service and deleted on teardown. `list`: the step Pod sweep finds a
    # finished Run's leftover NetworkPolicies.
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scarab.fullname" . }}-executor
  namespace: {{ include "scarab.execNamespace" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scarab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scarab.fullname" . }}-executor
{{- end }}
