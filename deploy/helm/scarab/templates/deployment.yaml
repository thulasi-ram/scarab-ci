apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scarab.fullname" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "scarab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the rendered config/secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.scarab.connections }}
        # Roll pods when the declarative connections block changes — config is
        # authoritative for the connections it declares (ADR-0060 part D), so a
        # values edit must reach a running server.
        checksum/connections: {{ include (print $.Template.BasePath "/configmap-connections.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "scarab.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "scarab.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scarab-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Plain config from the ConfigMap; sensitive vars from the Secret.
          # A missing Secret key simply leaves the env var unset.
          envFrom:
            - configMapRef:
                name: {{ include "scarab.fullname" . }}
            - secretRef:
                name: {{ include "scarab.secretName" . }}
                optional: true
          {{- if .Values.secrets.oauthClientSecret.name }}
          # The OAuth client secret (ADR-0049) comes from a Secret you manage
          # out-of-band, by reference — it never passes through Helm values. An
          # explicit `env` entry wins over the `envFrom` above, so this also
          # overrides any SCARAB_OAUTH_CLIENT_SECRET in the referenced Secret.
          env:
            - name: SCARAB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oauthClientSecret.name | quote }}
                  key: {{ .Values.secrets.oauthClientSecret.key | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable scratch for the local object-store fallback + any temp
            # files, since the root filesystem is read-only. Unused when S3 is set.
            - name: scratch
              mountPath: /home/scarab/.scarab
            # Writable /tmp: with readOnlyRootFilesystem the executor's post-step
            # settle (tar the step's /workspace out, unpack into a tempdir before
            # CAS ingest) would hit EROFS on the default TMPDIR and dead-letter
            # the run. A dedicated emptyDir keeps /tmp writable.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.githubAppPemSecret.name }}
            # GitHub App private key projected from a Secret you manage
            # out-of-band (enh 245a99c) — SCARAB_GITHUB_APP_PEM_FILE points at
            # the file inside. Read at boot; a bad path fails the boot loudly.
            - name: github-app-pem
              mountPath: {{ include "scarab.githubAppPemDir" . | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.scarab.connections }}
            # The declarative connections block (ADR-0060 part D) —
            # SCARAB_CONNECTIONS_FILE points at the file inside. Read at boot; a
            # bad path or an invalid entry fails the boot loudly.
            - name: connections
              mountPath: {{ include "scarab.connectionsDir" . | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.githubAppPemSecret.name }}
        - name: github-app-pem
          secret:
            secretName: {{ .Values.secrets.githubAppPemSecret.name | quote }}
            items:
              - key: {{ .Values.secrets.githubAppPemSecret.key | quote }}
                path: {{ .Values.secrets.githubAppPemSecret.key | quote }}
            # Group-readable only: Secret files are owned root:fsGroup, and the
            # container runs as the unprivileged podSecurityContext.fsGroup.
            defaultMode: 0440
        {{- end }}
        {{- if .Values.scarab.connections }}
        - name: connections
          configMap:
            name: {{ include "scarab.connectionsConfigMapName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
