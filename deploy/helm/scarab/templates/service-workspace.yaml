{{- if include "scarab.workspaceEnabled" . -}}
{{- /*
  The workspace service's Service (ADR-0061). A plain ClusterIP on :80 → :8080,
  matching the main Service's shape, so SCARAB_WORKSPACE_URL is
  `http://<fullname>-workspace.<ns>.svc` with no port.

  Deliberately NOT headless: a headless Service exists to give each replica its
  own DNS name, and nothing addresses an individual workspace replica by name.
  Since ADR-0067 the READ side (and the drain-record read) really is
  replica-independent — the fence rows, the drain records and the pack index
  live in Postgres and the durable bytes in the bucket, so any replica can
  ANSWER for any fence. The drain WRITE path is NOT: pack sessions are
  in-memory on whichever replica received the PUTs, and the drain record's
  closure validation reads that replica's own warm volume, so a drain whose
  PUTs and record POST land on different replicas is refused (422 — "drain
  state lost"). replicaCount > 1 therefore remains UNSAFE for drains until the
  write path is made replica-independent (follow-up ticket); the ClusterIP
  shape is still right for the read side, and per-failure-domain placement (a
  later slice) is "which zone's service" — a second Service or a
  topology-aware hint, not per-Pod DNS.

  `publishNotReadyAddresses` is left at its default (false) on purpose: a replica
  whose warm volume is not writable must leave rotation, which is the entire
  reason its /readyz probes by writing.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scarab.fullname" . }}-workspace
  labels:
    {{- include "scarab.workspaceLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "scarab.workspaceSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
{{- end }}
