{{- if and .Values.plugins.enabled .Values.rbac.create -}}
{{- /*
  What the plugin runtime (ADR-0072 §9) may do — and nothing more.

  In the plugin namespace: one ServiceAccount + Deployment per installation,
  the isolation probe's Pods (and their logs), the namespace's
  NetworkPolicies (default-deny + plugin-egress + the probe's two
  allowances), and read access to PersistentVolumeClaims (a plugin's
  storage claim, which an operator creates). It does NOT get to label namespaces: the runtime only reads the
  Pod Security level (the get below, on this one namespace), so it can never
  lower it.

  Cluster-wide: `system:auth-delegator`, for TokenReview — how the broker
  proves a plugin's projected token (audience scarab-broker, bound to its
  Pod). Plugin ServiceAccounts themselves are bound to nothing.
*/ -}}
{{- $sa := include "scarab.serviceAccountName" . -}}
{{- $cluster := printf "%s-%s-plugins" (include "scarab.fullname" .) .Release.Namespace | trunc 63 | trimSuffix "-" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scarab.fullname" . }}-plugin-runtime
  namespace: {{ .Values.plugins.namespace }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    # The isolation probe's canary / control / plugin-labelled Pods, and the
    # status of a plugin's own Pods (why it is not starting).
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    # The probe reads its Pods' verdict lines.
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    # A plugin's storage claim (ADR-0074 §7): read before it is mounted (it
    # must exist and be annotated for the installation) and to report why
    # the plugin is waiting. Read only: Scarab never creates or deletes one.
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scarab.fullname" . }}-plugin-runtime
  namespace: {{ .Values.plugins.namespace }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scarab.fullname" . }}-plugin-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}-namespace
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    # Read the plugin namespace's Pod Security labels — that one namespace.
    resources: ["namespaces"]
    resourceNames: [{{ .Values.plugins.namespace | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}-namespace
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}-auth-delegator
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
{{- end }}
