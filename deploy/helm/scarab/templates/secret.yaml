{{- /* Both master-key values set is ambiguous regardless of existingSecret:
       refuse the render rather than let the server sort it out (f37463a). */ -}}
{{- if and .Values.secrets.masterKey .Values.secrets.masterKeys -}}
{{- fail "set only ONE of secrets.masterKey and secrets.masterKeys — the list form supersedes the single key (its first member is the active writer); move the old key into masterKeys as the second member to rotate" -}}
{{- end -}}
{{- if not .Values.secrets.existingSecret -}}
{{- /* Chart-managed Secret. Only rendered keys are set — others stay unset so
       scarab-server treats them as absent (e.g. no DATABASE_URL => API-only). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scarab.fullname" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.databaseUrl }}
  SCARAB_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKey }}
  SCARAB_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  SCARAB_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.masterKey }}
  SCARAB_MASTER_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.masterKeys }}
  SCARAB_MASTER_KEYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubWebhookSecret }}
  SCARAB_GITHUB_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.forgejoWebhookSecret }}
  SCARAB_FORGEJO_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gateTokenSecret }}
  SCARAB_GATE_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.resultsTokenSecret }}
  SCARAB_RESULTS_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.workspaceTokenSecret }}
  {{- /* ADR-0061. A DIFFERENT secret from resultsTokenSecret, on purpose: the
         results token carries no verb and never expires, so sharing one would
         turn a results-write credential into a content read+write credential —
         and would let the workspace service forge step results for any
         {run, step, attempt}. Both workloads read this key via envFrom, which is
         what lets the server mint tokens the service verifies. */}}
  SCARAB_WORKSPACE_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppPem }}
  SCARAB_GITHUB_APP_PEM: {{ . | quote }}
  {{- end }}
{{- end }}
