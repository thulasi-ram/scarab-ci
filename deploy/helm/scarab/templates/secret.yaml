{{- if not .Values.secrets.existingSecret -}}
{{- /* Chart-managed Secret. Only rendered keys are set — others stay unset so
       scarab-server treats them as absent (e.g. no DATABASE_URL => API-only). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scarab.fullname" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.databaseUrl }}
  SCARAB_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKey }}
  SCARAB_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  SCARAB_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.masterKey }}
  SCARAB_MASTER_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubWebhookSecret }}
  SCARAB_GITHUB_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gateTokenSecret }}
  SCARAB_GATE_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.resultsTokenSecret }}
  SCARAB_RESULTS_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
