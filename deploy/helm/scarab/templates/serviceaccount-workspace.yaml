{{- if and (include "scarab.workspaceEnabled" .) .Values.serviceAccount.create -}}
{{- /*
  A dedicated ServiceAccount for the workspace StatefulSet, with NO RoleBinding.

  This looks like an omission and is not one. In Kubernetes, a Pod's capability
  comes from its ServiceAccount and its mounted Secrets, not from its image — and
  the whole argument for making the workspace service a *role on the converged
  binary* rather than a fourth image rests on that. The chart's Role
  (templates/rbac.yaml) grants pods/secrets/exec for the k8s executor; a
  workspace replica creates no Pods, reads no Secrets through the API, and execs
  into nothing. Giving it the server's ServiceAccount would hand a data-plane
  component the control plane's cluster rights for no reason.

  So: an identity, zero permissions. If you are here because you were about to
  bind a Role to it, the thing you want almost certainly belongs in the server's
  Role instead.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scarab.workspaceServiceAccountName" . }}
  labels:
    {{- include "scarab.workspaceLabels" . | nindent 4 }}
{{- end }}
