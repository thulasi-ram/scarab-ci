{{- /* Fail the render on a contradictory / partial authenticator config before
       anything is applied (ADR-0048/0049). Emits nothing when sane. */ -}}
{{- include "scarab.validateAuth" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scarab.fullname" . }}
  labels:
    {{- include "scarab.labels" . | nindent 4 }}
data:
  SCARAB_ROLE: {{ .Values.scarab.role | quote }}
  SCARAB_EXECUTOR: {{ .Values.scarab.executor | quote }}
  SCARAB_ADDR: {{ .Values.scarab.addr | quote }}
  SCARAB_NAMESPACE: {{ include "scarab.execNamespace" . | quote }}
  {{- with .Values.scarab.s3.bucket }}
  SCARAB_S3_BUCKET: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.s3.endpoint }}
  SCARAB_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- if .Values.scarab.s3.bucket }}
  SCARAB_S3_REGION: {{ .Values.scarab.s3.region | quote }}
  {{- end }}
  {{- with .Values.scarab.oidcIssuer }}
  SCARAB_OIDC_ISSUER: {{ . | quote }}
  {{- end }}
  {{- if include "scarab.oauthConfigured" . }}
  {{- /* OAuth/OIDC login (ADR-0049). The client SECRET is deliberately absent
         here — the Deployment injects it with a secretKeyRef. These four render
         together or not at all: scarab.validateAuth already refused a partial
         provider, which the server would reject at boot anyway. */}}
  SCARAB_OAUTH_CLIENT_ID: {{ .Values.scarab.oauth.clientId | quote }}
  SCARAB_OAUTH_AUTHORIZE_URL: {{ .Values.scarab.oauth.authorizeUrl | quote }}
  SCARAB_OAUTH_TOKEN_URL: {{ .Values.scarab.oauth.tokenUrl | quote }}
  SCARAB_OAUTH_USERINFO_URL: {{ .Values.scarab.oauth.userinfoUrl | quote }}
  {{- with .Values.scarab.oauth.scopes }}
  SCARAB_OAUTH_SCOPES: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.oauth.owners }}
  SCARAB_OAUTH_OWNERS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.scarab.oauth.issuer }}
  SCARAB_OAUTH_ISSUER: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.scarab.devInsecure }}
  SCARAB_DEV_INSECURE: "1"
  {{- end }}
  {{- with .Values.scarab.githubAppId }}
  SCARAB_GITHUB_APP_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.publicUrl }}
  SCARAB_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.cloneImage }}
  SCARAB_CLONE_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.stepTimeoutSecs }}
  SCARAB_STEP_TIMEOUT_SECS: {{ . | quote }}
  {{- end }}
  {{- with .Values.scarab.casConcurrency }}
  {{- /* ADR-0061 s2. Read by BOTH workloads that touch the CAS: the server's
         ingest/materialize legs and the workspace StatefulSet sharing this
         ConfigMap. Peak memory scales with it — see values.yaml. */}}
  SCARAB_CAS_CONCURRENCY: {{ . | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPemSecret.name }}
  {{- /* File-mounted App PEM (enh 245a99c): the path is not sensitive — only
         the mounted Secret is — so it belongs in the ConfigMap. */}}
  SCARAB_GITHUB_APP_PEM_FILE: {{ include "scarab.githubAppPemPath" . | quote }}
  {{- end }}
  {{- if .Values.scarab.connections }}
  {{- /* Declarative connections (ADR-0060 part D): the block itself is a
         mounted ConfigMap; only its path is env. A bad path/parse/validation
         fails the boot loudly, never a degraded start. */}}
  SCARAB_CONNECTIONS_FILE: {{ include "scarab.connectionsPath" . | quote }}
  {{- end }}
  {{- if include "scarab.workspaceEnabled" . }}
  {{- /* The workspace service (ADR-0061). This key is read by BOTH workloads:
         the server dials the URL, and the workspace StatefulSet — which consumes
         the same ConfigMap — reads the data dir. The StatefulSet overrides
         SCARAB_ROLE with an explicit `env` entry, which wins over envFrom. */}}
  SCARAB_WORKSPACE_URL: {{ include "scarab.workspaceUrl" . | quote }}
  SCARAB_WORKSPACE_DATA_DIR: {{ .Values.workspace.dataDir | quote }}
  {{- /* The fetcher image (ADR-0061 s3-feed): the init container every Step with
         `needs:` runs to pull its inputs from the service above. Set even though
         the server has its own default, so a chart-pinned digest is possible.
         ⚠ DELETE ME with the node driver (git-bug 0628369). */}}
  SCARAB_WSFETCH_IMAGE: {{ .Values.workspace.fetcherImage | quote }}
  {{- /* Helper container resources (ticket 16a7768): requests==limits on both
         wsfetch containers; memory also derives the transfer byte budget.
         Rendered only when set — "" keeps the server's own defaults. */}}
  {{- if ne (toString .Values.workspace.helperMemoryMib) "" }}
  SCARAB_WSFETCH_MEMORY_MIB: {{ .Values.workspace.helperMemoryMib | quote }}
  {{- end }}
  {{- if ne (toString .Values.workspace.helperCpuMillis) "" }}
  SCARAB_WSFETCH_CPU_MILLIS: {{ .Values.workspace.helperCpuMillis | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.resultsTokenSecret }}
  SCARAB_SIDECAR_IMAGE: {{ .Values.scarab.sidecarImage | quote }}
  SCARAB_RESULTS_API_URL: {{ .Values.scarab.resultsApiUrl | default (printf "http://%s.%s.svc" (include "scarab.fullname" .) .Release.Namespace) | quote }}
  {{- end }}
  {{- range $k, $v := .Values.scarab.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
