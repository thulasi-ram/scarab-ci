# Default values for the scarab chart.
# Every stanza maps to scarab-server's env-driven config (see crates/scarab-server/src/config.rs).

image:
  repository: ghcr.io/thulasi-ram/scarab-server
  # Pin to a digest or immutable tag in production; `edge` tracks main.
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Number of scarab-server replicas. Safe to scale, with converged or split
# roles: Postgres is the coordination bus, and `launch` is idempotent on the
# Attempt's fence (ADR-0021, ADR-0047). A replica supervises a Step only while
# it holds that Step's launch intent claim, and renews the claim every 10 s
# while it works (a workspace drain can outlast the 30 s window). A replica that
# loses its claim stops driving the launch within one renewal period; a replica
# that dies stops renewing and a peer takes the intent over within 30 s.
# Admission is leader-only; the ADR-0077 amendment covers how a leader that
# lost its lease is kept from writing.
replicaCount: 1

# How the server Deployment is updated. `Recreate` stops every old server Pod
# before a new one starts, so two server versions never schedule the same Runs.
# A release whose stored data an older server reads wrongly (v0.3.0: library
# Step scopes) needs this. `RollingUpdate` keeps the API up during an upgrade;
# use it only between releases whose notes say a mixed-version window is safe.
strategy:
  type: Recreate

scarab:
  # api | scheduler | executor | webhook | converged (ADR-0016).
  role: converged
  # k8s (production, one Pod per step) | local (host processes — dev only).
  executor: k8s
  # Namespace the executor launches step Pods into. Empty => the release
  # namespace (.Release.Namespace); the RBAC below is granted there.
  namespace: ""
  # Address scarab-server binds inside the container.
  addr: "0.0.0.0:8080"
  # Extra plain (non-secret) env vars, e.g. RUST_LOG.
  extraEnv:
    RUST_LOG: "info"

  # --- forge / GitHub App auth (ADR-0046) ---------------------------------
  # GitHub App id: when set, GitHub connections authenticate in App mode (their
  # credential secret is the App PEM, stored via the API at org `_forge`).
  # Empty => token mode (dev).
  githubAppId: ""
  # Scarab's public base URL: the run deep-link every forge commit status
  # carries (`{publicUrl}/runs/{id}`). Empty => the server default
  # (http://localhost:8080). Set this to your ingress / tunnel URL.
  publicUrl: ""
  # The URL people open the web UI at, when it is not publicUrl: for example a
  # staging install whose public hostname serves only /webhooks/ while people
  # use http://localhost:8080 through a port-forward. The OAuth callback
  # (`{uiUrl}/v1/auth/callback`, the URL to register with the login provider),
  # the passkey origin and step-up confirmation links use it; webhooks and
  # commit-status links stay on publicUrl. Empty => publicUrl. Browsers refuse
  # passkeys on an IP address, so a local one is http://localhost:<port>.
  uiUrl: ""
  # Global default step deadline in seconds (ADR-0047). Empty => server
  # default (3600). Per-step `timeout:` always overrides.
  stepTimeoutSecs: ""
  # Seconds a step Pod the scheduler calls Unschedulable waits for a node
  # before the step fails. A cluster autoscaler (Karpenter, Cluster Autoscaler)
  # marks every Pod that needs a new node Unschedulable until the node joins,
  # so a node pool that scales to zero needs this. Empty => server default
  # (300), at most 1800 (an attempt not started 30 minutes after it was
  # claimed fails anyway). "0" fails such a Pod at once (no autoscaler). Each
  # automatic retry of the step waits again.
  unschedulableGraceSecs: ""
  # The most Runs of one project (repository) that may be Running at once; the
  # rest wait Pending and start in priority order as Runs finish (ADR-0011).
  # A Run waiting on a gate is not counted. Empty or 0 => no cap (default).
  projectRunCap: ""
  # In-flight object-store round-trips per workspace-CAS leg (ADR-0061 s2).
  # Empty => server default (32). The legs are latency-bound, so 32 is a FLOOR
  # for remote object storage — raise it the further away the bucket is. Lower it
  # when blobs are large: a blob is buffered whole, so peak memory is roughly
  # `casConcurrency × largest blob`. A non-positive/junk value fails the boot.
  casConcurrency: ""

  # --- declarative forge connections (ADR-0060 part D) --------------------
  # Config-owned connections: provisioned at boot, AUTHORITATIVE, and read-only
  # in the UI ("managed by configuration"). A connection has exactly one owner —
  # this block or the database — never both: declaring an id the database
  # already owns REFUSES the boot rather than letting config and the running
  # system drift apart. Undeclaring an entry releases ownership back to the UI;
  # it never deletes the connection (Projects hang off its repo bindings).
  #
  # Rendered verbatim into a mounted ConfigMap, so these keys are the SERVER's
  # schema (snake_case), not the chart's camelCase. An unknown key fails the
  # boot loudly (ADR-0048) instead of being silently ignored.
  #
  # Credential resolution is one path — env override, then Scarab's secret store:
  #   credential: { env: FORGEJO_CI_TOKEN }        # supply the var via
  #                                                # secrets.existingSecret or
  #                                                # scarab.extraEnv
  #   credential: { file: /etc/scarab/forgejo/tok } # a Secret you mount yourself
  #   credential: { secret_ref: forgejo-token }     # `_forge`-scoped handle in
  #                                                # Scarab's own secret store
  # An `env`/`file` credential that is missing or empty fails the boot; a
  # `secret_ref` that is not registered yet is reported DEGRADED (only the
  # running server can store it).
  #
  # Each `repos:` entry binds `owner/name` as a Project (ADR-0046) — the
  # declarative repo-onboarding path, and the only way Forgejo repos become
  # Projects without clicking through the UI.
  #
  # A connection serves one org: `org:`, or the one owner of its `repos:`.
  # Every repo must be owned by that org; a repo of another owner, repos of
  # several owners without `org:`, or no repos and no `org:` fail the boot.
  #
  # connections:
  #   - id: forgejo-main
  #     kind: forgejo                  # github | forgejo
  #     org: acme
  #     base_url: https://git.example.com
  #     credential:
  #       env: FORGEJO_CI_TOKEN
  #     repos:
  #       - acme/widgets
  connections: []

  # --- operator placement config (ADR-0055) -------------------------------
  # Where step Pods schedule. On a cluster whose every node pool is tainted this
  # is REQUIRED: it is the only place step Pods (including clone steps) get
  # tolerations, so without it they stay Pending. It does NOT place the server
  # or the workspace StatefulSet — those use the top-level `tolerations` /
  # `nodeSelector` and `workspace.tolerations` / `workspace.nodeSelector`.
  #
  # Rendered verbatim into a mounted ConfigMap, so these keys are the SERVER's
  # schema (snake_case). Only `baseline`, `default_resources` and `profiles` are
  # accepted; any other top-level key fails the render (the server itself would
  # silently ignore it, leaving every step Pod Pending).
  #
  # `baseline` and each profile's `k8s` are POD fragments, strategic-merged onto
  # the whole Pod — so pod-spec fields go under `spec:`. A profile's
  # `tolerations` are added to the baseline's. A `tolerations:` placed
  # directly under `baseline:` would be dropped silently; the chart refuses it.
  #
  #   baseline:              # merged onto EVERY step Pod
  #     spec:
  #       tolerations:
  #         - key: dedicated
  #           operator: Equal
  #           value: ci
  #           effect: NoSchedule
  #       nodeSelector:
  #         pool: ci
  #   default_resources:     # applied when a step requests none; a step's own
  #     cpu_millis: 500      # `resources` wins per field
  #     memory_mib: 1024
  #   profiles:              # named; a step selects with `placement_profiles: [big]`
  #     - name: big
  #       k8s:
  #         spec:
  #           nodeSelector:
  #             pool: ci-large
  #     - name: ecr-push       # carries a registry credential (a push role):
  #       registry_auth_only: true   # applied only to a `registry_auth` step
  #       k8s:                 # the launch found eligible for one; named on
  #         spec:              # any other step it fails the launch. Cannot be
  #           serviceAccountName: ecr-pusher   # combined with `default: true`.
  #
  # Mark every profile that grants push access (a ServiceAccount with a push
  # role, an init container that logs in) `registry_auth_only: true`. Authors
  # name profiles, so the marker is what keeps it off steps that run their code.
  placement: {}

  # Object store (logs, artifacts, the workspace CAS cold tier). EFFECTIVELY
  # MANDATORY (ADR-0067 part 1): the server no longer falls back to a local
  # directory when bucket is empty — it refuses to boot (MissingObjectStore),
  # and the workspace StatefulSet additionally write-probes the bucket at boot
  # and refuses to serve if it is unreachable or read-only. The chart does not
  # ship a MinIO; point this at any S3-compatible endpoint you run (the
  # in-cluster MinIO of deploy/kind, a cloud bucket, ...). The only way
  # to run without a bucket is an explicit SCARAB_OBJECT_DIR via
  # scarab.extraEnv — a tests/dev stand-in whose contents die with the Pod;
  # never production.
  #
  # DEPLOYMENT REQUIREMENT (git-bug ad79c90): the bucket MUST have a
  # lifecycle rule aborting incomplete multipart uploads. The Depot streams
  # drain bytes as multipart pack uploads; it aborts them on its own error
  # paths and on graceful shutdown, but a CRASHED replica cannot — and an
  # S3-compatible store gives a server no way to list uploads it does not
  # know about, so the leaked parts bill forever without this rule. On AWS
  # S3 (and compatibles that implement lifecycle):
  #
  #   Rules:
  #     - ID: abort-incomplete-multipart
  #       Status: Enabled
  #       AbortIncompleteMultipartUpload:
  #         DaysAfterInitiation: 1
  #
  # One day is safe by construction: no live upload outlives its drain (the
  # control plane's drain clock is minutes, the fence token's ceiling ~24h).
  # MinIO needs nothing — it expires stale multipart uploads natively
  # (`mc admin config get <alias> api` → stale_uploads_expiry=24h, swept
  # every stale_uploads_cleanup_interval=6h by default), and its mc ships no
  # abort-incomplete-multipart ILM flag at all.
  #
  # CREDENTIALS: secrets.s3AccessKey + secrets.s3SecretKey (both, or neither).
  # With neither, the server uses AWS's ambient credential chain — on EKS that
  # is IRSA (or Pod Identity): annotate BOTH ServiceAccounts with the role,
  # since the control plane and the workspace StatefulSet each talk to the
  # bucket:
  #
  #   serviceAccount.annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/scarab
  #   workspace.serviceAccount.annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/scarab
  s3:
    bucket: ""
    endpoint: ""       # e.g. http://minio.scarab.svc:9000 ; empty => AWS S3
    region: "us-east-1"

  # OIDC issuer public URL for keyless federation (ADR-0014). Empty => disabled.
  # When set, SCARAB_OIDC_SIGNING_KEY_FILE must point at a persistent PKCS#8
  # RSA PEM (mount it via extraEnv + a volume, or bake it into existingSecret) —
  # the server refuses to boot without one (ADR-0048).
  oidcIssuer: ""

  # --- OAuth/OIDC login (ADR-0049) ----------------------------------------
  # Real authentication: a forge-agnostic OAuth/OIDC provider (GitHub, Forgejo,
  # or any OIDC issuer — the endpoints are explicit, so there is no per-forge
  # special case). Empty => no authenticator, and the server then only boots
  # under scarab.devInsecure (ADR-0048 fail-closed).
  #
  # The four URLs/ids below plus a client SECRET are all-or-nothing: the server
  # refuses to boot on a partial provider, so the chart refuses to render one.
  # The secret is NEVER a chart value — supply it via
  # secrets.oauthClientSecret.name (mounted as env via secretKeyRef) or as a
  # SCARAB_OAUTH_CLIENT_SECRET key of secrets.existingSecret.
  #
  # Setting this together with devInsecure is a hard render error, not a
  # fallback: dev-insecure would silently make every caller an Owner again.
  oauth:
    clientId: ""
    authorizeUrl: ""    # e.g. https://github.com/login/oauth/authorize
    tokenUrl: ""        # e.g. https://github.com/login/oauth/access_token
    userinfoUrl: ""     # e.g. https://api.github.com/user
    # Space-separated scopes for the authorize redirect. May be empty.
    scopes: ""
    # OIDC issuer URL (ADR-0049 amendment). Empty => plain OAuth2: the provider
    # returns no id_token and the Principal comes from userinfoUrl (GitHub,
    # Forgejo). Set => OIDC mode: the id_token is verified against this
    # issuer's discovery/JWKS and its claims are authoritative (Dex, Keycloak,
    # Google). Only meaningful alongside the four knobs above — setting it
    # alone makes the server refuse to boot, so the chart refuses to render it.
    issuer: ""          # e.g. https://dex.example.com
    # Subjects granted Owner at login (bootstrap until scoped RBAC, ADR-0049
    # C2); everyone else authenticates as Viewer. Rendered comma-separated into
    # SCARAB_OAUTH_OWNERS. Leave empty and nobody can administer the install.
    # An entry matches the provider subject OR a verified email claim — with an
    # OIDC issuer, `sub` is usually an opaque id, so prefer the email there.
    #
    # ADR-0069: an entry matches a Principal ID (`alice` from this legacy
    # provider, `github:alice` from a named one below) or `<provider>:<email>`,
    # honoured only when THAT provider asserts email_verified. A bare email is
    # refused at boot when more than one provider is configured.
    owners: []
    # This provider's id (ADR-0069; default `default`). It keeps minting the
    # pre-ADR-0069 bare ids, so existing bindings keep resolving.
    providerId: ""
    providerName: ""    # login-button label; default "Sign in"
    # The forge this provider IS, equal to that forge's connection base_url
    # (`https://api.github.com` for GitHub, the web host for Forgejo), so a
    # forge-permission import resolves through it (ADR-0069).
    forgeUrl: ""
    # Further login providers (ADR-0069), each minting `<id>:<handle>` ids.
    # Every entry needs id ([a-z0-9-]+), clientId, the three URLs, and
    # clientSecret.name (a Secret you manage; key defaults to client-secret) —
    # the secret reaches the Pod by secretKeyRef, never through this ConfigMap.
    #   - id: okta
    #     name: Okta
    #     clientId: "0oa…"
    #     authorizeUrl: https://acme.okta.com/oauth2/v1/authorize
    #     tokenUrl: https://acme.okta.com/oauth2/v1/token
    #     userinfoUrl: https://acme.okta.com/oauth2/v1/userinfo
    #     issuer: https://acme.okta.com
    #     scopes: openid profile email
    #     forgeUrl: ""
    #     clientSecret: { name: okta-oauth, key: client-secret }
    providers: []

  # ⚠ Dev-only (ADR-0048): boots without an authenticator/KEK, with loud
  # warnings, instead of refusing. NEVER set in production — every caller
  # becomes a synthetic Owner. Mutually exclusive with scarab.oauth above.
  devInsecure: false

  # Results-egress sidecar image injected into step Pods (ADR-0042). Only used
  # once the results token is set — `secrets.resultsTokenSecret`, or a
  # SCARAB_RESULTS_TOKEN_SECRET key in `secrets.existingSecret`. Pin it (a tag or
  # digest) in production: the default floats.
  sidecarImage: "ghcr.io/thulasi-ram/scarab-results-sidecar:edge"
  # Base URL step-Pod sidecars POST results back to. Empty => the in-cluster
  # Service DNS name derived from the release.
  resultsApiUrl: ""

  # Base URL of the workspace service (ADR-0061). Empty => the in-cluster
  # Service DNS name derived from the release, which is right unless you run the
  # service from a separate release (e.g. one per availability zone).
  workspaceUrl: ""

# Sensitive config. Two modes:
#   1. existingSecret: reference a Secret you manage out-of-band (recommended
#      for production). Keys must match the env var names below.
#   2. Inline values here => the chart renders a Secret. Fine for dev; do NOT
#      commit real values.
secrets:
  existingSecret: ""
  # --- inline (rendered into a chart-managed Secret when existingSecret is "") ---
  # Postgres URL. MANDATORY (ADR-0048): scarab-server refuses to boot without it.
  databaseUrl: ""
  # S3/MinIO static credentials. Set both, or leave both empty to use AWS's
  # ambient credentials (IRSA / Pod Identity — see scarab.s3 above).
  s3AccessKey: ""
  s3SecretKey: ""
  # base64 32-byte key so encrypted secrets survive restarts (ADR-0014).
  # MANDATORY (one of masterKey / masterKeys) unless scarab.devInsecure is on
  # (ADR-0048). Set EITHER this or masterKeys, never both — the chart fails
  # the render on both.
  masterKey: ""
  # Rotation-aware form (git-bug f37463a): comma-separated base64 32-byte
  # keys; the FIRST is the active writer, the rest decrypt-only. To rotate,
  # set "<new>,<old>", deploy (the boot sweep + reads rewrap every row),
  # confirm via the startup-report KEK line / the
  # scarab_secrets_rows_under_nonactive_key gauge reaching 0, then drop <old>.
  masterKeys: ""
  # HMAC secrets for webhook verification / gate + results token minting.
  # Each forge binds its own secret (ADR-0046): githubWebhookSecret renders
  # SCARAB_GITHUB_WEBHOOK_SECRET (/webhooks/github) and forgejoWebhookSecret
  # renders SCARAB_FORGEJO_WEBHOOK_SECRET (/webhooks/forgejo). Set only the ones
  # whose adapter you actually deliver to.
  githubWebhookSecret: ""
  forgejoWebhookSecret: ""
  gateTokenSecret: ""
  resultsTokenSecret: ""
  # HMAC secret for the workspace token (ADR-0061): the credential a step Pod
  # presents to the workspace service. Set this to enable the service — the
  # StatefulSet refuses to boot without it, because a workspace service with no
  # token secret would serve every step's inputs to any caller that can reach the
  # port. It MUST be different from resultsTokenSecret: that one carries no verb
  # and never expires, so reusing it would turn a results-write credential into a
  # content read+write credential, and would let the workspace service forge step
  # results for any {run, step, attempt} — the workspace service being precisely
  # the component ADR-0061 moves out of the trusted control plane.
  workspaceTokenSecret: ""
  # GitHub App private-key PEM (enh 245a99c): supplies the App credential at
  # boot, GitOps-style — no PUT /v1/secrets reseed, and it survives DB recreate.
  # Overrides any DB-stored `_forge` credential. For existingSecret mode, add a
  # SCARAB_GITHUB_APP_PEM key to your Secret instead (both arrive via envFrom).
  # NB: connection/installation registration is separate state — still seeded
  # via reseed.sh's synthetic webhook or a real GitHub delivery.
  githubAppPem: ""
  # The same credential mounted as a FILE — the GitOps-native shape, since the
  # PEM stays in a Secret you manage out-of-band (external-secrets /
  # sealed-secrets / SOPS) and no key material passes through Helm values at
  # all. The chart projects `key` from `name` read-only and points
  # SCARAB_GITHUB_APP_PEM_FILE at it. Independent of existingSecret (that is
  # envFrom; this is a volume), and an inline githubAppPem wins if both are set.
  # An unreadable path is a boot failure (ADR-0048), not a silent downgrade.
  githubAppPemSecret:
    name: ""                # Secret to mount; empty => no mount, no env var
    key: github-app.pem     # key within that Secret holding the PEM
  # OAuth client secret (ADR-0049), same shape as githubAppPemSecret: a Secret
  # you manage out-of-band (external-secrets / sealed-secrets / SOPS), never a
  # plaintext value here. The chart wires it into SCARAB_OAUTH_CLIENT_SECRET
  # with a secretKeyRef — no key material passes through Helm values. If you
  # already run secrets.existingSecret, add a SCARAB_OAUTH_CLIENT_SECRET key
  # there instead and leave this empty; this ref wins if both are set.
  oauthClientSecret:
    name: ""                     # Secret holding it; empty => no env var
    key: oauth-client-secret     # key within that Secret

# --- the workspace service (ADR-0061) ---------------------------------------
# A warm content-addressed store on a PERSISTENT VOLUME, in front of the
# configured object store as the cold archive. In the standard path in every
# deployment mode, because a fast path plus a fallback path is two mental models
# and the taxonomy cost is worse than the component cost.
#
# This is the chart's FIRST StatefulSet and its first PVC. The volume attaches to
# the SERVICE, never to a step Pod — every problem PVCs have at step grain
# (attach/detach latency per boundary, stuck volumes when a spot node is
# reclaimed, per-node attachment quotas) comes from binding volumes to
# short-lived pods.
#
# It runs the SAME IMAGE as the server with SCARAB_ROLE=workspace, which is what
# makes server↔service version skew structurally impossible under one release.
#
# `enabled: true` but nothing renders unless secrets.workspaceTokenSecret is set:
# the service needs a token secret to verify anything, so an install that has not
# set one gets no service rather than an open one.
workspace:
  enabled: true
  # One per failure domain. Drains are replica-safe by construction since
  # git-bug afb13c2 — sealed packs are staged into the shared index at seal
  # time and the record POST commits the fence's union (see
  # templates/service-workspace.yaml) — so >1 is CORRECT, and 2 replicas pass
  # the ADR-0077 rank 1 fault runs (`just test chaos`). Per-AZ topology is a
  # later slice.
  #
  # Above 1, each Cache has a home replica chosen from its cache key, and the
  # chart renders one Service per replica (`<fullname>-workspace-<ordinal>`,
  # templates/service-workspace-replicas.yaml) so a Step Pod can reach it
  # (git-bug 12e2f6b). Changing the count moves about 1/N of the cache keys
  # to a new home; each moved key misses once.
  #
  # The server reads the count from SCARAB_WORKSPACE_REPLICAS, which the chart
  # copies from this value. Change it here and upgrade the release: after a
  # `kubectl scale` of the StatefulSet the server still picks homes over the
  # old count, so Caches go to the wrong replica (or to one that does not
  # exist, a miss) until the release is upgraded.
  replicaCount: 1
  # One Depot replica's URL with `{ordinal}` in place of its StatefulSet
  # ordinal — where a Step Pod sends and reads its Cache. Empty = the
  # per-replica Services above, `http://<fullname>-workspace-{ordinal}.<ns>.svc`.
  # Set it only when scarab.workspaceUrl points somewhere else too (a split
  # install). Ignored at replicaCount 1.
  homeUrlTemplate: ""
  # Where the warm tier lives inside the container — the PVC's mount point, and
  # the value of SCARAB_WORKSPACE_DATA_DIR.
  dataDir: /var/lib/scarab/cas
  # The scarab-wsfetch image, and it is ONE knob for TWO containers in every
  # workspace Step Pod (ADR-0061):
  #   - the FETCHER init container (s3-feed): pulls a Step's input snapshots
  #     from the service when it has `needs:`;
  #   - the EGRESS helper (s3-drain): `scarab-wsfetch hold` keeps the Pod open
  #     after the step exits, and the control plane execs `scarab-wsfetch
  #     drain` in it to publish /workspace to the Depot in-Pod.
  # Digest-pin in production, as a library pins its images.
  #
  # ⚠ ROLLOUT ORDER: publish/load this image BEFORE (or with) a control plane
  # that expects the s3-drain helper. A stale wsfetch has no subcommands — the
  # `drain` argv is ignored, it runs fetch and exits 0 with NO drain record —
  # and the control plane fails the Attempt promptly as a Config error naming
  # the skew (fast and legible, never wedged to the step budget) — but it
  # fails it. Image first, control plane second.
  #
  # The EAGER feed is the fetch path: measurement showed it is not the
  # bottleneck, and the lazy Workspace Export that was to replace it was
  # cancelled (ADR-0066; the machinery is deleted, git-bug 0ec3b39). This
  # image feeds /workspace before the step and provides the drain helper
  # after it. While the eager feed is live, `eager_fetch_total` on the
  # server is climbing.
  fetcherImage: ghcr.io/thulasi-ram/scarab-wsfetch:edge
  # Resources for BOTH wsfetch helper containers in every workspace Step Pod
  # (the fetcher init container and the egress hold/drain sidecar), applied
  # requests==limits (ticket 16a7768). Without them the helper was invisible
  # to the scheduler and unbounded — the drain hashes and uploads the whole
  # workspace in-Pod, and a node-pressure OOM-kill classifies Transient and
  # loops with nothing naming why.
  #
  # helperMemoryMib ALSO derives the helper's transfer byte budget (half the
  # limit — SCARAB_WORKSPACE_TRANSFER_BUDGET_BYTES): the cap on blob bytes the
  # fetch/drain hold in memory at once. One knob, both bounds, no drift.
  # Residual, disclosed: the helper whole-reads each file, so a SINGLE
  # workspace file approaching this limit needs it raised.
  #
  # OPT-IN (e140121 review): "" = NO k8s limit and no derived budget — the
  # pre-16a7768 Pod shape, byte for byte. The wsfetch binary's own 256 MiB
  # transfer budget still bounds fetch/drain memory (without a kill attached),
  # so unconfigured deployments are bounded but never OOM-killed by a default
  # a large single artifact could exceed. 0 = explicitly unset (same effect).
  helperMemoryMib: ""
  # Millicpu for the same two containers, requests==limits. "" = unset (the
  # default: a CPU limit throttles the drain's hashing, and the drain clock is
  # already the liveness bound). 0 = explicitly unset.
  helperCpuMillis: ""
  # Warm space bound in PLAIN BYTES (git-bug cba7165) — over it the service's
  # LRU sweep evicts back to 80% of the bound: committed-durable content first
  # (free — the packs serve it straight back), cache-only content second (a
  # licensed cache miss). "" = the default: 90% of the warm volume's statvfs
  # capacity, i.e. 90% of persistence.size, since the PVC is dedicated. Set it
  # only to hold the sweep BELOW the volume (e.g. to leave headroom for
  # filesystem overhead on a small PVC).
  warmBudgetBytes: ""
  # Blob-read authorization mode (SCARAB_DEPOT_BLOB_AUTHZ, ticket 52ef3aa):
  # a fenced token may read only blobs in the closure of its own roots claim.
  # "" = the binary's rollout default (`log`: compute the allowlist, count
  # would-denies on scarab_depot_blob_authz_would_deny_total, never refuse
  # a DENIAL). One caveat: log mode still runs the real closure walk, so a
  # token whose roots claim contains an unwalkable root (absent from warm,
  # packs and cold alike) will 500 blob reads that miss the allowlist -
  # where off would have served them. Intended fail-closed-on-availability
  # behavior, listed so flipping off->log is not a surprise.
  # Set `enforce` once that counter has stayed zero over a representative
  # window; `off` restores the pre-ticket authenticated-only reads.
  blobAuthz: ""
  persistence:
    # The warm tier is bounded by SPACE (cold is bounded by time). The service
    # enforces the bound itself (git-bug cba7165): its LRU sweep holds usage
    # under warmBudgetBytes — by default 90% of this volume — so sizing this
    # PVC is sizing the CACHE, not a leak's runway. Pressure is visible as
    # scarab_workspace_warm_used_bytes vs scarab_workspace_warm_budget_bytes,
    # and what the bound costs as warm_evicted_bytes_total{class="cache_only"}.
    # Choose it up front: it lands in the StatefulSet's volumeClaimTemplates,
    # which Kubernetes never lets an upgrade change (to resize, expand the PVC
    # itself, then recreate the StatefulSet with --cascade=orphan).
    size: 20Gi
    # This volume is the warm CAS — the Depot's local cache tier in front of
    # the cold object store (ADR-0066: the Depot is a cache). Its whole point
    # is local-syscall reads and writes, so prefer LOCAL DISK: an NFS-backed
    # class puts a network round trip back under every blob, which is exactly
    # the cost the warm tier exists to remove.
    storageClass: ""       # "" = the cluster default
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  # The same four knobs as the server's top-level command / args /
  # extraVolumes / extraVolumeMounts, for the workspace container and Pod.
  # They change only the Pod template, never volumeClaimTemplates, so an
  # upgrade may set or clear them.
  command: []
  args: []
  extraVolumes: []
  extraVolumeMounts: []
  # Annotations for the workspace ServiceAccount (it has its own — see
  # templates/serviceaccount-workspace.yaml), e.g. the IRSA role it uses to
  # reach the bucket when secrets.s3AccessKey/s3SecretKey are empty.
  serviceAccount:
    annotations: {}

# Plugins (ADR-0072): long-lived vendor workloads (e.g. the Argo CD plugin) that Scarab runs in ONE shared namespace and talks to only through
# the CredentialBroker — a second listener of scarab-server, exposed by a
# ClusterIP Service and NEVER through the ingress.
#
# OFF by default. Turning it on renders:
#   - the plugin namespace, labelled Pod Security `restricted` (enforce). The
#     runtime REFUSES to run anything in a namespace without that label;
#   - a Role there (ServiceAccounts, Deployments, Pods, Pod logs,
#     NetworkPolicies — the runtime writes a default-deny + one egress
#     allowance itself), `get` on that one namespace, and a ClusterRoleBinding
#     to `system:auth-delegator` so the broker can verify plugin tokens with
#     TokenReview;
#   - the broker Service and port, and SCARAB_PLUGINS=on with the broker's
#     address and NetworkPolicy peer derived from this release.
#
# The cluster MUST enforce NetworkPolicy: before any plugin starts (and every
# 6 h) the server runs an isolation probe in the namespace, and a CNI that
# ignores NetworkPolicy fails it — the plugin then stays down, with the reason
# on its installation (runtime_status probe_failed). A probe that cannot tell
# (its Pods did not run, say) starts nothing and runs again on the next pass;
# a plugin already running keeps running until 12 h after the last probe that
# passed, and is then held the same way.
plugins:
  enabled: false
  # The one shared plugin namespace (SCARAB_PLUGIN_NAMESPACE).
  namespace: scarab-plugins
  # Render the namespace (with its Pod Security labels). Set false if you
  # create it yourself — it must carry
  # pod-security.kubernetes.io/enforce=restricted and
  # scarab.io/plugin-runtime-owner=<release namespace>.<release name>.
  createNamespace: true
  # Which release owns the plugin namespace (SCARAB_PLUGIN_OWNER, the
  # scarab.io/plugin-runtime-owner label). "" = <release namespace>.<release
  # name>. A label value: at most 63 characters, unique to this release. Set
  # it when the default is longer than that (the chart then refuses to
  # render rather than truncate two releases into one owner).
  owner: ""
  # A NetworkPolicy on the scarab-server Pods: the broker port only from
  # plugin workloads in the plugin namespace; the API port stays open to
  # every source. Needs a CNI that enforces NetworkPolicy (plugins already
  # do). Off only if another policy already governs these Pods.
  brokerIngressPolicy: true
  # What every plugin together may take: a ResourceQuota on the plugin
  # namespace, and a LimitRange with container defaults (the isolation
  # probe's Pods set none) and a per-container cap. A plugin Pod asks for
  # 50m/64Mi and at most 500m/256Mi; the probe adds three short-lived Pods
  # that take the defaults below (10m/16Mi, at most 500m/128Mi).
  #
  # `pods` is the cap that binds: the other four admit 50 Pods of the
  # largest kind. 47 plugins and the 3 probe Pods need
  #   requests: 47 x 50m + 3 x 10m = 2.38 CPU; 47 x 64Mi + 3 x 16Mi = 3056Mi
  #   limits:   50 x 500m          = 25 CPU;   47 x 256Mi + 3 x 128Mi = 12416Mi
  # so requests are 3 CPU / 4Gi and limits 25 CPU / 13Gi (50 plugin Pods:
  # 2.5 CPU / 3200Mi requested, 25 CPU / 12800Mi limit). Raise them with
  # `pods`, or Pods are refused before the count is reached.
  #
  # A process limit per Pod is not a namespace setting: set the kubelet's
  # `podPidsLimit` (e.g. 1024) on nodes that run plugins, so a plugin cannot
  # exhaust a node's process IDs.
  quota:
    enabled: true
    pods: 50
    requestsCpu: "3"
    requestsMemory: 4Gi
    limitsCpu: "25"
    limitsMemory: 13Gi
    containerDefaultRequestCpu: 10m
    containerDefaultRequestMemory: 16Mi
    containerDefaultLimitCpu: 500m
    containerDefaultLimitMemory: 128Mi
    containerMaxCpu: "1"
    containerMaxMemory: 1Gi
  # The broker listener's port (SCARAB_BROKER_ADDR) and its Service port —
  # the same number, so the NetworkPolicy port and the URL agree.
  brokerPort: 8090
  # The isolation probe's (and every plugin Pod's self-check) image (busybox:
  # httpd, nc, wget, nslookup, timeout). "" = the server default, busybox:1.36.1
  # pinned by digest. An override should be digest-pinned too: the probe's
  # verdict is only as good as the image printing it.
  probeImage: ""

# RBAC the k8s executor needs to run one Pod per step in scarab.namespace.
# NOTE: the workspace StatefulSet gets its own ServiceAccount with NO
# RoleBinding — see templates/serviceaccount-workspace.yaml for why that is
# deliberate rather than an omission.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. IRSA / Workload Identity role bindings

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # A fixed node port, used only when type is NodePort. Empty => Kubernetes
  # picks one. `just stack up` fixes it so a kind port mapping can point at it.
  nodePort: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: scarab.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# /healthz is a cheap static handler (crates/scarab-server/src/lib.rs).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    # Readiness = can this replica serve (DB + store reachable, ADR-0053) —
    # distinct from liveness (/healthz = process up).
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# Container hardening: scarab-server runs as an unprivileged user and needs no
# write access to its root filesystem (object dir is under the writable home).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Override the server container's entrypoint and arguments. Empty => the
# image's ENTRYPOINT. The role comes from scarab.role either way (SCARAB_ROLE).
# `just stack up` uses this to run a binary built on the host from a hostPath volume:
#   command: ["/opt/scarab/bin/scarab-server"]
command: []
args: []
# Extra volumes for the server Pod, and where its container mounts them. Plain
# Kubernetes volume and volumeMount lists, appended after the chart's own.
#   extraVolumes:
#     - name: host-build
#       hostPath: { path: /scarab, type: Directory }
#   extraVolumeMounts:
#     - name: host-build
#       mountPath: /opt/scarab
#       readOnly: true
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus scraping (ADR-0053): render a ServiceMonitor when the Prometheus
# Operator CRDs are installed.
serviceMonitor:
  enabled: false
  interval: 30s
