# Default values for the scarab chart.
# Every stanza maps to scarab-server's env-driven config (see crates/scarab-server/src/config.rs).

image:
  repository: ghcr.io/thulasi-ram/scarab-server
  # Pin to a digest or immutable tag in production; `edge` tracks main.
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Number of scarab-server replicas. Safe to scale: Postgres (the outbox) is the
# coordination bus, and `launch` is idempotent (ADR-0021). For a converged
# deployment keep this at 1 unless you split roles.
replicaCount: 1

scarab:
  # api | scheduler | executor | webhook | converged (ADR-0016).
  role: converged
  # k8s (production, one Pod per step) | local (host processes — dev only).
  executor: k8s
  # Namespace the executor launches step Pods into. Empty => the release
  # namespace (.Release.Namespace); the RBAC below is granted there.
  namespace: ""
  # Address scarab-server binds inside the container.
  addr: "0.0.0.0:8080"
  # Extra plain (non-secret) env vars, e.g. RUST_LOG.
  extraEnv:
    RUST_LOG: "info"

  # --- forge / GitHub App auth (ADR-0046) ---------------------------------
  # GitHub App id: when set, GitHub connections authenticate in App mode (their
  # credential secret is the App PEM, stored via the API at org `_forge`).
  # Empty => token mode (dev).
  githubAppId: ""
  # Scarab's public base URL: the run deep-link every forge commit status
  # carries (`{publicUrl}/runs/{id}`). Empty => the server default
  # (http://localhost:8080). Set this to your ingress / tunnel URL.
  publicUrl: ""
  # The canonical scarab-clone image a `clone` step runs (ADR-0045). Empty =>
  # the server default (ghcr `:edge`). Digest-pin in production.
  cloneImage: ""
  # Global default step deadline in seconds (ADR-0047). Empty => server
  # default (3600). Per-step `timeout:` always overrides.
  stepTimeoutSecs: ""

  # --- declarative forge connections (ADR-0060 part D) --------------------
  # Config-owned connections: provisioned at boot, AUTHORITATIVE, and read-only
  # in the UI ("managed by configuration"). A connection has exactly one owner —
  # this block or the database — never both: declaring an id the database
  # already owns REFUSES the boot rather than letting config and the running
  # system drift apart. Undeclaring an entry releases ownership back to the UI;
  # it never deletes the connection (Projects hang off its repo bindings).
  #
  # Rendered verbatim into a mounted ConfigMap, so these keys are the SERVER's
  # schema (snake_case), not the chart's camelCase. An unknown key fails the
  # boot loudly (ADR-0048) instead of being silently ignored.
  #
  # Credential resolution is one path — env override, then Scarab's secret store:
  #   credential: { env: FORGEJO_CI_TOKEN }        # supply the var via
  #                                                # secrets.existingSecret or
  #                                                # scarab.extraEnv
  #   credential: { file: /etc/scarab/forgejo/tok } # a Secret you mount yourself
  #   credential: { secret_ref: forgejo-token }     # `_forge`-scoped handle in
  #                                                # Scarab's own secret store
  # An `env`/`file` credential that is missing or empty fails the boot; a
  # `secret_ref` that is not registered yet is reported DEGRADED (only the
  # running server can store it).
  #
  # Each `repos:` entry binds `owner/name` as a Project (ADR-0046) — the
  # declarative repo-onboarding path, and the only way Forgejo repos become
  # Projects without clicking through the UI.
  #
  # connections:
  #   - id: forgejo-main
  #     kind: forgejo                  # github | forgejo
  #     base_url: https://git.example.com
  #     credential:
  #       env: FORGEJO_CI_TOKEN
  #     repos:
  #       - acme/widgets
  connections: []

  # Object store (logs/artifacts). When bucket is set the S3/MinIO backend is
  # used; otherwise scarab falls back to a local directory (dev only).
  s3:
    bucket: ""
    endpoint: ""       # e.g. http://minio.scarab.svc:9000 ; empty => AWS S3
    region: "us-east-1"

  # OIDC issuer public URL for keyless federation (ADR-0014). Empty => disabled.
  # When set, SCARAB_OIDC_SIGNING_KEY_FILE must point at a persistent PKCS#8
  # RSA PEM (mount it via extraEnv + a volume, or bake it into existingSecret) —
  # the server refuses to boot without one (ADR-0048).
  oidcIssuer: ""

  # ⚠ Dev-only (ADR-0048): boots without an authenticator/KEK, with loud
  # warnings, instead of refusing. NEVER set in production. Until authn
  # (ADR-0049) ships, a deploy only boots with this on — an honest red line.
  devInsecure: false

  # Results-egress sidecar image injected into step Pods (ADR-0042). Only used
  # when secrets.resultsTokenSecret is set.
  sidecarImage: "ghcr.io/thulasi-ram/scarab-results-sidecar:edge"
  # Base URL step-Pod sidecars POST results back to. Empty => the in-cluster
  # Service DNS name derived from the release.
  resultsApiUrl: ""

# Sensitive config. Two modes:
#   1. existingSecret: reference a Secret you manage out-of-band (recommended
#      for production). Keys must match the env var names below.
#   2. Inline values here => the chart renders a Secret. Fine for dev; do NOT
#      commit real values.
secrets:
  existingSecret: ""
  # --- inline (rendered into a chart-managed Secret when existingSecret is "") ---
  # Postgres URL. MANDATORY (ADR-0048): scarab-server refuses to boot without it.
  databaseUrl: ""
  # S3/MinIO credentials (needed when scarab.s3.bucket is set).
  s3AccessKey: ""
  s3SecretKey: ""
  # base64 32-byte key so encrypted secrets survive restarts (ADR-0014).
  # MANDATORY unless scarab.devInsecure is on (ADR-0048).
  masterKey: ""
  # HMAC secrets for webhook verification / gate + results token minting.
  # Each forge binds its own secret (ADR-0046): githubWebhookSecret renders
  # SCARAB_GITHUB_WEBHOOK_SECRET (/webhooks/github) and forgejoWebhookSecret
  # renders SCARAB_FORGEJO_WEBHOOK_SECRET (/webhooks/forgejo). Set only the ones
  # whose adapter you actually deliver to.
  githubWebhookSecret: ""
  forgejoWebhookSecret: ""
  gateTokenSecret: ""
  resultsTokenSecret: ""
  # GitHub App private-key PEM (enh 245a99c): supplies the App credential at
  # boot, GitOps-style — no PUT /v1/secrets reseed, and it survives DB recreate.
  # Overrides any DB-stored `_forge` credential. For existingSecret mode, add a
  # SCARAB_GITHUB_APP_PEM key to your Secret instead (both arrive via envFrom).
  # NB: connection/installation registration is separate state — still seeded
  # via reseed.sh's synthetic webhook or a real GitHub delivery.
  githubAppPem: ""
  # The same credential mounted as a FILE — the GitOps-native shape, since the
  # PEM stays in a Secret you manage out-of-band (external-secrets /
  # sealed-secrets / SOPS) and no key material passes through Helm values at
  # all. The chart projects `key` from `name` read-only and points
  # SCARAB_GITHUB_APP_PEM_FILE at it. Independent of existingSecret (that is
  # envFrom; this is a volume), and an inline githubAppPem wins if both are set.
  # An unreadable path is a boot failure (ADR-0048), not a silent downgrade.
  githubAppPemSecret:
    name: ""                # Secret to mount; empty => no mount, no env var
    key: github-app.pem     # key within that Secret holding the PEM

# RBAC the k8s executor needs to run one Pod per step in scarab.namespace.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. IRSA / Workload Identity role bindings

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: scarab.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# /healthz is a cheap static handler (crates/scarab-server/src/lib.rs).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    # Readiness = can this replica serve (DB + store reachable, ADR-0053) —
    # distinct from liveness (/healthz = process up).
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# Container hardening: scarab-server runs as an unprivileged user and needs no
# write access to its root filesystem (object dir is under the writable home).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus scraping (ADR-0053): render a ServiceMonitor when the Prometheus
# Operator CRDs are installed.
serviceMonitor:
  enabled: false
  interval: 30s
