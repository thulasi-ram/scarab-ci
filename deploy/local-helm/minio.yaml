# Dev-only in-cluster MinIO for the local Helm dogfood (NOT for production — use
# a managed S3 there). It backs the object store (CAS: logs, artifacts, and the
# per-step workspace snapshots reruns restore). One replica, a PVC via k3s
# local-path so the durable state survives pod restarts — WITHOUT this the CAS
# would live on the server's `scratch` emptyDir and every server restart would
# wipe all workspaces, hanging any rerun of a prior run. Wipe a clean slate by
# deleting the PVC (see deploy/local-helm/README.md).
#
# `pgsty/minio` + `pgsty/mc` (multi-arch, run on arm64) — we deliberately avoid
# the Bitnami images, matching the Postgres setup.
# MinIO upstream is ARCHIVED (minio/minio, read-only since 2026-04) and its
# images are GONE from Docker Hub (`pull access denied`), which turned every CI
# run red. pgsty/minio is the maintained AGPL community fork: same binary, same
# env vars, same `server /data`, same entrypoint. Pinned by digest — bump the
# tag AND the digest together, never to a floating tag again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scarab-minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarab-minio
  labels: { app: scarab-minio }
spec:
  replicas: 1
  strategy: { type: Recreate }        # single RWO volume — never two pods at once
  selector:
    matchLabels: { app: scarab-minio }
  template:
    metadata:
      labels: { app: scarab-minio }
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # multi-arch (runs on arm64)
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: scarab }
            - { name: MINIO_ROOT_PASSWORD, value: scarabsecret }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scarab-minio
---
apiVersion: v1
kind: Service
metadata:
  name: scarab-minio
  labels: { app: scarab-minio }
spec:
  selector: { app: scarab-minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# One-shot: create the logs/artifacts bucket, then exit (mirrors the proc-mode
# compose `createbuckets`). Self-waits for MinIO via the `mc alias set` retry
# loop, so apply order doesn't matter. Idempotent (`--ignore-existing`); the
# bucket persists in the PVC, so a completed Job need not re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: scarab-minio-mkbucket
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: scarab-minio }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://scarab-minio:9000 scarab scarabsecret; do sleep 1; done
              mc mb --ignore-existing local/scarab-logs
              # Incomplete-multipart hygiene (git-bug ad79c90): nothing to
              # configure HERE — MinIO expires stale multipart uploads
              # natively (api: stale_uploads_expiry=24h, swept every
              # stale_uploads_cleanup_interval=6h; verified against these
              # images 2026-08-25), and mc ships NO
              # abort-incomplete-multipart ILM flag ('mc ilm rule add --help'
              # lists none). On real S3 the equivalent is a REQUIRED bucket
              # lifecycle rule — see the scarab.s3 comment in
              # deploy/helm/scarab/values.yaml.
              echo 'bucket scarab-logs ready'
