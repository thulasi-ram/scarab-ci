# Dev-only in-cluster Postgres for the kind dev stack (`just stack up`, `just
# stack up dogfood`). Not for production: use a managed Postgres there. One replica on a
# PVC (kind's local-path provisioner), so the data survives Pod restarts and
# `just stack down keep`; `just stack down` deletes the cluster and the data with it.
#
# Each mode has its own database on this one server: `scarab` for `just stack up`,
# `scarab_dogfood` for `just stack up dogfood`, `scarab_e2e` for `just test e2e`,
# `scarab_chaos` for `just test chaos` (reached through toxiproxy).
# deploy/kind/up.sh creates the database a mode needs (ADR-0077 Amendment: a
# mode is a set of values, isolated by database URL and bucket).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scarab-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarab-postgres
  labels: { app: scarab-postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }        # single RWO volume — never two pods at once
  selector:
    matchLabels: { app: scarab-postgres }
  template:
    metadata:
      labels: { app: scarab-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine   # official image is multi-arch (runs on arm64)
          # On from the start: `just test chaos` (ADR-0077) checks commit order on
          # its own database on this server, and the setting needs a restart,
          # which would also hit dev's data.
          args: ["-c", "track_commit_timestamp=on"]
          env:
            - { name: POSTGRES_USER, value: scarab }
            - { name: POSTGRES_PASSWORD, value: scarab }
            - { name: POSTGRES_DB, value: scarab }
            # Subdir so the volume's lost+found doesn't collide with initdb.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          # Requests near measured use (~70 MiB idle, 2026-11-01): the whole
          # stack shares a 4 GiB colima VM.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "scarab", "-d", "scarab"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scarab-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: scarab-postgres
  labels: { app: scarab-postgres }
spec:
  selector: { app: scarab-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
