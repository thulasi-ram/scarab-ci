# Scarab dev stack: the two stateful dependencies (Postgres + object store).
# Postgres is published on 55432 to avoid clashing with a host Postgres on 5432.
name: scarab-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scarab
      POSTGRES_PASSWORD: scarab
      POSTGRES_DB: scarab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarab -d scarab"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scarab
      MINIO_ROOT_PASSWORD: scarabsecret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  # One-shot: create the logs/artifacts bucket, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 scarab scarabsecret; do sleep 1; done;
      mc mb --ignore-existing local/scarab-logs;
      echo 'bucket scarab-logs ready';
      "

volumes:
  minio-data:
