# Scarab dev stack: the two stateful dependencies (Postgres + object store).
# Postgres is published on 55432 to avoid clashing with a host Postgres on 5432.
name: scarab-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scarab
      POSTGRES_PASSWORD: scarab
      POSTGRES_DB: scarab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarab -d scarab"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO upstream is ARCHIVED (minio/minio, read-only since 2026-04) and its
  # images are GONE from Docker Hub (`pull access denied`), which turned every CI
  # run red. pgsty/minio is the maintained AGPL community fork: same binary, same
  # env vars, same `server /data`, same entrypoint. Pinned by digest — bump the
  # tag AND the digest together, never to a floating tag again.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scarab
      MINIO_ROOT_PASSWORD: scarabsecret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  # One-shot: create the logs/artifacts bucket, then exit.
  createbuckets:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 scarab scarabsecret; do sleep 1; done;
      mc mb --ignore-existing local/scarab-logs;
      mc mb --ignore-existing local/scarab-test;
      echo 'buckets scarab-logs (dev stack) and scarab-test (test suite) ready';
      "

volumes:
  minio-data:
