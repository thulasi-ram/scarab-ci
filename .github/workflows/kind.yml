# kind-in-CI tier (test-strategy Phase 2): run `just kube-tests`, the live
# cluster suites of the executor (`crates/scarab-executor-k8s/tests/cluster.rs`)
# and the plugin runtime (`crates/scarab-plugin-k8s/tests/cluster.rs`), on
# every PR/push that touches the execution path. The recipe is the same one a
# developer runs (ADR-0077 Amendment, 2026-11-01): `deploy/kind/up.sh e2e`
# creates the kind cluster `scarab-dev`, runs Postgres and MinIO in it, builds
# the step images from the tree and installs the chart with the server and the
# Depot running a binary built here. Everything the old workflow set up by hand
# (a Postgres service, MinIO, a registry, a workspace service host process,
# image pulls and loads, the host IP a Pod reaches) the recipe now does.
#
# REQUIRED (promoted off probation 2026-07-25, git-bug a0b42ad). Enforcement
# lives in `.github/required-checks.txt` + `just pr-gate <n>`, because branch
# protection and rulesets are both 403 on this repo (private, free plan).
# Listed there as `required-if-run` (`kind/cluster-tests`): the path filter
# below means a clean absence on an unrelated PR is correct, not a missing
# gate. Keep the job id `cluster-tests`.
#
# Every SCARAB_TEST_* the suites read is MANDATORY once SCARAB_TEST_KUBE is
# set: tests/cluster.rs panics on an absent one instead of skipping, so a
# recipe that stops setting one turns this job red, not silently green.
name: kind

on:
  push:
    branches: [main]
    paths:
      - 'crates/scarab-executor-k8s/**'
      - 'crates/scarab-k8s-expansion/**'
      - 'crates/scarab-engine/**'
      - 'crates/scarab-server/**'
      - 'crates/scarab-storage*/**'
      # The workspace client is the fetcher's source AND the `Cas` the live
      # workspace cases point the executor at (ADR-0061 s3-feed).
      - 'crates/scarab-workspace-client/**'
      - 'crates/scarab-plugin-k8s/**'
      - 'docker/**'
      # The recipe and everything it reads: the kind stack, the chart, the
      # clone library manifest it writes.
      - 'Justfile'
      - 'deploy/kind/**'
      - 'deploy/helm/scarab/**'
      - 'libs/clone.yaml'
      - 'scripts/libs_manifest.py'
      - '.github/actions/kind-tools/**'
      - '.github/workflows/kind.yml'
  # `labeled` / `unlabeled`: the ci:skip label skips the job, and removing it
  # starts a run (see ci.yml's trigger note). ci:full changes nothing here:
  # the `paths:` filter below decides whether this workflow starts at all.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'crates/scarab-executor-k8s/**'
      - 'crates/scarab-k8s-expansion/**'
      - 'crates/scarab-engine/**'
      - 'crates/scarab-server/**'
      - 'crates/scarab-storage*/**'
      # The workspace client is the fetcher's source AND the `Cas` the live
      # workspace cases point the executor at (ADR-0061 s3-feed).
      - 'crates/scarab-workspace-client/**'
      - 'crates/scarab-plugin-k8s/**'
      - 'docker/**'
      # The recipe and everything it reads: the kind stack, the chart, the
      # clone library manifest it writes.
      - 'Justfile'
      - 'deploy/kind/**'
      - 'deploy/helm/scarab/**'
      - 'libs/clone.yaml'
      - 'scripts/libs_manifest.py'
      - '.github/actions/kind-tools/**'
      - '.github/workflows/kind.yml'

# A run started by a change to any label but ci:skip gets a group of its own,
# so it cannot cancel a real run in flight.
concurrency:
  group: kind-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:skip' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # This repo's debug builds exhaust runner disk with full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: 0
  # No test reads the web UI; building it would cost npm ci + a vite build.
  SCARAB_KIND_SKIP_UI: 1

jobs:
  cluster-tests:
    # Skipped, with no runner started, under the ci:skip label and on a change
    # to any other label. Pushes to main never skip.
    if: >-
      github.event_name != 'pull_request' || (
        !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !(
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'ci:skip'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A workspace debug build + kind + images needed more than older runners'
      # ~14GB free, so this dropped the unused toolchains up front.
      # ONLY WHEN SHORT. The cleanup is slow (deleting ~30 GB of small files: 1.5-4
      # billed minutes a run), and today's runner images are 145 GB disks (113 GB
      # free AFTER this cleanup, measured 2026-10). Below 40 GB free it still runs
      # in full — the ENOSPC history is real; the step logs the before figure.
      - name: Free runner disk (only if short)
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free before: ${avail}G"
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
          df -h /

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just,cargo-zigbuild@0.24.0

      # The kind toolchain the recipe expects. See .github/actions/kind-tools.
      - uses: ./.github/actions/kind-tools

      # The recipe: cluster, Postgres, MinIO, images, the release in e2e mode,
      # an in-cluster registry, port-forwards, the Pod-reachable host address,
      # then both live suites with --run-ignored all --no-fail-fast.
      - name: just kube-tests
        env:
          # A SHA this event guarantees exists on the forge: the PR head, or
          # the pushed main commit (the clone tests fetch it). The recipe's
          # default, origin/main, is not in a shallow checkout.
          SCARAB_TEST_CLONE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The clone tests fetch THIS repo, which may be private: hand them
          # the ambient read-only token (delivered via tmpfs + GIT_ASKPASS).
          SCARAB_TEST_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just kube-tests

      - name: Cluster diagnostics (on failure)
        if: failure()
        run: |
          k=deploy/kind/kubectl.sh
          bash $k get pods -A -o wide || true
          bash $k get events -A --sort-by=.lastTimestamp | tail -50 || true
          bash $k describe pods -n scarab-kube-tests | tail -200 || true
          echo "---- server log ----"
          bash $k logs -n scarab deploy/scarab --tail 200 || true
          # A 401 from a Step, or a warm-tier warning, lands in the Depot's
          # log and nowhere else: it is a second process.
          echo "---- Depot log ----"
          bash $k logs -n scarab statefulset/scarab-workspace --tail 200 || true
