# Build (and publish) Scarab's first-party container images, multi-arch:
#   - scarab-server           (the converged API/worker binary, docker/server/Dockerfile)
#   - scarab-clone            (the canonical clone step image, ADR-0045)
#   - scarab-results-sidecar  (the trusted results-egress sidecar, ADR-0042)
#   - scarab-wsfetch          (the workspace fetcher init container, ADR-0061 s3-feed)
#
# ⚠ scarab-wsfetch is a temporally-ordered STEPPING STONE (ADR-0061 D2.3): it is
# eager, and the CSI/FUSE node driver replaces it. git-bug 0628369 closes only
# when it is REMOVED from this matrix again.
#
# Multi-arch via NATIVE runners (fast — no QEMU): each image is built once per
# platform on a runner of that architecture, pushed BY DIGEST, then a `merge`
# job stitches the per-arch digests into one multi-arch manifest list per tag.
# This lets an arm64 host (e.g. Apple-silicon colima) pull the same tag CI
# publishes for amd64.
#
# - PRs: build only, both arches, no push (catch a broken Dockerfile).
# - push to main: build + push, tagged `edge` and by commit SHA (`sha-<sha>`).
# - v* tags: build + push a release, tagged with the semver + `latest`.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'docker/server/Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'ui/**'
      - 'openapi.json'
      - 'docker/clone/**'
      - 'docker/sidecar/**'
      - 'docker/wsfetch/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-image, per-arch build on a native runner. On push/tags each build is
  # pushed by digest (no tag yet); PRs just validate the Dockerfile.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [scarab-server, scarab-clone, scarab-results-sidecar, scarab-wsfetch]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: scarab-server
            context: .
            dockerfile: docker/server/Dockerfile
          - image: scarab-clone
            context: docker/clone
            dockerfile: docker/clone/Dockerfile
          - image: scarab-results-sidecar
            context: docker/sidecar
            dockerfile: docker/sidecar/Dockerfile
          # Context is the repo ROOT: the fetcher is a bin target of
          # crates/scarab-workspace-client, deliberately, so it shares the one
          # `Cas::materialize` that carries the fidelity rules.
          - image: scarab-wsfetch
            context: .
            dockerfile: docker/wsfetch/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Only authenticate when we intend to push (never on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR => build-only (validate). push/tag => push by digest (tags come later).
      - name: Build ${{ matrix.image }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, github.repository_owner, matrix.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          # One artifact per (image, job) — job-index is unique across the matrix.
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch each image's per-arch digests into one multi-arch manifest list and
  # apply the human tags (edge / sha-<sha> / semver / latest).
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [scarab-server, scarab-clone, scarab-results-sidecar, scarab-wsfetch]
    steps:
      - name: Download this image's digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Record image reference
        run: |
          echo "**${{ matrix.image }}**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}\` (multi-arch)" >> "$GITHUB_STEP_SUMMARY"
