# Build (and publish) Scarab's first-party container images, multi-arch:
#   - scarab-server           (the converged API/worker binary, docker/server/Dockerfile)
#   - scarab-clone            (the canonical clone step image, ADR-0045)
#   - scarab-results-sidecar  (the trusted results-egress sidecar, ADR-0042)
#   - scarab-wsfetch          (the workspace fetcher init container, ADR-0061 s3-feed)
#
# ⚠ scarab-wsfetch is a temporally-ordered STEPPING STONE (ADR-0061 D2.3): it is
# eager, and the CSI/FUSE node driver replaces it. git-bug 0628369 closes only
# when it is REMOVED from this matrix again.
#
# Multi-arch via NATIVE runners (fast — no QEMU): each image is built once per
# platform on a runner of that architecture, pushed BY DIGEST, then a `merge`
# job stitches the per-arch digests into one multi-arch manifest list per tag.
# This lets an arm64 host (e.g. Apple-silicon colima) pull the same tag CI
# publishes for amd64.
#
# - PRs: build only, amd64 only, no push (catch a broken Dockerfile).
# - push to main: build + push, tagged `edge` and by commit SHA (`sha-<sha>`).
# - v* tags: build + push a release, tagged with the semver + `latest`.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  # NO workflow-level `paths:` on purpose. The `changes` job below filters
  # PER IMAGE from `.github/path-filters.yml`; an outer filter would be a SECOND
  # copy of the same union that has to be kept in step with the four inner ones
  # — and it was already out of step (it never listed `rust-toolchain.toml`,
  # which both cargo-built images read). A docs-only PR now runs one ~15s
  # `changes` job that selects `[]` and builds nothing.
  #
  # `labeled` / `unlabeled` (see ci.yml's trigger note): ci:skip skips every
  # job on the PR and removing it starts a run; ci:full builds all four images
  # and checks the chart whatever the path filters say.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# One build per ref; a newer push supersedes an in-flight one. A run started by
# a change to any other label gets a group of its own and cancels nothing.
concurrency:
  group: image-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:skip' && github.event.label.name != 'ci:full' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Which images does this push actually change? (git-bug 602940c)
  #
  # A stylesheet edit used to rebuild all four images × two arches — eight
  # check runs, six of them for images that contain no UI. Only `scarab-server`
  # embeds it (its Dockerfile has an npm stage that copies `dist/`); `clone` and
  # `results-sidecar` are self-contained shell images whose build context is
  # their own directory, and `wsfetch` is a cargo bin target.
  #
  # The per-image filters live in `.github/path-filters.yml` — the same file
  # `ci.yml` reads, so "did the UI change?" has one answer in this repo.
  #
  # ON A PUSH OR A TAG, ALL FOUR GET EVERY TAG. The `edge` / `sha-<sha>` /
  # semver tags are how `kind.yml`, `just local-helm sha-<sha>` and the chart
  # pin a build, and a tag that exists for some images and not others is a trap
  # you only discover in a deploy.
  #
  # But a push to main no longer REBUILDS all four (Actions minutes are
  # limited). When the previous main push published `sha-<before>` for all four
  # images, an image whose inputs did not change since then is RE-TAGGED from
  # `sha-<before>` (seconds, no build) and only the changed ones are built. If
  # any `sha-<before>` is missing — that run was cancelled by
  # `cancel-in-progress`, or failed — everything is built, so a skipped change
  # can never be papered over by a stale image. Tags and dispatches always
  # build all four.
  #
  # On a PR with the ci:skip label, or one started by another label's change,
  # this job skips with no runner started, and every job below skips with it.
  changes:
    if: >-
      github.event_name != 'pull_request' || (
        !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !(
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'ci:skip' && github.event.label.name != 'ci:full'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      images: ${{ steps.select.outputs.images }}
      # Unchanged images to re-tag from `retag_from` instead of building.
      retag: ${{ steps.select.outputs.retag }}
      retag_from: ${{ steps.select.outputs.retag_from }}
      chart: ${{ steps.filter.outputs.chart == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The main-push diff below compares against `github.event.before`.
          fetch-depth: 0

      # A release tag must name ONE version everywhere: the image tags
      # (`metadata-action` semver), the chart version, and the chart's
      # `appVersion` — which is the chart's default `image.tag`, so a chart
      # whose appVersion was never pushed installs an ImagePullBackOff. Checked
      # HERE, before `build`, so a mismatched tag fails before a single image is
      # pushed rather than leaving images-without-a-chart behind.
      - name: Check the release version is consistent
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          chart=$(sed -n 's/^version:[[:space:]]*//p' deploy/helm/scarab/Chart.yaml | tr -d '"')
          app=$(sed -n 's/^appVersion:[[:space:]]*//p' deploy/helm/scarab/Chart.yaml | tr -d '"')
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)
          echo "tag=$want chart=$chart appVersion=$app cargo=$cargo"
          bad=0
          for pair in "Chart.yaml version:$chart" "Chart.yaml appVersion:$app" "Cargo.toml workspace.package.version:$cargo"; do
            if [ "${pair##*:}" != "$want" ]; then
              echo "::error::$TAG wants $want but ${pair%:*} is '${pair##*:}' — bump it and re-tag"
              bad=1
            fi
          done
          exit "$bad"

      # Push to main only: did the previous push publish all four images? Only
      # then is "unchanged since `before`" a license to re-tag.
      - name: Is the previous main build complete?
        id: prev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ok=true
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable previous commit: building all"
            ok=false
          else
            echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin >/dev/null
            for img in scarab-server scarab-clone scarab-results-sidecar scarab-wsfetch; do
              if ! docker buildx imagetools inspect "$IMAGE_BASE/$img:sha-$BEFORE" >/dev/null 2>&1; then
                echo "$img:sha-$BEFORE was never published: building all"
                ok=false
              fi
            done
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || steps.prev.outputs.ok == 'true'
        with:
          filters: .github/path-filters.yml
          # Ignored on PRs (the action reads the PR's file list); on a main push
          # it is the commit the previous images were built from.
          base: ${{ github.event.before }}
      # Emits the JSON array the build matrix expands, and the complementary
      # re-tag set. Filtered selection on PRs and on a main push whose previous
      # build is complete; the full set (nothing re-tagged) otherwise.
      - name: Select the images to build
        id: select
        env:
          ALL: '["scarab-server","scarab-clone","scarab-results-sidecar","scarab-wsfetch"]'
          IS_PR: ${{ github.event_name == 'pull_request' }}
          # ci:full on a PR: build all four, as an unfiltered run would.
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          PREV_OK: ${{ steps.prev.outputs.ok == 'true' }}
          BEFORE: ${{ github.event.before }}
          SERVER: ${{ steps.filter.outputs.image_server }}
          CLONE: ${{ steps.filter.outputs.image_clone }}
          SIDECAR: ${{ steps.filter.outputs.image_results_sidecar }}
          WSFETCH: ${{ steps.filter.outputs.image_wsfetch }}
        run: |
          set -euo pipefail
          retag='[]'
          if { [ "$IS_PR" != "true" ] && [ "$PREV_OK" != "true" ]; } || [ "$FULL" = "true" ]; then
            images="$ALL"
          else
            images=$(jq -cn \
              --arg server "$SERVER" --arg clone "$CLONE" \
              --arg sidecar "$SIDECAR" --arg wsfetch "$WSFETCH" \
              '[ {"scarab-server":$server, "scarab-clone":$clone,
                  "scarab-results-sidecar":$sidecar, "scarab-wsfetch":$wsfetch}
                 | to_entries[] | select(.value == "true") | .key ]')
            if [ "$IS_PR" != "true" ]; then
              retag=$(jq -cn --argjson all "$ALL" --argjson built "$images" '$all - $built')
            fi
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "retag=$retag" >> "$GITHUB_OUTPUT"
          echo "retag_from=sha-$BEFORE" >> "$GITHUB_OUTPUT"
          echo "building: $images" >> "$GITHUB_STEP_SUMMARY"
          echo "re-tagging from sha-$BEFORE: $retag" >> "$GITHUB_STEP_SUMMARY"

  # Per-image, per-arch build on a native runner. On push/tags each build is
  # pushed by digest (no tag yet); PRs just validate the Dockerfile.
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    # Runner follows the platform. An expression, not `include:` — on a PR the
    # arm64 platform is absent, and an `include` naming it would append a new,
    # image-less combination (the same trap described at `matrix:` below).
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Only the images this push can have changed (see `changes`). A plain
        # string list on purpose: it keeps the check names readable
        # (`build (scarab-server, linux/amd64)`), and the context/dockerfile
        # mapping cannot ride along in `include:` — an `include` entry whose
        # `image` is not in the matrix does not filter itself out, it appends a
        # NEW combination with no `platform` and no `runner`. Hence the `case`
        # step below.
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        # PRs build amd64 ONLY (Actions minutes are limited): a PR build exists to
        # catch a broken Dockerfile, and amd64 does that. arm64 still builds on
        # every push to main and every tag — which is what publishes the arm64
        # manifest the Ampere demo (deploy/demo-oracle) and Apple-silicon colima
        # pull — so an arm-only break surfaces on the merge, not in a deploy.
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["linux/amd64"]' || '["linux/amd64","linux/arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      # The one mapping from image name to build context. `scarab-clone` and
      # `scarab-results-sidecar` are self-contained (their context IS their
      # directory); the other two build from the repo root because they are
      # cargo targets — the fetcher deliberately so, to share the one
      # `Cas::materialize` that carries the fidelity rules.
      - name: Resolve the build context
        id: target
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            scarab-server)          ctx=.                ; df=docker/server/Dockerfile   ;;
            scarab-clone)           ctx=docker/clone     ; df=docker/clone/Dockerfile    ;;
            scarab-results-sidecar) ctx=docker/sidecar   ; df=docker/sidecar/Dockerfile  ;;
            scarab-wsfetch)         ctx=.                ; df=docker/wsfetch/Dockerfile  ;;
            *)
              echo "::error::unmapped image '$IMAGE' — add it to this case AND to .github/path-filters.yml"
              exit 1
              ;;
          esac
          echo "context=$ctx" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$df" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Only authenticate when we intend to push (never on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR => build-only (validate). push/tag => push by digest (tags come later).
      - name: Build ${{ matrix.image }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, github.repository_owner, matrix.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          # PRs READ main's layer cache but never write their own: the repo has
          # 10 GB of Actions cache, and per-PR copies of the cooked-dependency
          # layers (docker/server/Dockerfile) would evict main's.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1}', matrix.image, matrix.platform) || '' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          # One artifact per (image, job) — job-index is unique across the matrix.
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch each built image's per-arch digests into one multi-arch manifest list
  # and apply the human tags (edge / sha-<sha> / semver / latest); point the same
  # tags at `sha-<before>` for the images `changes` chose to re-tag. ONE job, not
  # one per image: each of those ran ~20s and billed a whole minute.
  merge:
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the built digests
        if: needs.changes.outputs.images != '[]'
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@v4

      # One metadata run for every image: `img` is a placeholder stripped below,
      # so each image gets exactly the tag set metadata-action computes.
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: img
          tags: |
            type=sha,format=long
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push the manifest lists
        env:
          BUILT: ${{ needs.changes.outputs.images }}
          RETAG: ${{ needs.changes.outputs.retag }}
          RETAG_FROM: ${{ needs.changes.outputs.retag_from }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[] | sub("^img:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args() { for t in "${tags[@]}"; do printf -- '-t\n%s\n' "$IMAGE_BASE/$1:$t"; done; }
          for img in $(jq -r '.[]' <<< "$BUILT"); do
            mapfile -t args < <(tag_args "$img")
            mapfile -t sources < <(for f in /tmp/digests/digests-"$img"-[0-9]*/*; do
              echo "$IMAGE_BASE/$img@sha256:$(basename "$f")"; done)
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            echo "**$img**: \`$IMAGE_BASE/$img:$VERSION\` (built, multi-arch)" >> "$GITHUB_STEP_SUMMARY"
          done
          for img in $(jq -r '.[]' <<< "$RETAG"); do
            mapfile -t args < <(tag_args "$img")
            docker buildx imagetools create "${args[@]}" "$IMAGE_BASE/$img:$RETAG_FROM"
            echo "**$img**: \`$IMAGE_BASE/$img:$VERSION\` (unchanged, re-tagged from $RETAG_FROM)" >> "$GITHUB_STEP_SUMMARY"
          done

  # The Helm chart. On a PR that touches it: lint + render, no push. On a `v*`
  # tag: the same, then package + push to oci://ghcr.io/<owner>/charts/scarab.
  #
  # `needs: merge` on purpose — on a tag the chart is published only AFTER every
  # image's multi-arch manifest exists, because the chart's default `image.tag`
  # is its appVersion (= the tag, enforced in `changes`). A chart that can be
  # pulled before its image can is a chart that installs an ImagePullBackOff.
  # On a PR `merge` is skipped, hence the `always()` + explicit result checks.
  chart:
    needs: [changes, merge]
    if: >-
      always() && needs.changes.result == 'success' && (
        (github.event_name == 'pull_request' && needs.changes.outputs.chart == 'true') ||
        (startsWith(github.ref, 'refs/tags/v') && needs.merge.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CHART_DIR: deploy/helm/scarab
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # Defaults alone render almost nothing (no workspace token => no
      # StatefulSet, empty blocks => no ConfigMaps), so render once more with
      # every optional block switched on: that is where a template typo hides.
      - name: Lint + render
        run: |
          set -euo pipefail
          helm lint "$CHART_DIR"
          helm template t "$CHART_DIR" > /dev/null
          helm template t "$CHART_DIR" \
            --set secrets.workspaceTokenSecret=x \
            --set-json 'scarab.connections=[{"id":"c","kind":"forgejo","base_url":"https://git.example.com","credential":{"env":"T"}}]' \
            --set-json 'scarab.placement={"baseline":{"spec":{"tolerations":[{"key":"k","operator":"Exists"}]}},"profiles":[{"name":"big","k8s":{"spec":{"nodeSelector":{"pool":"big"}}}}]}' \
            > /dev/null
          # Regression: under existingSecret the results token is invisible to
          # the chart, and the sidecar image + results URL used to vanish with
          # it — the server then pulled the floating :edge sidecar and posted
          # results to http://scarab-server. They must render regardless.
          out=$(helm template t "$CHART_DIR" -n ci \
            --set secrets.existingSecret=mine \
            --set scarab.sidecarImage=ghcr.io/x/sidecar:pinned)
          grep -q 'SCARAB_SIDECAR_IMAGE: "ghcr.io/x/sidecar:pinned"' <<<"$out"
          grep -q 'SCARAB_RESULTS_API_URL: "http://t-scarab.ci.svc"' <<<"$out"

      - name: StatefulSet upgrades apply in place
        run: scripts/chart_statefulset_immutable.sh "$CHART_DIR"

      - name: Package + push to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          helm package "$CHART_DIR" -d /tmp/chart
          pkg=$(ls /tmp/chart/scarab-*.tgz)
          helm push "$pkg" "oci://$REGISTRY/${OWNER,,}/charts"
          echo "**chart**: \`oci://$REGISTRY/${OWNER,,}/charts/scarab\` version \`${GITHUB_REF_NAME#v}\`" >> "$GITHUB_STEP_SUMMARY"
