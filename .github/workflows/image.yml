# Build (and publish) Scarab's first-party container images:
#   - scarab-server  (the converged API/worker binary, ./Dockerfile)
#   - scarab-clone   (the canonical clone step image, ADR-0045,
#                     ./deploy/clone/Dockerfile)
#
# - PRs: build only, to catch a broken Dockerfile before merge (no push).
# - push to main: build + push, tagged `edge` and by commit SHA.
# - v* tags: build + push a release, tagged with the semver + `latest`.
# Digest pinning: every push step exports the image digest into the job
# summary so a deploy can pin `image@sha256:…` (ADR-0018/0045).
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'deploy/clone/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scarab-server
            context: .
            dockerfile: Dockerfile
          - image: scarab-clone
            context: deploy/clone
            dockerfile: deploy/clone/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (never on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The digest is the deployable identity (pin `image@sha256:…`).
      - name: Record image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "**${{ matrix.image }}**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
