# Build (and publish) the scarab-server container image.
#
# - PRs: build only, to catch a broken Dockerfile before merge (no push).
# - push to main: build + push, tagged `edge` and by commit SHA.
# - v* tags: build + push a release, tagged with the semver + `latest`.
# The README calls out this image + the Rust CI job as in-progress edges.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/thulasi-ram/scarab-server — namespaced to the repo owner so the
  # (future) sidecar image can sit alongside it.
  IMAGE_NAME: ${{ github.repository_owner }}/scarab-server

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (never on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
