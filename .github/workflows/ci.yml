# Contract gates (ADR-0054): the committed OpenAPI spec and the generated UI
# client must always match the code. A drifted spec fails the build — never a
# silently stale contract.
name: ci

on:
  push:
    branches: [main]
  # `labeled` / `unlabeled` are for the two CI labels (git-bug ba1cab5):
  #   ci:skip  every job below skips, with no runner started. Removing the label
  #            starts a run. `just pr-gate` refuses a PR that has it.
  #   ci:full  the path filters are ignored and every job runs.
  # ci:skip wins when both are set. A change to any other label also starts a
  # run (GitHub cannot filter triggers by label name); in that run every job
  # skips, and the concurrency group below keeps it from cancelling a real run.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A newer run on the same ref cancels the one in flight, so adding ci:skip also
# stops a run already in progress. A run started by another label's change gets
# a group of its own and cancels nothing.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:skip' && github.event.label.name != 'ci:full' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # What did this push actually touch? (git-bug 6729fc2)
  #
  # Every job below is gated on this one. A PR that changed only `ui/**` and a
  # shell script used to cost 26.9 runner-minutes across 15 jobs — 18 of those
  # minutes being the Rust suite, run twice, over code it could not have
  # affected. See docs/handoffs/ci-does-too-much-per-push.md for the
  # measurement.
  #
  # The filter definitions live in `.github/path-filters.yml` — ONE copy, shared
  # with `image.yml`. Read that file's header before touching a filter.
  #
  # WHY A JOB AND NOT WORKFLOW-LEVEL `paths:`: a workflow-level filter is
  # all-or-nothing, and this workflow's jobs have three different input sets
  # (cargo / npm / both). A `changes` job gives each job its own answer.
  #
  # ON A PUSH TO MAIN, NOTHING IS FILTERED. Trunk is what every build and every
  # `sha-` image derives from, so it is validated in full; the savings are taken
  # on PR pushes, which is where the minutes actually were. That is the single
  # `github.event_name != 'pull_request'` below — stated once, so each downstream
  # job reads as a plain `== 'true'`.
  #
  # ONE EXCEPTION: a tree that was already validated. When a PR run passes its
  # gates, `record-validated-tree` (bottom of this file) uploads an artifact
  # named after the exact git TREE it tested (the PR's merge ref). If the push to
  # main produced a byte-identical tree — main did not move between that PR run
  # and the merge, the common case — re-running the same jobs over the same bytes
  # buys nothing (Actions minutes are limited), so they skip. A tree that differs
  # by one byte gets the full run, exactly as before.
  #
  # This job is `required` in `.github/required-checks.txt` because it runs on
  # every PR push: it is the anchor that stops a PR whose every other check is
  # correctly skipped from passing the gate having validated nothing.
  #
  # The ci:skip label skips THIS job (a job-level `if:` is evaluated without a
  # runner), and every job below skips with it. So under ci:skip the anchor
  # itself reports skipped, and `just pr-gate` fails the PR until the label is
  # removed and a run passes. A run started by another label's change skips the
  # same way; the gate ignores a skipped run when the commit has a real one.
  changes:
    if: >-
      github.event_name != 'pull_request' || (
        !contains(github.event.pull_request.labels.*.name, 'ci:skip') && !(
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'ci:skip' && github.event.label.name != 'ci:full'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read # the validated-tree artifact lookup
    # One output per GATED JOB, named after it — not one per filter. The filter
    # file also defines `cargo` / `rust` / `ui_src`, which exist only as shared
    # anchors the others build on; emitting an output nothing reads is how a
    # dead gate goes unnoticed. The ci:full label turns every output on.
    outputs:
      test_and_coverage: ${{ (github.event_name != 'pull_request' && steps.validated.outputs.hit != 'true') || contains(github.event.pull_request.labels.*.name, 'ci:full') || steps.filter.outputs.test_and_coverage == 'true' }}
      ui: ${{ (github.event_name != 'pull_request' && steps.validated.outputs.hit != 'true') || contains(github.event.pull_request.labels.*.name, 'ci:full') || steps.filter.outputs.ui == 'true' }}
      contracts: ${{ (github.event_name != 'pull_request' && steps.validated.outputs.hit != 'true') || contains(github.event.pull_request.labels.*.name, 'ci:full') || steps.filter.outputs.contracts == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # Non-PR only: has a passing PR run already validated this exact tree?
      - name: Was this exact tree already validated?
        id: validated
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          n=$(gh api "repos/$REPO/actions/artifacts?name=ci-validated-$tree" \
                -q '[.artifacts[] | select(.expired == false)] | length')
          echo "tree $tree: validated by $n passing PR run(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Never skip a push that moves the rust-cache key (lockfile, manifests,
          # toolchain): PRs cannot read each other's caches, only main's, so a
          # skipped main run there would leave every later PR compiling cold.
          key_moved=false
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Captured first: under pipefail, `gh … | grep -q` can report a MATCH
            # as failure (grep exits early, gh dies of SIGPIPE) — the unsafe way.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$GITHUB_SHA" -q '.files[].filename')
            if grep -qxE 'Cargo\.lock|rust-toolchain\.toml|(.*/)?Cargo\.toml' <<< "$files"; then
              key_moved=true
            fi
          else
            key_moved=true
          fi
          echo "rust-cache key moved since $BEFORE: $key_moved" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ] && [ "$key_moved" = false ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; fi
      # PRs only: the action reads the PR's file list from the API, so it needs
      # no history. On a push we do not filter at all (see above), so there is
      # nothing here to compute against `github.event.before` — which is also
      # what keeps this correct on a force-push or a multi-commit merge.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

  # THE Rust gate (test-strategy Phase 0), and the only one: the whole workspace
  # suite runs ONCE, under cargo-llvm-cov, against a real Postgres and a real
  # MinIO (ADR-0017 — PG is a real collaborator, not a mock; ADR-0067 part 1 —
  # the object store is a hard requirement, so its wire semantics get a real
  # server). The SCARAB_TEST_REQUIRE_* flags turn the harnesses'
  # skip-without-service into a panic, so this can never go green while quietly
  # skipping a whole tier. Then the per-crate summary, and a fail if any crate
  # drops >0.5pp below docs/audits/coverage-baseline.toml.
  #
  # ONE JOB, NOT TWO (git-bug b69c286). There used to be a separate `test` job
  # running `cargo nextest run --workspace` — the same 1,056 tests, minus the
  # instrumentation — so every Rust push stood up two Postgres services and two
  # MinIO containers and ran the suite twice for one verdict. `cargo llvm-cov
  # nextest` exits non-zero when a test fails, so this job reports a strict
  # superset of what `test` did: no signal was lost, ~9 runner-minutes per Rust
  # push were.
  #
  # The case for keeping `test` was insurance — a cargo-llvm-cov or
  # llvm-tools-preview breakage would at least leave a test signal. It was not
  # insurance: `ci/coverage` was ALREADY required, so such a breakage already
  # blocked every merge whether or not `test` sat beside it green. The suite was
  # being paid for twice to buy a hedge that did not exist.
  #
  # Do NOT add `--ignore-run-fail` to the run step below. It makes llvm-cov
  # write its report and exit 0 on a red suite — measured, not assumed — which
  # is precisely how this job would start going green with failing tests.
  test-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.test_and_coverage == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scarab
          POSTGRES_PASSWORD: scarab
          POSTGRES_DB: scarab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U scarab -d scarab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SCARAB_TEST_DATABASE_URL: postgres://scarab:scarab@127.0.0.1:55432/scarab
      SCARAB_TEST_REQUIRE_PG: "1"
      # The live-S3 tier (ADR-0067 part 1: the object store is a hard
      # requirement, so its wire semantics get a real server in CI). REQUIRE
      # turns the skip-without-env into a panic — same deal as PG above.
      SCARAB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SCARAB_TEST_S3_BUCKET: scarab-test
      SCARAB_TEST_S3_ACCESS_KEY: scarab
      SCARAB_TEST_S3_SECRET_KEY: scarabsecret
      SCARAB_TEST_REQUIRE_S3: "1"
      # Coverage mapping comes from -C instrument-coverage, not DWARF, so
      # debuginfo is pure disk cost — and without this the workspace build
      # exhausts the runner's disk (ENOSPC on first run).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # ONLY WHEN SHORT. The cleanup is slow (deleting ~30 GB of small files: 1.5-4
      # billed minutes a run), and today's runner images are 145 GB disks (113 GB
      # free AFTER this cleanup, measured 2026-10). Below 40 GB free it still runs
      # in full — the ENOSPC history is real; the step logs the before figure.
      - name: Free runner disk space (only if short)
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free before: ${avail}G"
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          df -h /
      - uses: actions/checkout@v4
      # MinIO is a plain step, not a `services:` container: GitHub's service
      # containers cannot pass a command, and MinIO needs `server /data`.
      # MinIO upstream is ARCHIVED (minio/minio, read-only since 2026-04) and its
      # images are GONE from Docker Hub (`pull access denied`), which turned every CI
      # run red. pgsty/minio is the maintained AGPL community fork: same binary, same
      # env vars, same `server /data`, same entrypoint. Pinned by digest — bump the
      # tag AND the digest together, never to a floating tag again.
      # Same image + credentials as the dev compose stack
      # (deploy/local-proc/compose.yaml), so local and CI disagree about
      # nothing. The runner's preinstalled aws CLI creates the bucket.
      - name: Start MinIO (live object-store tier)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=scarab -e MINIO_ROOT_PASSWORD=scarabsecret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          AWS_ACCESS_KEY_ID=scarab AWS_SECRET_ACCESS_KEY=scarabsecret \
            aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 \
            s3 mb s3://scarab-test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Run the suite — this is the test verdict AND the coverage run
        # scarab-testkit is test scaffolding and tests/ dirs are harness code —
        # neither is product code we want in the coverage signal.
        run: >-
          cargo llvm-cov nextest --workspace
          --ignore-filename-regex 'crates/scarab-testkit/|/tests/'
          --lcov --output-path lcov.info
      - name: Per-crate summary + ratchet against baseline
        # The script also appends its table to $GITHUB_STEP_SUMMARY itself.
        run: python3 scripts/coverage_ratchet.py lcov.info docs/audits/coverage-baseline.toml
      # `if: always()` because the ratchet step above is the one that FAILS.
      # Without it the lcov is uploaded only on green runs — i.e. never on the
      # run whose numbers you actually need to explain. That is how git-bug
      # b007837 had to be reconstructed by reading percentages out of job logs.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: lcov.info

  # UI no-DOM tier: the base of the UI pyramid — pure-function suites over the
  # derivations that carry the run-detail logic (event folding, Takes, attempt
  # grouping, log level parsing, DAG layout). No jsdom, no browser, no server:
  # seconds to run, so it sits in the required tier next to the Rust suite.
  #
  # THIS IS THE ONLY vitest job (git-bug 7fbf56d). There used to be a second,
  # `ui-unit`, byte-identical to this one down to the node version and the cache
  # path; the two comments claimed different test-strategy phases for what is
  # one `npm test`. `ui-tests` is the name in `required-checks.txt`, so the
  # duplicate — which was also the ungated one — is the one that went.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/scarab-web-ui/package-lock.json
      - name: Run the no-DOM suite
        working-directory: ui/scarab-web-ui
        run: |
          npm ci
          npm test

  # UI browser tier (test-strategy Phase 3): EXACTLY 2 Playwright specs against
  # mock mode — boot-breakage and the derivation→DOM wiring on run detail.
  #
  # ADVISORY PROBATION: `continue-on-error` on purpose. A browser tier carries
  # real flake surface (dev-server boot, timing); it reports for a while before
  # it is allowed to red a run. Promote by deleting the flag — same probation
  # deal as the `kind` job (git-bug a0b42ad).
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/scarab-web-ui/package-lock.json
      - name: Install deps + Chromium
        working-directory: ui/scarab-web-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser specs
        working-directory: ui/scarab-web-ui
        run: npm run test:e2e

  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full-route coverage is asserted by the test suite
      # (step_up_routes.rs::route_table_equals_the_openapi_spec); this job gates DRIFT:
      # the committed openapi.json must equal the generated one.
      - name: Regenerate the spec
        run: cargo run -p scarab-server -- --emit-openapi openapi.json
      - name: Fail on spec drift
        run: |
          git diff --exit-code openapi.json || {
            echo '::error::openapi.json is stale — run: cargo run -p scarab-server -- --emit-openapi openapi.json'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the UI client
        working-directory: ui/scarab-web-ui
        run: |
          npm ci
          npm run gen
          npm run typecheck
      - name: Fail on client drift
        run: |
          git diff --exit-code ui/scarab-web-ui/src/api/schema.ts || {
            echo '::error::the generated TS client is stale — run: npm run gen in ui/scarab-web-ui'
            exit 1
          }

  # The other half of the validated-tree skip (see `changes`): a PR run whose
  # gates all passed — or were correctly skipped by the path filter — records
  # the exact tree it tested. Expires in 7 days; a merge older than that just
  # gets the full run. `ui-e2e` is advisory and not waited on, as in the gate.
  #
  # `changes` must have SUCCEEDED: under ci:skip (or a run started by another
  # label's change) every need is `skipped`, which is neither a failure nor a
  # cancel, and a tree nothing tested must never be recorded as validated.
  record-validated-tree:
    needs: [changes, test-and-coverage, ui-tests, openapi-drift]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Name the tested tree
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "${{ github.event.pull_request.head.sha }}" > validated-head.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-validated-${{ steps.tree.outputs.tree }}
          path: validated-head.txt
          retention-days: 7
