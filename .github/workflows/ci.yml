# Contract gates (ADR-0054): the committed OpenAPI spec and the generated UI
# client must always match the code. A drifted spec fails the build — never a
# silently stale contract.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test gate (test-strategy Phase 0): the whole workspace suite runs against a
  # real Postgres (ADR-0017 — PG is a real collaborator, not a mock).
  # SCARAB_TEST_REQUIRE_PG=1 turns the harnesses' silent skip-without-PG into a
  # panic, so CI can never go green while quietly skipping the DB-backed tests.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scarab
          POSTGRES_PASSWORD: scarab
          POSTGRES_DB: scarab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U scarab -d scarab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SCARAB_TEST_DATABASE_URL: postgres://scarab:scarab@127.0.0.1:55432/scarab
      SCARAB_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run the suite
        run: cargo nextest run --workspace

  # Coverage + ratchet (sibling of `test` so the plain gate stays fast): lcov
  # via cargo-llvm-cov, per-crate summary in the step summary, and a fail if
  # any crate drops >0.5pp below docs/audits/coverage-baseline.toml.
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scarab
          POSTGRES_PASSWORD: scarab
          POSTGRES_DB: scarab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U scarab -d scarab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SCARAB_TEST_DATABASE_URL: postgres://scarab:scarab@127.0.0.1:55432/scarab
      SCARAB_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Run the suite under coverage
        # scarab-testkit is test scaffolding and tests/ dirs are harness code —
        # neither is product code we want in the coverage signal.
        run: >-
          cargo llvm-cov nextest --workspace
          --ignore-filename-regex 'crates/scarab-testkit/|/tests/'
          --lcov --output-path lcov.info
      - name: Per-crate summary + ratchet against baseline
        # The script also appends its table to $GITHUB_STEP_SUMMARY itself.
        run: python3 scripts/coverage_ratchet.py lcov.info docs/audits/coverage-baseline.toml
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full-route coverage is asserted by the test suite
      # (every_registered_route_is_in_the_openapi_spec); this job gates DRIFT:
      # the committed openapi.json must equal the generated one.
      - name: Regenerate the spec
        run: cargo run -p scarab-server -- --emit-openapi openapi.json
      - name: Fail on spec drift
        run: |
          git diff --exit-code openapi.json || {
            echo '::error::openapi.json is stale — run: cargo run -p scarab-server -- --emit-openapi openapi.json'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the UI client
        working-directory: ui/scarab-web-ui
        run: |
          npm ci
          npm run gen
          npm run typecheck
      - name: Fail on client drift
        run: |
          git diff --exit-code ui/scarab-web-ui/src/api/schema.ts || {
            echo '::error::the generated TS client is stale — run: npm run gen in ui/scarab-web-ui'
            exit 1
          }
