# The GitHub Release for a `v*` tag, with the library files as assets.
#
# Scarab's own libraries (libs/) are installed like any other library, from
# their git source at a release commit; the assets are copies for reading.
#
# The Release text is the tag's section of CHANGELOG.md, then the install
# lines (scripts/changelog.py notes), then GitHub's list of merged pull
# requests. The job fails before it creates anything when CHANGELOG.md has no
# section for the tag. `just release <version>` runs the same extraction
# before you tag (docs/RELEASING.md).
#
# Tags only: no pull request runs this. One small job, standard-library
# Python, no build.
name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the Release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the changelog reader
        run: python3 -I scripts/test_changelog.py
      - name: Write the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 -I scripts/changelog.py notes "$TAG" > release-notes.md
          cat release-notes.md
      - name: Create the Release and upload the assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --generate-notes appends GitHub's pull request list to the file's text.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --notes-file release-notes.md --generate-notes
          else
            echo "::notice::$TAG already has a Release; its text is left as it is"
          fi
          shopt -s nullglob
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            libs/*.yaml
