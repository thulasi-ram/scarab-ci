# Full-stack E2E, weekly + on-demand (test-strategy Phase 2): `just e2e`, the
# same recipe a developer runs. It brings the kind release up in its e2e mode
# (`deploy/kind/up.sh e2e`: cluster, Postgres, MinIO, the chart with a server
# binary built here) and drives it with the env-gated `scarab-e2e` crate;
# `crash_resume` SIGKILLs the server from the kind node. Deliberately NOT
# per-PR: it is the slowest tier, and a red run is triaged as a real timing
# bug (zero auto-retries).
#
# WEEKLY, not nightly, because Actions minutes are limited: it failed all 18
# nightly runs of Oct 1-19 2026 (~74 billed minutes) on the same red
# `crash_resume` case — a nightly repeat of a known failure buys no new signal.
# Dispatch it by hand after a fix; restore nightly once it is green and stays so.
name: e2e

on:
  schedule:
    - cron: "23 2 * * 1" # weekly, Mondays
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Debuginfo is the bulk of target/ and worthless in CI — without this the
      # workspace build exhausts the runner's disk (see ci.yml).
      CARGO_PROFILE_DEV_DEBUG: "0"
      # No e2e case reads the web UI; building it would cost npm ci + a vite build.
      SCARAB_KIND_SKIP_UI: "1"
    steps:
      # ONLY WHEN SHORT. The cleanup is slow (deleting ~30 GB of small files: 1.5-4
      # billed minutes a run), and today's runner images are 145 GB disks (113 GB
      # free AFTER this cleanup, measured 2026-10). Below 40 GB free it still runs
      # in full — the ENOSPC history is real; the step logs the before figure.
      - name: Free runner disk space (only if short)
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free before: ${avail}G"
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
            # Actions that install through the tool cache fail outright when
            # /opt/hostedtoolcache is missing ("Cache directory ... does not
            # exist"), so put the empty directory back.
            if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
              sudo mkdir -p "$AGENT_TOOLSDIRECTORY"
              sudo chown "$(id -u):$(id -g)" "$AGENT_TOOLSDIRECTORY"
            fi
            sudo docker system prune -af >/dev/null 2>&1 || true
          fi
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just,cargo-zigbuild@0.24.0
      # kind, Helm 4 and zig, pinned (see the action's header).
      - uses: ./.github/actions/kind-tools
      # The one canonical entrypoint (CLAUDE.md): the release in e2e mode,
      # the CLI build, the suite, crash_resume last; on a red run the recipe
      # prints the server's log.
      - name: Run the full-stack E2E suite
        run: just e2e
