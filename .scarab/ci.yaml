# Scarab's own CI — running on Scarab (dogfood, per docs/handoffs).
# A clone step provisions the source at the run's pinned SHA; a real Rust
# step type-checks a small crate and publishes a couple of artifacts of
# record. Kept deliberately small: an uncached in-Pod cargo build is slow
# (layer caching is future work, ADR-0018).
on:
  pull_request: {}
  push: {}

steps:
  - id: checkout
    clone: {}

  - id: check
    image: rust:1-bookworm
    needs: [checkout]
    # Root inside the caps-dropped, unprivileged, seccomp-confined sandbox
    # (self-service, ADR-0039) so cargo/rustc own their caches without
    # fighting the non-root workspace ownership.
    security:
      run_as_root: true
    command:
      - bash
      - -lc
      - |
        set -euxo pipefail
        rustc --version
        cargo check -p scarab-identity
        mkdir -p /scarab/artifacts
        rustc --version                 > /scarab/artifacts/toolchain.txt
        git -C /workspace rev-parse HEAD > /scarab/artifacts/checked-sha.txt
    artifacts:
      - "*.txt"
