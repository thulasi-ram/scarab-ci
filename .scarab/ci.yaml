# Scarab's own CI — running on Scarab (dogfood, per docs/handoffs).
# A clone step provisions the source at the run's pinned SHA; a real Rust
# step type-checks a small crate and publishes a couple of artifacts of
# record. Kept deliberately small: an uncached in-Pod cargo build is slow
# (layer caching is future work, ADR-0018).
# `push:` ONLY, and DELIBERATELY WITH NO BRANCH FILTER.
#
# Do not add a `when:` here. `.github/workflows/demo-keepalive.yml` force-pushes
# an empty commit to the `demo-keepalive` branch every four hours, and this
# pipeline compiling at THAT commit is the entire mechanism: it is what keeps the
# Oracle Always Free box from being reclaimed for idleness, and it is the public
# demo's only recurring run (nothing schedules `on: cron:` yet — see that
# workflow's header). A branch filter here makes those pushes silently produce no
# run, and the failure mode is a box that quietly disappears in a week. That is
# exactly what `push: { when: "event.branch == 'main'" }` did, briefly.
#
# `pull_request:` is gone instead, which fixes the original problem from the
# other side. A push to a branch with an open PR delivers BOTH a `push` and a
# `pull_request` event, so having both triggers ran this whole pipeline TWICE per
# PR push — clone, cargo and all. With `push:` alone every push produces exactly
# one run, and PRs still show the check: a commit status is keyed by SHA, and a
# PR displays the statuses of its head SHA regardless of which event started the
# run.
#
# The one thing this gives up: a fork PR pushes to the fork, so no webhook
# reaches this repo and no run starts. This repo has no fork contributors, and
# the alternative — keeping `pull_request:` — costs a duplicate run on every push
# from everyone who does contribute.
on:
  push: {}

steps:
  - id: checkout
    clone: {}

  - id: check
    image: rust:1-bookworm
    needs: [checkout]
    # The stock rust image's USER is root, so the non-root baseline would
    # reject it — opt into root (self-service, ADR-0039). But the baseline
    # drops CAP_DAC_OVERRIDE, and the CAS-restored /workspace is owned by the
    # clone's uid (65532), so uid-0 cannot write there. Cargo only needs to
    # READ the source from /workspace; send its writable target dir to a
    # container-owned path instead.
    security:
      run_as_root: true
    env:
      - [CARGO_TARGET_DIR, /tmp/scarab-target]
    command:
      # `-c`, not `-lc`: a login shell sources /etc/profile and resets PATH,
      # dropping the rust image's /usr/local/cargo/bin (rustc/cargo vanish).
      - bash
      - -c
      - |
        set -euxo pipefail
        rustc --version
        cargo check -p scarab-identity
        mkdir -p /scarab/artifacts
        rustc --version                  > /scarab/artifacts/toolchain.txt
        # uid 0 vs the clone's 65532-owned tree trips git's ownership guard.
        git config --global --add safe.directory /workspace
        git -C /workspace rev-parse HEAD > /scarab/artifacts/checked-sha.txt
    artifacts:
      - "*.txt"
