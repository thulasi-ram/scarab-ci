# Kitchen-sink dogfood pipeline — a believable lint -> test -> build -> deploy
# flow that exercises most of Scarab's authoring surface AND actually runs green
# on this repo, so it doubles as the local dogfood target. It is also validated
# in CI by `dogfood_sample_compiles` in crates/scarab-pipeline/src/lib.rs, so it
# is guaranteed to compile to IR. Read it as a tour of the DSL you can watch run.
#
# Every step is REAL: the commands run against this workspace, the build builds a
# Dockerfile that exists, and deploy/notify run a real image.
#
# Both evidence channels are exercised on purpose, so a broken one is visible:
#   - RESULTS (ADR-0041/0042) — small typed values, written as
#     /scarab/results/<name>.json, interpolated downstream as
#     ${{ outputs.<step>.<name> }}. `version` emits a string, a sha and a count;
#     `deploy` ASSERTS each one resolved. The `build` step also emits an `image`
#     result natively (BuildKit --metadata-file).
#   - ARTIFACTS (ADR-0052) — files of record under /scarab/artifacts/, selected
#     by `artifacts:` globs and downloadable at /v1/runs/{id}/artifacts. `lint`
#     publishes its fmt/clippy reports, each `test` leg its own cargo log, and
#     `version` a version.txt.
#
# Dispatching it locally (`just local-helm`, then POST .../dispatch):
#   - Use ref `main`. `deploy` is `when: event.branch == 'main'`, so on a PR it
#     and `notify` correctly SKIP — dispatch main to exercise the whole DAG.
#   - `approve` is a MANUAL gate: the run parks there until you approve it.

name: Dogfood — kitchen-sink pipeline

# --- on: triggers (ADR-0009/0010) -------------------------------------------
# push (filtered to main via a CEL `when:`), pull_request, and manual dispatch.
on:
  push:
    when: "event.branch == 'main'"
  pull_request: {}
  manual: {}

# --- interface.inputs: typed launch parameters (ADR-0043) -------------------
# A `choice` with a default, and a `string` with a default + a `validate:` CEL
# predicate. Referenced below via `${{ inputs.<name> }}`.
interface:
  inputs:
    - name: deploy_env
      type: choice
      required: false
      default: staging
      options: [staging, production]
      description: Which environment the deploy step targets.
    - name: image_tag
      type: string
      required: false
      default: latest
      validate: "value != ''"
      description: Container tag to build and deploy.

# --- environment (ADR-0024/0032): pipeline-level ----------------------------
# An `environment:` makes the whole pipeline a *deploy* — its runs are enforced
# against the environment's protection rules and opt out of newest-wins cancel.
# An environment that is REFERENCED but not defined resolves to
# `Governed { protection: None }` — still a deploy, permissive on rules — so
# this runs locally without seeding a `production` Environment first.
environment: production

# --- concurrency (ADR-0011/0032) + budget (ADR-0047) ------------------------
# Serialize deploys per target; the group key is interpolated at admission.
concurrency:
  group: "deploy-${{ inputs.deploy_env }}"
  policy: cancel-in-progress
# Active-time only (Running intervals), but an uncached in-Pod cargo build is
# slow and there is no layer caching yet (ADR-0018) — leave real headroom.
budget: 7200

# --- pipeline-level shared services (ADR-0058): "Shared" --------------------
# A Run-scoped standalone Postgres reachable cluster-wide at `postgres:5432`,
# opted into by a step's `uses:`. Its `ready:` probe gates opted-in steps until
# it is up. Services run under the ADR-0039 restricted baseline **non-root by
# default** (git-bug d2301fb): pin the official image's built-in uid with
# `run_as_user: 999` and the executor sets a matching Pod `fsGroup` so the
# emptyDir PGDATA is group-writable — no `run_as_root` grant needed.
services:
  - name: postgres
    image: postgres:16
    run_as_user: 999
    env:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports: [5432]
    ready:
      exec: [pg_isready, -U, postgres]

steps:
  # --- clone step (ADR-0045): zero-config source provisioning ---------------
  - id: checkout
    clone: {}

  # --- ordinary step + run_as_root grant (ADR-0039) + timeout (ADR-0047) ----
  # The stock rust image is USER root, so opt into the self-service run-as-root
  # grant. `needs: [checkout]` inherits the cloned workspace.
  - id: lint
    image: rust:1-bookworm
    needs: [checkout]
    security:
      run_as_root: true
    timeout: 900
    # `rust-toolchain.toml` pins `channel = "stable"`, which the official image
    # does not ship under that name — so EVERY cargo invocation makes rustup sync
    # the channel manifest over the network. Colima's egress DNS is flaky enough
    # that a1 fails and a2 succeeds, so retry the network, exactly as `test` does.
    retry:
      on: failure
      max: 2
    # The same two traps .scarab/ci.yaml documents. (1) The baseline drops
    # CAP_DAC_OVERRIDE and /workspace belongs to the clone's uid 65532, so uid 0
    # cannot write there — send cargo's target dir to a container-owned path.
    env:
      - [CARGO_TARGET_DIR, /tmp/scarab-target]
    command:
      # (2) `-c`, not `-lc`: a login shell sources /etc/profile and resets PATH,
      # dropping the rust image's /usr/local/cargo/bin (rustc/cargo vanish).
      - bash
      - -c
      - |
        set -euxo pipefail
        mkdir -p /scarab/artifacts
        # Scoped to crates that ARE rustfmt-clean: this workspace as a whole is
        # not, and a repo-wide `cargo fmt` would churn ~90 unrelated files.
        # `tee` so the report is a published artifact, not just scrollback;
        # `pipefail` above keeps the step's verdict the CHECK's, not tee's.
        cargo fmt -p scarab-identity -p scarab-pipeline -- --check 2>&1 | tee /scarab/artifacts/fmt.log
        cargo clippy -p scarab-identity -p scarab-pipeline 2>&1 | tee /scarab/artifacts/clippy.log
    # ARTIFACTS OF RECORD (ADR-0052): globs over what the step wrote to
    # /scarab/artifacts/. Browse them at /v1/runs/{id}/artifacts.
    artifacts:
      - "*.log"

  # --- matrix (ADR-0023) + shared-service uses + sidecar service (ADR-0058) --
  # + retry (ADR-0047). Fans across crate x mode (minus one excluded combo).
  # `uses: [postgres]` reaches the shared service; a Redis *sidecar* lives in
  # this step's own Pod at localhost:6379.
  - id: test
    image: rust:1-bookworm
    needs: [checkout]
    security:
      run_as_root: true
    timeout: 1800
    matrix:
      dimensions:
        crate: [scarab-identity, scarab-pipeline]
        mode: [check, test]
      exclude:
        # scarab-pipeline's `check` leg adds nothing over its `test` leg.
        - "crate == 'scarab-pipeline' && mode == 'check'"
    uses: [postgres]
    services:
      # Non-root by default (ADR-0058): pin redis's built-in uid so its emptyDir
      # is group-writable via the Pod fsGroup — no run_as_root needed.
      - image: redis:7.4
        run_as_user: 999
        ports: [6379]
        ready:
          tcp: 6379
    retry:
      on: failure
      max: 2
    env:
      - [CARGO_TARGET_DIR, /tmp/scarab-target]
      - [DATABASE_URL, "postgres://postgres:test@postgres:5432/app_test"]
      - [REDIS_URL, "redis://localhost:6379"]
    command:
      - bash
      - -c
      - |
        set -euxo pipefail
        # Prove BOTH service shapes are genuinely reachable, via bash's /dev/tcp
        # so no client needs installing: the Shared service by DNS name
        # cluster-wide, the sidecar on this Pod's own localhost.
        timeout 30 bash -c 'until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do sleep 1; done'
        timeout 30 bash -c 'until (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; do sleep 1; done'
        mkdir -p /scarab/artifacts
        # Named per instance, so the three legs publish three DISTINCT artifacts
        # rather than racing over one name — the matrix-artifact proof.
        cargo ${{ matrix.mode }} -p ${{ matrix.crate }} 2>&1 \
          | tee "/scarab/artifacts/${{ matrix.mode }}-${{ matrix.crate }}.log"
    artifacts:
      - "*.log"

  # --- named step result consumed downstream (ADR-0041) ---------------------
  # This step publishes a `tag` result at runtime (results API, ADR-0042); the
  # deploy step reads it via `${{ outputs.version.tag }}`.
  - id: version
    # Deliberately the rust image rather than a bare alpine: it already ships git
    # (2.39.5), so this step needs NO network at all. `apk add --no-cache git` was
    # the whole reason it used to fail on flaky egress DNS, and a step that only
    # reads the checkout should not depend on a package mirror. Plain `git` runs
    # no rustup shim, so the channel sync that costs lint/test does not apply.
    image: rust:1-bookworm
    needs: [checkout]
    # The rust image is USER root, so opt into the self-service run-as-root grant
    # (like lint/test above) — without it the kubelet refuses the container under
    # the non-root baseline (CreateContainerConfigError).
    security:
      run_as_root: true
    retry:
      on: failure
      max: 2
    command:
      - bash
      - -c
      - |
        set -euxo pipefail
        mkdir -p /scarab/artifacts
        # Belt-and-braces against git's ownership guard: this step runs as a
        # different uid than the clone (which owns the tree as 65532).
        git config --global --add safe.directory /workspace
        # This repo carries no tags, so --always falls back to the short SHA.
        tag=$(git -C /workspace describe --tags --always)
        sha=$(git -C /workspace rev-parse HEAD)
        commits=$(git -C /workspace rev-list --count HEAD)

        # RESULTS (ADR-0041/0042). The trusted egress sidecar drains
        # `<name>.json` and NOTHING ELSE, and each file must hold valid JSON —
        # the result name is the filename minus `.json`. Writing a bare
        # `/scarab/results/tag` (as this sample used to) silently publishes
        # nothing: the sidecar logs "no results to drain" and the step still
        # passes, so the outputs.version.tag reference downstream resolves
        # empty. (Deliberately NOT spelled with the interpolation braces here:
        # launch-time interpolation is textual and reads this whole command
        # string — a shell comment included — and a braced self-reference to
        # this step's own outputs can never resolve, failing the step before
        # any Pod exists. That was git-bug 8de85a8.)
        printf '"%s"\n' "$tag"     > /scarab/results/tag.json      # JSON string
        printf '"%s"\n' "$sha"     > /scarab/results/commit.json   # JSON string
        printf '%s\n'   "$commits" > /scarab/results/commits.json  # JSON number

        # ARTIFACTS: the same facts as a file of record, to contrast the two
        # channels — results are small typed values the DAG can interpolate,
        # artifacts are files you download afterwards.
        printf 'tag=%s\ncommit=%s\ncommits=%s\n' "$tag" "$sha" "$commits" \
          > /scarab/artifacts/version.txt
    artifacts:
      - "*.txt"

  # --- build step (ADR-0018): rootless BuildKit image build -----------------
  # + resources (ADR-0055). The author names no image/command (the blessed
  # BuildKit image runs); just what to build. `docker/clone` is a REAL
  # self-contained context — a small alpine image with no cargo build in it, so
  # this leg stays fast; `dockerfile:` is resolved inside the context dir.
  #
  # NOTE: `placement_profiles: [...]` belongs here too, but an unregistered
  # profile is a HARD failure ("unknown placement_profile ... not in the
  # registry"), so it is left off until a profile is seeded for the cluster.
  - id: build
    needs: [lint, test]
    build:
      context: docker/clone
      dockerfile: Dockerfile
      image: ghcr.io/thulasi-ram/scarab-clone
      push: false
    # Sized to fit a single-node colima, not a real build farm.
    resources:
      cpu_millis: 1000
      memory_mib: 2048

  # --- gate (ADR-0008): manual approval before deploy -----------------------
  # + gate_expires_after (ADR-0047): fail the gate if unapproved after a day.
  - id: approve
    gate: manual
    needs: [build]
    gate_expires_after: 86400

  # --- deploy: when: conditional (ADR-0033) + inputs/outputs interpolation --
  # Runs only on main; consumes both launch inputs and the `version.tag` result.
  - id: deploy
    image: alpine:3.20
    needs: [approve, version]
    when: "event.branch == 'main'"
    security:
      run_as_root: true
    env:
      - [RELEASE_TAG, "${{ inputs.image_tag }}"]
      - [TARGET_ENV, "${{ inputs.deploy_env }}"]
      - [PREV_VERSION, "${{ outputs.version.tag }}"]
      - [PREV_COMMIT, "${{ outputs.version.commit }}"]
      - [COMMIT_COUNT, "${{ outputs.version.commits }}"]
    command:
      - sh
      - -c
      - |
        set -eu
        # A real command over the interpolated values. The point is that all
        # three RESOLVED, not that anything ships — so assert the cross-step
        # one is non-empty rather than trusting the echo.
        echo "deploying tag=$RELEASE_TAG env=$TARGET_ENV prev=$PREV_VERSION"
        echo "from commit=$PREV_COMMIT (#$COMMIT_COUNT on this history)"
        # Assert every interpolation RESOLVED rather than trusting the echo — an
        # unpublished result interpolates to empty and would otherwise pass
        # silently. This is what catches a broken results channel.
        test -n "$PREV_VERSION"
        test -n "$PREV_COMMIT"
        test -n "$COMMIT_COUNT"
        # The 40-char commit proves a STRING result survived round-trip, and the
        # digits prove a NUMBER one did.
        test "${#PREV_COMMIT}" -eq 40
        echo "$COMMIT_COUNT" | grep -qE '^[0-9]+$'

  # --- invoke (ADR-0038): inline a library pipeline with typed inputs -------
  - id: notify
    invoke: .scarab/lib/notify.yaml
    needs: [deploy]
    with:
      channel: deploys
