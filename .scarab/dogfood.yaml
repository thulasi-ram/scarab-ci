# Kitchen-sink sample pipeline — a believable build -> test -> deploy flow that
# happens to exercise most of Scarab's authoring surface. It is validated in CI
# by `dogfood_sample_compiles` in crates/scarab-pipeline/src/lib.rs, so this file
# is guaranteed to compile to IR. Read it as a tour of the DSL.

name: Dogfood — kitchen-sink pipeline

# --- on: triggers (ADR-0009/0010) -------------------------------------------
# push (filtered to main via a CEL `when:`), pull_request, and manual dispatch.
on:
  push:
    when: "event.branch == 'main'"
  pull_request: {}
  manual: {}

# --- interface.inputs: typed launch parameters (ADR-0043) -------------------
# A `choice` with a default, and a `string` with a default + a `validate:` CEL
# predicate. Referenced below via `${{ inputs.<name> }}`.
interface:
  inputs:
    - name: deploy_env
      type: choice
      required: false
      default: staging
      options: [staging, production]
      description: Which environment the deploy step targets.
    - name: image_tag
      type: string
      required: false
      default: latest
      validate: "value != ''"
      description: Container tag to build and deploy.

# --- environment (ADR-0024/0032): pipeline-level ----------------------------
# An `environment:` makes the whole pipeline a *deploy* — its runs are enforced
# against the environment's protection rules and opt out of newest-wins cancel.
environment: production

# --- concurrency (ADR-0011/0032) + budget (ADR-0047) ------------------------
# Serialize deploys per target; the group key is interpolated at admission.
concurrency:
  group: "deploy-${{ inputs.deploy_env }}"
  policy: cancel-in-progress
budget: 3600

# --- pipeline-level shared services (ADR-0058): "Shared" --------------------
# A Run-scoped standalone Postgres reachable cluster-wide at `postgres:5432`,
# opted into by a step's `uses:`. Its `ready:` probe gates opted-in steps until
# it is up. Services run under the ADR-0039 restricted baseline **non-root by
# default** (git-bug d2301fb): pin the official image's built-in uid with
# `run_as_user: 999` and the executor sets a matching Pod `fsGroup` so the
# emptyDir PGDATA is group-writable — no `run_as_root` grant needed.
services:
  - name: postgres
    image: postgres:16
    run_as_user: 999
    env:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports: [5432]
    ready:
      exec: [pg_isready, -U, postgres]

steps:
  # --- clone step (ADR-0045): zero-config source provisioning ---------------
  - id: checkout
    clone: {}

  # --- ordinary step + run_as_root grant (ADR-0039) + timeout (ADR-0047) ----
  # The stock rust image is USER root, so opt into the self-service run-as-root
  # grant. `needs: [checkout]` inherits the cloned workspace.
  - id: lint
    image: rust:1-bookworm
    needs: [checkout]
    security:
      run_as_root: true
    timeout: 600
    command: [bash, -c, "cargo fmt --check && cargo clippy"]

  # --- matrix (ADR-0023) + shared-service uses + sidecar service (ADR-0058) --
  # + retry (ADR-0047). Fans across toolchain x features (minus one excluded
  # combo). `uses: [postgres]` reaches the shared service; a Redis *sidecar*
  # lives in this step's own Pod at localhost:6379.
  - id: test
    image: rust:1-bookworm
    needs: [checkout]
    security:
      run_as_root: true
    matrix:
      dimensions:
        toolchain: [stable, beta]
        features: [default, all]
      exclude:
        - "toolchain == 'beta' && features == 'all'"
    uses: [postgres]
    services:
      # Non-root by default (ADR-0058): pin redis's built-in uid so its emptyDir
      # is group-writable via the Pod fsGroup — no run_as_root needed.
      - image: redis:7.4
        run_as_user: 999
        ports: [6379]
        ready:
          tcp: 6379
    retry:
      on: failure
      max: 2
    env:
      - [DATABASE_URL, "postgres://postgres:test@postgres:5432/app_test"]
      - [REDIS_URL, "redis://localhost:6379"]
    command: [bash, -c, "cargo test --features ${{ matrix.features }}"]

  # --- named step result consumed downstream (ADR-0041) ---------------------
  # This step publishes a `tag` result at runtime (results API, ADR-0042); the
  # deploy step reads it via `${{ outputs.version.tag }}`.
  - id: version
    image: alpine:3.20
    needs: [checkout]
    command: [sh, -c, "git describe --tags --always > /scarab/results/tag"]

  # --- build step (ADR-0018): rootless BuildKit image build -----------------
  # + placement_profiles + resources (ADR-0055). The author names no
  # image/command (the blessed BuildKit image runs); just what to build.
  - id: build
    needs: [lint, test]
    build:
      context: .
      dockerfile: Dockerfile
      image: ghcr.io/acme/app
      push: false
    placement_profiles: [build-nodes]
    resources:
      cpu_millis: 4000
      memory_mib: 8192

  # --- gate (ADR-0008): manual approval before deploy -----------------------
  # + gate_expires_after (ADR-0047): fail the gate if unapproved after a day.
  - id: approve
    gate: manual
    needs: [build]
    gate_expires_after: 86400

  # --- deploy: when: conditional (ADR-0033) + inputs/outputs interpolation --
  # Runs only on main; consumes both launch inputs and the `version.tag` result.
  - id: deploy
    image: ghcr.io/acme/deployer:1.4.2
    needs: [approve, version]
    when: "event.branch == 'main'"
    env:
      - [RELEASE_TAG, "${{ inputs.image_tag }}"]
      - [TARGET_ENV, "${{ inputs.deploy_env }}"]
      - [PREV_VERSION, "${{ outputs.version.tag }}"]
    command: [sh, -c, "deploy --tag $RELEASE_TAG --env $TARGET_ENV"]

  # --- invoke (ADR-0038): inline a library pipeline with typed inputs -------
  - id: notify
    invoke: .scarab/lib/notify.yaml
    needs: [deploy]
    with:
      channel: deploys
