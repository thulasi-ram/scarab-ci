# A small reusable **library** (ADR-0038, ADR-0076): invoked and inlined at
# compile time by dogfood.yaml's `notify` step (`invoke: file:.scarab/lib/notify.yaml`).
# `kind: library` marks the file: it has no triggers and never runs on its own.
# A library declares its `interface` (the inputs a caller passes via `with:`);
# its steps are flattened into the caller's DAG, id-namespaced by the
# invoke-step id.
kind: library

interface:
  inputs:
    # A typed, optional input with a default, supplied by the caller's `with:`.
    # `${{ inputs.channel }}` below reads it when the step launches, and every
    # inlined step also gets it as `SCARAB_PARAM_CHANNEL`.
    - name: channel
      type: string
      required: false
      default: general
      description: Chat channel to post the deploy notification to.

steps:
  - id: post
    # A non-root user given by NUMBER. Steps run with runAsNonRoot, and the
    # kubelet refuses an image whose USER is a name (curlimages/curl's
    # `curl_user`): it cannot check that the name is not root.
    image: cgr.dev/chainguard/busybox:latest@sha256:9cf938251dfb3cc081ef9847e79c203b5de90ecc20855e40bef8a7cc191bb218
    # `${{ inputs.channel }}` reads the caller's `with: { channel: … }`. It goes
    # in through env, not into the script: a value in a script becomes code.
    env:
      - [CHANNEL, "${{ inputs.channel }}"]
    command:
      - sh
      - -c
      - 'echo "posting deploy notification to #$CHANNEL"'
