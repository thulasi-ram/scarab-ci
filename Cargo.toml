# Scarab — durable-execution, k8s-native CI system.
#
# Hexagonal architecture with compiler-enforced purity:
#   * Pure domain crates depend ONLY on serde / serde_json / thiserror /
#     async-trait and on each other. They list NO infra crate (sqlx, kube,
#     reqwest, object_store, axum, tokio-runtime, aws) in their Cargo.toml.
#     A further I/O-free library (`cel-interpreter`, `sha2`, `tracing`) may be
#     admitted per ADR-0031 when the capability is part of the domain rather
#     than of a backend — see the `allowed inside pure domain crates` block
#     below, and the justification each admitting crate carries next to its own
#     dependency line, so the exception is argued rather than assumed.
#   * Adapter crates pair a domain crate with exactly one infra crate and
#     hold the stub `impl`s of that domain's ports.
#   * The purity boundary is enforced by crate dependency edges: an infra
#     crate simply cannot be named inside a pure crate's manifest.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- allowed inside pure domain crates -------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# CEL: pure computation (no I/O / clock / RNG / infra) → allowed in pure crates per ADR-0031.
cel-interpreter = { version = "0.10", features = ["json"] }
thiserror = "2"
async-trait = "0.1"
# The I/O-free-library carve-out (ADR-0031, amending ADR-0016). These two sit
# HERE, not under
# `infra` below, because a pure crate may name them — the header above and this
# table have to agree or the boundary is decided by whichever one a reader
# happens to check. Each admitting crate still argues the exception next to its
# own dependency line (see `crates/scarab-storage/Cargo.toml`).
#
# `sha2`: SHA-256 is a pure function, and ADR-0029 makes the content address a
# DOMAIN fact — a snapshot *is* the merkle root of its canonical tree bytes.
sha2 = "0.10"
# `tracing`: a facade, not a backend. No I/O, no clock, no sockets; without a
# subscriber every macro compiles to nothing, and the subscriber is installed by
# the composition root. Admitted so a pure crate whose behaviour only exists as
# a log line (e.g. `TieredCas`'s loud-but-non-fatal warm-write failure) can be
# loud instead of silently swallowing.
tracing = "0.1"

# --- internal crates (path deps) -------------------------------------------
scarab-engine = { path = "crates/scarab-engine" }
scarab-pipeline = { path = "crates/scarab-pipeline" }
scarab-forge = { path = "crates/scarab-forge" }
scarab-identity = { path = "crates/scarab-identity" }
scarab-secrets = { path = "crates/scarab-secrets" }
scarab-storage = { path = "crates/scarab-storage" }
scarab-project = { path = "crates/scarab-project" }
scarab-db-postgres = { path = "crates/scarab-db-postgres" }
scarab-forge-github = { path = "crates/scarab-forge-github" }
scarab-forge-forgejo = { path = "crates/scarab-forge-forgejo" }
scarab-secrets-postgres = { path = "crates/scarab-secrets-postgres" }
scarab-storage-s3 = { path = "crates/scarab-storage-s3" }
# ADR-0061: the workspace service's client, behind both `Cas` and
# `ContentSource`. An adapter over reqwest — no kube, so the node driver can use
# it without linking the kubernetes executor.
scarab-workspace-client = { path = "crates/scarab-workspace-client" }
scarab-executor-k8s = { path = "crates/scarab-executor-k8s" }
scarab-executor-local = { path = "crates/scarab-executor-local" }
scarab-testkit = { path = "crates/scarab-testkit" }

# --- infra (only inside adapter / binary crates) ---------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
utoipa = { version = "5" }
uuid = { version = "1", features = ["v4", "v7"] }
futures = "0.3"
regex-lite = "0.1"
flate2 = "1"
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
# NB `tracing` itself is NOT here — it is a pure-crate-admissible facade, listed
# in the allowed block above. `tracing-subscriber` IS infra: it is the backend
# that actually writes, installed only by the composition root.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Pin the rustls default CryptoProvider (ring) at the composition root; see the
# note in scarab-server/src/main.rs. `ring` matches sqlx's `tls-rustls-ring`.
rustls = { version = "0.23", features = ["ring"] }
object_store = { version = "0.14", features = ["aws"] }
# NB `sha2` is NOT here — see the allowed block above. `hmac` stays: it needs a
# key, which is a deployment secret, so it belongs to a boundary not a domain.
hmac = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand = "0.8"
base64 = "0.22"
jsonwebtoken = "9"
tar = "0.4"
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
kube = { version = "4", default-features = false, features = ["client", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest"] }

# ---------------------------------------------------------------------------
# Build profiles — tuned for disk, not for a debugger.
#
# `target/` grew to 100 GB in this checkout (66 GB of deps, 34 GB of
# incremental caches) because cargo never garbage-collects: every fingerprint
# change writes a new artifact and keeps the old one forever. Full DWARF made
# each of those artifacts as large as possible.
#
# `line-tables-only` keeps what we actually read — file and line in panics,
# backtraces, and nextest failure output — and drops the variable-level debug
# info we never use (this codebase is debugged through test output, not lldb).
# CI is stricter still: it sets CARGO_PROFILE_DEV_DEBUG=0, and the env var wins
# over this, so CI behaviour is unchanged.
#
# Attach a debugger by overriding for one run:
#   CARGO_PROFILE_DEV_DEBUG=2 cargo test -p <crate>
[profile.dev]
debug = "line-tables-only"
